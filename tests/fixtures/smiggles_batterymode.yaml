                        var C_TRUE   = "var(--smiggles-green)";  /* True  */

                        var C_FALSE  = "var(--smiggles-text-dim)";  /* False */

                        var C_POS    = "var(--smiggles-green)";  /* positive
                        dollar amounts */

                        var C_NEG    = "var(--smiggles-darkred)";  /* negative
