              {% set price = states('sensor.amber_5min_current_general_price') | float(0) %}
              {{ (energy - last) * 1000 * price }}
            {% endmacro %}

            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('delta_cost', 0) }}
