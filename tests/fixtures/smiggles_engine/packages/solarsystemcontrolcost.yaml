        unique_id: solarsystemcontrolbuytotal
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total

        ##################################################################
        # LIFETIME TOTAL
        ##################################################################
        state: >
          {% macro calc_delta() %}
