            {% endmacro %}

            {% set change = calc_delta() | float(0) %}
            {% set stored = as_datetime(this.attributes.get('trackingA_marker')) %}
            {% set init = 0 | float(0) %}

            {% if trigger is defined and trigger.platform == 'event' %}
                {{ this.attributes.get('trackingA_Cost', 0) }}
            {% else %}
                {% if stored < now() %}
                  {{ change | round(4) }}
                {% elif init != 0 %} 
                  {{ init }}  
                {% else %}
                  {{ (this.attributes.get('trackingA_Cost', 0) | float(0) + change) | round(4) }}
                {% endif %}
            {% endif %}
            
          trackingA_kwh: >
            {% macro calc_delta() %}
              {% set energy = states('sensor.sigen_plant_total_imported_energy') | float(0) %}
              {% set last = this.attributes.get('last_energy', energy) | float(0) %}
              {{ (energy - last) * 1000 }}
            {% endmacro %}

            {% set change = calc_delta() | float(0) %}
            {% set stored = as_datetime(this.attributes.get('trackingA_marker')) %}
            {% set init = 0 | float(0) %}

            {% if trigger is defined and trigger.platform == 'event' %}
