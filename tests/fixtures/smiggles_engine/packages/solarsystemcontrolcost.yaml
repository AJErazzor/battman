            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('day_marker', now().date()) }}
            {% else %}
              {{ now().date() }}
            {% endif %} 
            
          yesterday: >
            {% set today = now().date() | string %}
            {% set stored = this.attributes.get('day_marker') %}
            {% set init = 0 | float(0) %}

            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('yesterday', 0) }}
            {% else %}
                {% if stored != today %}
                  {{ this.attributes.get('day', 0) | float(0) }}
                {% elif init != 0 %} 
                  {{ init }}    
                {% else %}
                  {{ this.attributes.get('yesterday', 0) | float(0) }}
                {% endif %}
            {% endif %} 
            
