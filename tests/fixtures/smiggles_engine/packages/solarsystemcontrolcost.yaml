              {{ 0 }}
            {% elif trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('days', 0) }}
            {% else %}
                {% if stored != today %}
                  {{ (this.attributes.get('days', 0) | float(0)) + 1 }}
