template:
  - trigger:
     
      - platform: event
        event_type: solarsystemcontroltotalattribute

      - platform: state
        entity_id: binary_sensor.solarsystemcontrolestimatedprice
        from: "off"
        to: "on"
        
    condition:
      - condition: template
        value_template: >
          {% set importedEnergy = states('sensor.sigen_plant_total_imported_energy') | float(0) %}
          {% set importedLast = state_attr('sensor.solarsystemcontrolbuytotal', 'last_energy') | float(0) %}
          {% set exportedEnergy = states('sensor.sigen_plant_total_exported_energy') | float(0) %}
          {% set exportedLast = state_attr('sensor.solarsystemcontrolselltotal', 'last_energy') | float(0) %}
          {{ importedEnergy > 0 and importedEnergy >= importedLast and exportedEnergy > 0 and exportedEnergy >= exportedLast}}    

    sensor:
