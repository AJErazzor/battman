            {% if today.day >= bill_day %}
              {% set period = today.strftime('%Y-%m') %}
            {% else %}
              {% set prev = today.replace(day=1) - timedelta(days=1) %}
              {% set period = prev.strftime('%Y-%m') %}
            {% endif %}

            {% set stored = this.attributes.get('bill_marker') %}
            {% set init = 0 | float(0) %}

            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('bill', 0) }}
            {% else %}
