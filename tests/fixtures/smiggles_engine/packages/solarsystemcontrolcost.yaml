            {% set price = states('sensor.amber_5min_current_general_price') | float(0) %}
            {{ (energy - last) * 1000 * price }}
          {% endmacro %}
          
          {% if trigger is defined and trigger.platform == 'event' and trigger.event.data.attribute is defined and trigger.event.data.attribute == 'ResetTotals' %}
            {{ 0 }}
          {% elif trigger is defined and trigger.platform == 'event' %}
            {{ this.state }}
          {% else %}
            {{ (this.state | float(0) + calc_delta() | float(0)) | round(4) }}
          {% endif %}    

        attributes:

          ##################################################################
          # Last energy reading
          ##################################################################
          last_energy: >
            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('last_energy', 0) }}
            {% else %}
              {{ states('sensor.sigen_plant_total_imported_energy') | float(0) }}
            {% endif %}     
            
          ##################################################################
          # price
          ##################################################################
          price: >
            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('price', 0) }}
            {% else %}
              {{ states('sensor.amber_5min_current_general_price') | float(0) }}
            {% endif %} 
            
          ##################################################################
          # usage
          ##################################################################
          usage: >
            {% macro calc_delta() %}
              {% set energy = states('sensor.sigen_plant_total_imported_energy') | float(0) %}
              {% set last = this.attributes.get('last_energy', energy) | float(0) %}
