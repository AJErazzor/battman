            {% if trigger is defined and trigger.platform == 'event' %}
              {{ this.attributes.get('day', 0) }}
            {% else %}
                {% if stored != today %}
                  {{ change | round(4) }}
                {% elif init != 0 %} 
                  {{ init }}  
                {% else %}
                  {{ (this.attributes.get('day', 0) | float(0) + change) | round(4) }}
                {% endif %}
            {% endif %} 
           
