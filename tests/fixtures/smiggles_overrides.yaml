                          : "<div style=\"font-size:13px;font-weight:800;color:var(--smiggles-text-dim);margin-bottom:13px\">Timer is off</div>";
                        var ext = "";

                        [["+15m", 900], ["+30m", 1800], ["+1h", 3600], ["+2h",
                        7200]].forEach(function (e) {
                          ext += "<span class=\"sh-x sscb\" data-s=\"" + e[1] + "\" style=\"" + CH + ";border:1px solid var(--smiggles-blue-border);color:" + C + "\">" + (live ? e[0] : e[0].replace("+", "")) + "</span>";
                        });

                        var runs = L.runUntilList(HH());

                        var run = "";

                        runs.forEach(function (r) {
                          run += "<span class=\"sh-r sscb\" data-at=\"" + r[2] + "\" data-s=\"" + r[1] + "\" style=\"" + CH + ";border:1px solid var(--smiggles-border-neutral-soft);color:var(--smiggles-text-muted)\">" + r[0] + "</span>";
                        });

                        root.innerHTML = "<style>.sscb{transition:filter
                        .1s,transform
                        .1s}.sscb:active{transform:scale(0.94);filter:brightness(1.6)}</style>"
                          + head
