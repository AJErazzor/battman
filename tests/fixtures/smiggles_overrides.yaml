            hold_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data:
                  title: ''
                  content: |
                    [[[
                      return '<div style="background:var(--smiggles-surface-popup);padding:14px 16px;border-radius:8px;font-family:var(--smiggles-font);">'
                        + '<div style="font-size:9px;font-weight:700;color:var(--smiggles-text-muted);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--smiggles-border-neutral-soft);">Override Dock</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:11px;">Rows appear below the dock when an override is active or pinned. The override timer follows the same rule.</div>'
                        + '<div style="border-top:1px solid var(--smiggles-border-neutral-soft);margin:8px 0;"></div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-text-bright);font-weight:600;">Dock tap:</span> control centre \u2014 presets, values, pins and the override timer.</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-text-bright);font-weight:600;">Row tap:</span> quick-edit. <span style="color:var(--smiggles-text-bright);font-weight:600;">Double-tap:</span> clear. <span style="color:var(--smiggles-text-bright);font-weight:600;">Hold:</span> help.</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-amber);font-weight:600;">No reset:</span> shown on the right of the dock, with a dot per locked override, and the dock border turns amber. A locked override will NOT clear itself when its target is met.</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-teal);font-weight:600;">Net target:</span> a daily net goal (sell) or budget (buy), set in the control centre. When net today passes it the watchdog clears that side and the dock shows TARGET MET or BUDGET REACHED until the timer ends, a new target is set, or midnight. The No Reset chip hides while a target is shown; padlocks on rows still apply.</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-text-bright);font-weight:600;">Override timer:</span> when running it shows as its own row. Tap the clock \u2014 there or in the control centre \u2014 for the timer sheet: extend chips, run-until chips, or an exact finish time. Pin it to keep it visible while it is off.</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-text-bright);font-weight:600;">Presets:</span> a preset saved with an Until time re-resolves that time every time it is applied.</div>'
                        + '<div style="margin-bottom:4px;color:var(--smiggles-text-muted);font-size:10px;"><span style="color:var(--smiggles-text-bright);font-weight:600;">Preset names:</span> up to ~9 characters keep the row as-is. Longer names shrink the cost value in steps, then move it beside the kWh figure.</div>'
                        + '<div style="margin-top:10px;padding:6px 8px;background:var(--smiggles-yellow-soft-bg);border-left:2px solid var(--smiggles-yellow);border-radius:3px;font-size:10px;color:var(--smiggles-yellow);font-weight:700;letter-spacing:0.02em;">\u26a1 Spike Rules will always override everything</div>'
                        + '</div>';
                    ]]]
