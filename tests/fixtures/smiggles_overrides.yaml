# The original Smiggles Power view card, kept unchanged so tests can check the Battman
# card against it. Never shipped; test data only.
      - type: vertical-stack
        version: 0.10.8
        card_mod:
          style:
            .: ':host { --stack-card-gap: 2px; }'
            $: '.content { gap: 2px !important; }'
        cards:
          - type: custom:button-card
            variables:
              ssc:
                params_entity: sensor.solarsystemcontrolparameters
                soc_entity: sensor.sigen_plant_battery_state_of_charge
                timer_entity: timer.solarsystemoverridetimer
                forecast_entity: sensor.amber_billing_interval_forecasts_general_price
                charge_kw_entity: sensor.sigen_plant_available_max_active_power
                capacity_entity: sensor.sigen_plant_rated_energy_capacity
                price_field: advanced_price_predicted
                round_step_cents: 1
                safety_min_minutes: 30
                safety_min_intervals: 2
                event_name: solarsystemcontrolparametersupdate
                sell_total_entity: sensor.solarsystemcontrolselltotal
                buy_total_entity: sensor.solarsystemcontrolbuytotal
                net_src: >
                  var st = states || {};

                  function day(e) { var x = st[e]; return x && x.attributes ?
                  (parseFloat(x.attributes.day) || 0) : 0; }

                  var net = day(S.sell_total_entity) - day(S.buy_total_entity) -
                  (parseFloat(a.dailyNetworkCharge) || 0);

                  var ts = parseFloat(a.netTargetSellPrice) || 0, tb =
                  parseFloat(a.netTargetBuyPrice) || 0;

                  function met(v) {
                    if (!v || typeof v !== "string" || v.indexOf("|") < 0) return null;
                    var p = v.split("|"), t = new Date(p[0].trim().replace(/\.\d+/, ""));
                    if (isNaN(t.getTime())) return null;
                    var n = new Date();
                    if (t.getFullYear() !== n.getFullYear() || t.getMonth() !== n.getMonth() || t.getDate() !== n.getDate()) return null;
                    return { t: t, v: parseFloat(p[1]) || 0 };
                  }

                  function money(v) { var n = Math.abs(v) < 0.005 ? 0 : v;
                  return (n < 0 ? "\u2212" : "") + "$" + Math.abs(n).toFixed(2);
                  }

                  var mode = ts !== 0 ? "sell" : (tb !== 0 ? "buy" : "");

                  var tgt = mode === "sell" ? ts : tb;

                  var sm = met(a.netTargetSellMet), bm = met(a.netTargetBuyMet),
                  metK = "";

                  if (!mode) { if (sm && (!bm || sm.t >= bm.t)) metK = "sell";
                  else if (bm) metK = "buy"; }

                  var rem = mode === "sell" ? tgt - net : (mode === "buy" ? net
                  - tgt : 0);

                  if (rem < 0) rem = 0;

                  return { net: net, mode: mode, target: tgt, be: mode !== "" &&
                  Math.abs(tgt) < 0.005, rem: rem, met: metK, metAt: metK ===
                  "sell" ? sm.t : (metK === "buy" ? bm.t : null), active: mode
                  !== "" || metK !== "", money: money };
                kwh_per_pct: 0.403
                overrides:
                  - id: sell
                    name: Sell Override
                    row_label: SELL<br>OVERRIDE
                    color: var(--smiggles-green)
                    dim: var(--smiggles-green-border)
                    shade: var(--smiggles-green-wash)
                    shade_border: var(--smiggles-green-border-soft)
                    bg: var(--smiggles-green-soft-bg)
                    attr_soc: sellOverrideSOC
                    attr_price: sellOverridePrice
                    attr_reset: sellOverrideAllowReset
                    price_rule: above
                    direction: down
                    money_label: EARN
                    special_at: 100
                    special_desc: NO SELLING
                    label_soc: SOC %
                    label_price: PRICE ¢
                    help_soc: >-
                      Fixed battery level to sell down to, overriding the normal
                      time-based curve. Setting 100% means no selling at all.
                    help_price: >-
                      Minimum sell price — energy only sold if price is above
                      this value.
                    attr_pin: sellOverridePinned
                  - id: sellsolar
                    name: Sell Solar
                    row_label: SELL<br>SOLAR
                    color: var(--smiggles-orange)
                    dim: var(--smiggles-orange-border)
                    shade: var(--smiggles-orange-wash)
                    shade_border: var(--smiggles-orange-border-soft)
                    bg: var(--smiggles-orange-soft-bg)
                    attr_soc: sellSolarSOC
                    attr_price: sellSolarPrice
                    attr_reset: sellSolarAllowReset
                    price_rule: above
                    direction: down
                    money_label: EARN
                    special_at: 0
                    special_desc: ''
                    label_soc: SOC %
                    label_price: PRICE ¢
                    help_soc: >-
                      Battery level threshold for solar selling, overriding the
                      normal time-based curve.
                    help_price: >-
                      Minimum sell price — solar only sold if price is above
                      this value.
                    attr_pin: sellSolarPinned
                  - id: buy
                    name: Buy Override
                    row_label: BUY<br>OVERRIDE
                    color: var(--smiggles-yellow)
                    dim: var(--smiggles-yellow-border)
                    shade: var(--smiggles-yellow-wash)
                    shade_border: var(--smiggles-yellow-border-soft)
                    bg: var(--smiggles-yellow-soft-bg)
                    attr_soc: buyOverrideSOC
                    attr_price: buyOverridePrice
                    attr_reset: buyOverrideAllowReset
                    price_rule: below
                    direction: up
                    money_label: COST
                    special_at: 0
                    special_desc: ''
                    label_soc: SOC %
                    label_price: PRICE ¢
                    help_soc: >-
                      Fixed battery level to buy up to, overriding the normal
                      time-based curve.
                    help_price: >-
                      Maximum buy price — energy only bought if price is below
                      this value.
                    allow_negative: true
                    attr_pin: buyOverridePinned
                  - id: any
                    name: Buy Anytime
                    row_label: BUY<br>ANYTIME
                    color: var(--smiggles-purple)
                    dim: var(--smiggles-purple-border)
                    shade: var(--smiggles-purple-wash)
                    shade_border: var(--smiggles-purple-border-soft)
                    bg: var(--smiggles-purple-soft-bg)
                    attr_soc: buyAnytimeSOC
                    attr_price: buyAnytimePrice
                    attr_reset: buyAnytimeAllowReset
                    price_rule: below
                    direction: up
                    money_label: COST
                    special_at: 0
                    special_desc: ''
                    label_soc: SOC %
                    label_price: PRICE ¢
                    help_soc: >-
                      Target battery level to charge up to at any time, ignoring
                      the time-based curve.
                    help_price: >-
                      Maximum buy price — energy only bought if price is below
                      this value.
                    attr_pin: buyAnytimePinned
                  - id: drain
                    name: Drain Battery
                    row_label: DRAIN<br>BATTERY
                    color: var(--smiggles-red)
                    dim: var(--smiggles-red-border)
                    shade: var(--smiggles-red-wash)
                    shade_border: var(--smiggles-red-border-soft)
                    bg: var(--smiggles-red-soft-bg)
                    attr_soc: drainBatterySOC
                    attr_price: drainBatteryPrice
                    attr_reset: drainBatteryAllowReset
                    price_rule: below
                    direction: down
                    money_label: COST
                    special_at: 100
                    special_desc: NO DRAINING
                    label_soc: SOC %
                    label_price: PRICE ¢
                    help_soc: >-
                      Fixed battery level to drain down to — the house runs off
                      the battery with solar off until this level, then the
                      override clears.
                    help_price: >-
                      Only drain while price is below this value (kept for
                      consistency; drain is a manual mode).
                    attr_pin: drainBatteryPinned
            entity: sensor.solarsystemcontrolparameters
            triggers_update:
