# Managed by Battman: written into <config>/packages/battman/ and rewritten on every
# Battman update (and when the entity map changes). Don't edit this copy: changes are
# overwritten. Put your own template sensors in your own package file.
#
# The double-bracket map markers are entries in Battman's entity map, filled in when Battman writes the file.
# Unavailable, never 0, when what a sensor is made from is missing (Smiggles used float(0)).

# 30-minute average home load, kW: the mean of home power over the last 30 minutes.
# Same settings as the Statistics helper Smiggles used (mean, max age 30 min, no sampling
# size, last sample not kept, 2 decimals). Unknown when home power has sent nothing for
# 30 minutes. Was a template copying that helper: same entity, same history.
sensor:
  - platform: statistics
    name: Battman load 30m avg
    unique_id: battman_load_30m_avg
    entity_id: sensor.sigen_plant_consumed_power
    state_characteristic: mean
    max_age:
      minutes: 30
    precision: 2

template:
  - sensor:
      # Grid power, kW: + importing, - exporting, whichever side flows over 50 W.
      # (Smiggles' sensor.gridpower, renamed: same rule, now labelled kW / power.)
      - name: Battman grid power
        unique_id: battman_grid_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower
        availability: >-
          {{ has_value('sensor.sigen_plant_grid_import_power') and has_value('sensor.sigen_plant_grid_export_power') }}
        state: >-
          {% set s1 = states('sensor.sigen_plant_grid_import_power') | float %}
          {% set s2 = states('sensor.sigen_plant_grid_export_power') | float %}
          {% if s1 > 0.05 and s1 >= s2 %}{{ s1 | round(2) }}
          {% elif s2 > 0.05 and s2 > s1 %}{{ -1 * s2 | round(2) }}
          {% else %}0{% endif %}


  # The Battman dashboard theme's eight mode colours as #rrggbb, by mode (Battman addition): phones
  # can't read CSS, so the iPhone Live Activity bar reads this, and "theme: battman" cards read its
  # theme name. The browser works them out (battman-lib.js modeHues: the five everyday modes are
  # the Battery mode buttons' colours, the three party modes the theme's furthest-apart others)
  # and saves them in the parameters sensor (dashboardThemeColours) whenever a Battman page is
  # open: templates can't see HA's themes. No fallbacks: until the colours for the picked theme
  # are saved (or if they can't be read), it's unknown and `problem` says why.
  - sensor:
      - name: Battman theme mode colours
        unique_id: battman_theme_mode_colours
        icon: mdi:palette
        state: >-
          {% set name = (state_attr('sensor.battman_parameters', 'dashboardTheme') or '') | trim %}
          {% set c = state_attr('sensor.battman_parameters', 'dashboardThemeColours') %}
          {% if name and c is mapping and c.theme == name and c.problem is not defined and c.modes is mapping %}
            {{ c.modes | to_json }}
          {% else %}{{ none }}{% endif %}
        attributes:
          theme: >-
            {{ (state_attr('sensor.battman_parameters', 'dashboardTheme') or '') | trim or none }}
          hues: "{{ (state_attr('sensor.battman_parameters', 'dashboardThemeColours') or {}).get('hues') }}"
          problem: >-
            {% set p = 'sensor.battman_parameters' %}
            {% set name = (state_attr(p, 'dashboardTheme') or '') | trim %}
            {% set c = state_attr(p, 'dashboardThemeColours') %}
            {% if states(p) in ['unknown', 'unavailable'] and state_attr(p, 'dashboardTheme') is none %}
              {{ p }} doesn't exist (it holds the dashboard theme)
            {% elif not name %}No dashboard theme picked (Settings → Dashboard theme, or Make Active in the Theme studio)
            {% elif c is not mapping or c.theme != name %}The colours of {{ name }} haven't been saved yet: open a Battman page (it saves them)
            {% elif c.problem is defined %}{{ c.problem }}
            {% elif c.modes is not mapping %}The colours of {{ name }} were saved by an older Battman: open a Battman page (it saves them again)
            {% else %}{{ none }}{% endif %}

  # The Live Activity on/off switch (Battman addition). Its state is the parameters sensor's
  # liveActivity setting; turning it on or off sets that, like every other Battman setting (so
  # it only changes while Battman is in charge). Anything can flip it: you, the dashboard, or
  # the Live Activity automations (follow an entity, the keep-alive restart).
  - switch:
      - name: Battman Live Activity
        unique_id: battman_live_activity
        icon: mdi:cellphone-information
        availability: >-
          {{ state_attr('sensor.battman_parameters', 'liveActivity') is not none }}
        state: >-
          {{ state_attr('sensor.battman_parameters', 'liveActivity') == true }}
        turn_on:
          - event: battman_parameters_update
            event_data:
              action: SetAttribute
              liveActivity: true
        turn_off:
          - event: battman_parameters_update
            event_data:
              action: SetAttribute
              liveActivity: false

  # ── ported from packages/solarsystemcontrolmodule.yaml v1.0.14 ──
  - binary_sensor:
      # Unavailable (not an error every update) when the feed-in price has no start / end time,
      # e.g. while Amber's sensor is down.
      - name: "Battman estimated price"
        unique_id: battman_estimated_price
        availability: >
          {{ as_timestamp(state_attr('sensor.amber_5min_current_feed_in_price', 'start_time'), none) is not none
             and as_timestamp(state_attr('sensor.amber_5min_current_feed_in_price', 'end_time'), none) is not none }}
        state: >
          {% set now_ts = as_timestamp(utcnow()) %}
          {% set start_ts = as_timestamp(state_attr('sensor.amber_5min_current_feed_in_price', 'start_time'), none) %}
          {% set end_ts = as_timestamp(state_attr('sensor.amber_5min_current_feed_in_price', 'end_time'), none) %}
          {% if start_ts is none or end_ts is none %}
            {{ none }}
          {% elif start_ts <= now_ts <= end_ts %}
            {{ state_attr('sensor.amber_5min_current_feed_in_price', 'estimate') }}
          {% else %}
            {{ true }}
          {% endif %}
          
  - trigger:
    - platform: event
      event_type: battman_soc_curves_update
    # start / templates reloaded: fill in the factory curves if there are none yet (a fresh
    # install), keep yours otherwise. Changes (the update event) only while Battman is in charge.
    - platform: homeassistant
      event: start
      id: start
    - platform: event
      event_type: event_template_reloaded
      id: start
    condition:
      - condition: template
        value_template: "{{ trigger.id == 'start' or is_state('binary_sensor.battman_in_charge', 'on') }}"
    sensor:
    - name: "Battman SOC curves"
      unique_id: battman_soc_curves
      state: "{{ now().isoformat() }}"
      attributes:
        curves: >-
          {% set f = [[factory:soc]] %}
          {{
            trigger.event.data.curves if trigger.platform == 'event'
            and 'curves' in trigger.event.data
            else state_attr('sensor.battman_soc_curves', 'curves')
            | default(dict(jan=f, feb=f, mar=f, apr=f, may=f, jun=f, jul=f, aug=f, sep=f, oct=f, nov=f, dec=f), true)
          }}
        factory: >-
          {{ [[factory:soc]] }}
        defaults: >-
          {{
            trigger.event.data.defaults if trigger.platform == 'event'
            and 'defaults' in trigger.event.data
            else state_attr('sensor.battman_soc_curves', 'defaults')
            | default({}, true)
          }}
        presets: >-
          {{
            trigger.event.data.presets if trigger.platform == 'event'
            and 'presets' in trigger.event.data
            else state_attr('sensor.battman_soc_curves', 'presets')
            | default({}, true)
          }}
        preset_names: >-
          {{
            trigger.event.data.preset_names if trigger.platform == 'event'
            and 'preset_names' in trigger.event.data
            else state_attr('sensor.battman_soc_curves', 'preset_names')
            | default({'1': 'Preset 1', '2': 'Preset 2', '3': 'Preset 3', '4': 'Preset 4', '5': 'Preset 5'}, true)
          }}
        preset_tracking: >-
          {{
            trigger.event.data.preset_tracking if trigger.platform == 'event'
            and 'preset_tracking' in trigger.event.data
            else state_attr('sensor.battman_soc_curves', 'preset_tracking')
            | default({}, true)
          }}    

  - trigger:
    - platform: event
      event_type: battman_price_curves_update
    # start / templates reloaded: fill in the factory curves if there are none yet (a fresh
    # install), keep yours otherwise. Changes (the update event) only while Battman is in charge.
    - platform: homeassistant
      event: start
      id: start
    - platform: event
      event_type: event_template_reloaded
      id: start
    condition:
      - condition: template
        value_template: "{{ trigger.id == 'start' or is_state('binary_sensor.battman_in_charge', 'on') }}"
    sensor:
    - name: "Battman price curves"
      unique_id: battman_price_curves
      state: "{{ now().isoformat() }}"
      attributes:
        curves: >-
          {% set f = [[factory:price]] %}
          {{
            trigger.event.data.curves if trigger.platform == 'event'
            and 'curves' in trigger.event.data
            else state_attr('sensor.battman_price_curves', 'curves')
            | default(dict(jan=f, feb=f, mar=f, apr=f, may=f, jun=f, jul=f, aug=f, sep=f, oct=f, nov=f, dec=f), true)
          }}
        factory: >-
          {{ [[factory:price]] }}
        presets: >-
          {{
            trigger.event.data.presets if trigger.platform == 'event'
            and 'presets' in trigger.event.data
            else state_attr('sensor.battman_price_curves', 'presets')
            | default({}, true)
          }}
        preset_names: >-
          {{
            trigger.event.data.preset_names if trigger.platform == 'event'
            and 'preset_names' in trigger.event.data
            else state_attr('sensor.battman_price_curves', 'preset_names')
            | default({'1': 'Preset 1', '2': 'Preset 2', '3': 'Preset 3', '4': 'Preset 4', '5': 'Preset 5'}, true)
          }}
        preset_tracking: >-
          {{
            trigger.event.data.preset_tracking if trigger.platform == 'event'
            and 'preset_tracking' in trigger.event.data
            else state_attr('sensor.battman_price_curves', 'preset_tracking')
            | default({}, true)
          }}
  

  - trigger:
      - platform: event
        event_type: battman_engine_log
    condition:
      - condition: state
        entity_id: binary_sensor.battman_in_charge
        state: "on"
    sensor:
      - name: "Battman engine log"
        unique_id: battman_engine_log
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        attributes:
          message: "{{ trigger.event.data.message }}"
          last_ts: "{{ now().isoformat() }}"
