# Battman engine: ported like for like from Smiggles (packages/solarsystemcontrolmodule.yaml v1.0.14: helpers the engine uses).
# Managed by Battman: written into your config and replaced on every Battman update.
# Don't edit this copy. [[map:...]] markers are filled from Battman's entity map.

input_boolean:
  battman_enable:
    name: Battman enable
    icon: mdi:power
  battman_no_export:
    name: Battman no export
    icon: mdi:cancel
input_select:
  battman_mode:
    name: Battman mode
    icon: mdi:battery-charging-wireless-10
    options:
    - Self Consume
    - Discharge
    - Charge
    - Charge Solar Off
    - Float
    - Float Solar Off
    - Solar Soak
    - Drain
input_number:
  battman_high_consumption:
    name: Battman high consumption
    min: 0
    max: 100
    step: 0.5
    mode: box
    unit_of_measurement: kWh
    icon: mdi:home-battery-outline
timer:
  battman_override_timer:
    name: Battman override timer
    duration: '12:00:00'
    restore: true
    icon: mdi:timer
