"Battman Broadsheet":
  # font-version: 1 (2026-09-30) — font-ready (scaffold, commented)
  # Morning-edition newspaper theme: ink on plain newsprint (v2 -- paper swapped from
  # FT salmon #fff1e5 to neutral newsprint #f5f2e8; greys de-pinked to match). Hues from
  # the Financial Times' open-source Origami palette (crimson, claret, jade, oxford,
  # velvet, teal); where an FT colour fails on paper it is toned darker and noted per hue.
  # Same token names and 8-field structure as OG/Abyss/Calculator; -bg is an 8% tint
  # mixed into the card paper. Not affiliated with the FT -- colour values only.

  mode: "light"
  # ── THEME FONT (optional) ── uncomment the lines below + pick a font to enable it.
  #    Loads via card-mod, applies everywhere incl. iframes & browser_mod popups.
  #    To use: set the family in `battman-font` and its Google Fonts URL in the @import.
  # battman-font: "Inter, Roboto, sans-serif"
  # card-mod-theme: "Battman Broadsheet"
  # card-mod-root: |
