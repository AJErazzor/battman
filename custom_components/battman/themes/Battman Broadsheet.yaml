  battman-orange-soft-bg: "rgba(214,92,10,0.13)"

  # ── Amber ──  (toned: FT has no amber; mandarin darkened+yellowed so it reads on paper)
  battman-amber: "#b87400"
  battman-amber-wash: "rgba(184,116,0,0.06)"
  battman-amber-border: "rgba(184,116,0,0.35)"
