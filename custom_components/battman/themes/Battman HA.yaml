  # "Looks like stock HA" theme. The base hue tokens map to Home Assistant's
  # native semantic colours (green->success, red->error, etc.), but every
  # DERIVED token (-wash/-border*/-bg/-soft-bg) maps to a neutral native
  # structural var (divider / card background) instead of a coloured tint --
  # so cards lose the Battman glass/accent variations and render like stock
  # HA. No mode: and no base-var overrides, so it follows the default theme
  # and light/dark automatically. No color-mix() used.

  # ── Red (→ var(--error-color)) ──
  battman-red: "var(--error-color)"
  battman-red-wash: "transparent"
  battman-red-border: "var(--divider-color)"
  battman-red-border-soft: "var(--divider-color)"
  battman-red-border-light: "var(--divider-color)"
  battman-red-border-strong: "var(--divider-color)"
  battman-red-bg: "var(--card-background-color)"
  battman-red-soft-bg: "transparent"

  # ── Darkred (→ var(--error-color)) ──
  battman-darkred: "var(--error-color)"
  battman-darkred-wash: "transparent"
  battman-darkred-border: "var(--divider-color)"
  battman-darkred-border-soft: "var(--divider-color)"
  battman-darkred-border-light: "var(--divider-color)"
  battman-darkred-border-strong: "var(--divider-color)"
  battman-darkred-bg: "var(--card-background-color)"
  battman-darkred-soft-bg: "transparent"

  # ── Orange (→ var(--color-41), HA's own palette, so it differs from yellow) ──
  battman-orange: "var(--color-41)"
  battman-orange-wash: "transparent"
