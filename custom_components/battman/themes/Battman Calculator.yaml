"Battman Calculator":
  # font-version: 1 (2026-09-30) — ACTIVE font
  # Vintage LCD calculator: pale green screen, dark digit text, muted LCD-era accents.
  mode: "light"
  # --- Theme font via card-mod (loaded in this theme file). ---
  battman-font: "Orbitron, ui-monospace, monospace"
  card-mod-theme: "Battman Calculator"
  card-mod-root: |
    @import url('https://fonts.googleapis.com/css2?family=Doto:wght@400;500;700&display=swap');
    html { font-family: var(--battman-font) !important; }
    ha-card, .card-content, .primary, .secondary, .name, .state, .value, .label,
    .toolbar, .main-title, .title, ha-tabs, ha-tab, paper-tab, mwc-tab,
    hui-view-header, .view-header, .subview, ha-top-app-bar-fixed {
      font-family: var(--battman-font) !important;
    }
    ha-dialog, ha-dialog *, .mdc-dialog, .mdc-dialog__content, browser-mod-popup, browser-mod-popup * {
      font-family: var(--battman-font) !important;
    }
  primary-font-family: "var(--battman-font)"
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-heading: "var(--primary-font-family)"
  ha-font-family-code: "var(--primary-font-family)"
  mdc-typography-font-family: "var(--primary-font-family)"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  paper-font-body1_-_font-family: "var(--primary-font-family)"
  ha-font-family: "var(--primary-font-family)"
  mdc-typography-headline6-font-family: "var(--primary-font-family)"
  mdc-typography-button-font-family: "var(--primary-font-family)"
  mdc-typography-subtitle1-font-family: "var(--primary-font-family)"
  mdc-typography-body2-font-family: "var(--primary-font-family)"
  paper-font-headline_-_font-family: "var(--primary-font-family)"
  paper-font-title_-_font-family: "var(--primary-font-family)"
  paper-font-subhead_-_font-family: "var(--primary-font-family)"
  primary-background-color: "var(--battman-surface-popup)"
  card-background-color: "var(--battman-surface-card)"
  secondary-background-color: "var(--battman-surface-popup)"
  primary-text-color: "var(--battman-text-bright)"
  secondary-text-color: "var(--battman-text-muted)"
  disabled-text-color: "var(--battman-text-dim)"
  divider-color: "var(--battman-border-neutral)"
  primary-color: "var(--battman-blue)"
  accent-color: "var(--battman-blue)"

