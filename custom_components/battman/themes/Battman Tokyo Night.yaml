"Battman Tokyo Night":
  # font-version: 1 (2026-09-30) — font-ready (scaffold, commented)
  # Palette derived from the "tokyonight_storm" theme on ohmyposh.dev — deep indigo
  # night with jewel blues, purple and cyan. Cool but rich (vs neon or muted).
  # Same token contract as the other Battman themes.
  mode: "dark"
