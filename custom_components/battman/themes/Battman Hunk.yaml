"Battman Hunk":
  # font-version: 1 (2026-09-30) — font-ready (scaffold, commented)
  # Palette derived from the "hunk" theme on ohmyposh.dev — warm dusty-rose /
  # coral / gold leads, cool cyan+navy support, bright lime for charging.
  # Same token contract as the other Battman themes; drop-in for Battery Time.
  mode: "dark"
