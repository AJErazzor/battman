# name: Battery mode
# description: Active and Curtail switches, the engine log, and the battery mode buttons.
#
# A Battman card: on a dashboard it's `type: custom:battman-batterymode`, and it updates
# with Battman releases. [[map:name]] = an entry in Battman's entity map (quote it
# when it's a whole value). To try changes on your own HA, copy this file to
# config/battman/cards/batterymode.yaml and edit that copy.
#
# The buttons change the same entities as before (the mode select and
# the Active / Curtail switches).
# The info button opens the Engine log (a Battman popup, no browser_mod), styled like the State card's
# Next hours popup, drawn by battman-enginelog.js (the Log page uses the same).
type: vertical-stack
cards:
- type: vertical-stack
  cards:
  - type: horizontal-stack
    cards:
    - type: custom:button-card
      entity: '[[map:enable]]'
      name: Active
      show_icon: false
      show_name: true
      show_state: true
      tap_action:
        action: fire-dom-event
        battman_toggle:
          entity: '[[map:enable]]'
          name: Turn Active
          ask_off: Battman will stop controlling the battery.
          ask_on: Battman will control the battery again.
      hold_action:
        action: more-info
      styles:
        card:
        - padding: 0 10px
        - margin: '0'
        - height: 40px
        - min-height: 40px
        - max-height: 40px
        - border-radius: 8px
        - box-shadow: none
        - background: var(--battman-surface-card)
        - border: 1px solid var(--battman-border-neutral)
        - --fx-ring: '[[[ return entity.state === ''on'' ? ''var(--fx-enable-chase-display, none)'' : ''none''; ]]]'
        - --fx-chase-gradient: var(--fx-enable-chase-gradient, none)
        - --fx-chase-duration: var(--fx-enable-chase-duration, 0s)
        - --fx-ring-width: var(--fx-enable-ring-width, 2px)
        - --fx-glow-name: '[[[ return entity.state === ''on'' ? ''var(--fx-enable-glow-name, none)'' : ''none''; ]]]'
        - --fx-glow-duration: var(--fx-enable-glow-duration, 0s)
        - --fx-glow-color: var(--fx-enable-glow-color, transparent)
        - --fx-fill-soft: var(--battman-green-soft-bg)
        - --fx-border: '[[[ return entity.state === ''on'' ? ''var(--fx-enable-border, 1px solid var(--battman-green-border-strong))'' : ''1px solid var(--battman-border-neutral)''; ]]]'
        name:
        - font-size: 11px
        - font-weight: '700'
        - letter-spacing: 0.06em
        - text-transform: uppercase
        - color: var(--battman-text-muted)
        state:
        - font-size: 10px
        - color: var(--battman-text-dim)
        - font-weight: '600'
      state:
      - value: 'on'
        styles:
          card:
          - background: var(--battman-green-soft-bg)
          - border: 1px solid var(--battman-green-border-strong)
          name:
          - color: var(--battman-green)
          state:
          - color: var(--battman-green)
      extra_styles: |-
        @keyframes fx-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
        @keyframes fx-glow-mono { 0%,100% { box-shadow: 0 0 5px 0 var(--fx-glow-color, transparent); } 50% { box-shadow: 0 0 18px 4px var(--fx-glow-color, transparent); } }
        @keyframes fx-glow-rainbow {
          0%{box-shadow:0 0 16px 4px var(--battman-red);}16%{box-shadow:0 0 16px 4px var(--battman-orange);}
          33%{box-shadow:0 0 16px 4px var(--battman-yellow);}50%{box-shadow:0 0 16px 4px var(--battman-green);}
          66%{box-shadow:0 0 16px 4px var(--battman-blue);}83%{box-shadow:0 0 16px 4px var(--battman-purple);}
          100%{box-shadow:0 0 16px 4px var(--battman-red);}
        }
        ha-card {
          position: relative !important; overflow: hidden !important;
          border: var(--fx-border, 1px solid var(--battman-border-neutral)) !important;
          animation: var(--fx-glow-name, none) var(--fx-glow-duration, 0s) ease-in-out infinite;
        }
        ha-card::before {
          content:''; position:absolute; z-index:0; top:50%; left:50%;
          width:360px; height:360px; transform: translate(-50%,-50%);
          background: var(--fx-chase-gradient, none);
          animation: fx-spin var(--fx-chase-duration, 0s) linear infinite;
          display: var(--fx-ring, none);
        }
        ha-card::after {
          content:''; position:absolute; z-index:1; inset: var(--fx-ring-width, 2px); border-radius:6px;
          background: linear-gradient(var(--fx-fill-soft, var(--battman-surface-card)),var(--fx-fill-soft, var(--battman-surface-card))), var(--battman-surface-card); display: var(--fx-ring, none);
        }
        ha-card > * { position: relative !important; z-index: 2 !important; }
        @media (prefers-reduced-motion: reduce) { ha-card, ha-card::before { animation: none !important; } }
    - type: custom:button-card
      entity: '[[map:no_export]]'
      name: Curtail
      show_icon: false
      show_name: true
      show_state: true
      tap_action:
        action: fire-dom-event
        battman_toggle:
          entity: '[[map:no_export]]'
          name: Turn Curtail
          ask_off: Exports resume. Curtail stops them while feed-in is negative.
          ask_off_negative: Feed-in is {price}. Turning off means you pay to export.
          ask_on: This will stop any exports.
          price: sensor.amber_5min_current_feed_in_price
      hold_action:
