      - --fx-glow-name: '[[[ return entity.state === ''on'' ? ''var(--fx-curtail-glow-name, none)'' : ''none''; ]]]'
      - --fx-glow-duration: var(--fx-curtail-glow-duration, 0s)
      - --fx-glow-color: var(--fx-curtail-glow-color, transparent)
      - --fx-fill-soft: var(--battman-amber-soft-bg)
      - --fx-border: '[[[ return entity.state === ''on'' ? ''var(--fx-curtail-border, 1px solid var(--battman-amber-border-strong))'' : ''1px solid var(--battman-border-neutral)''; ]]]'
      name:
      - font-size: 11px
      - font-weight: '700'
      - letter-spacing: 0.06em
      - text-transform: uppercase
      - color: var(--battman-text-muted)
      state:
      - font-size: 10px
      - color: var(--battman-text-dim)
      - font-weight: '600'
    state:
    - value: 'on'
      styles:
        card:
        - background: var(--battman-amber-soft-bg)
        - border: 1px solid var(--battman-amber-border-strong)
        name:
        - color: var(--battman-amber)
        state:
        - color: var(--battman-amber)
    extra_styles: |-
      @keyframes fx-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
      @keyframes fx-glow-mono { 0%,100% { box-shadow: 0 0 5px 0 var(--fx-glow-color, transparent); } 50% { box-shadow: 0 0 18px 4px var(--fx-glow-color, transparent); } }
      @keyframes fx-glow-rainbow {
        0%{box-shadow:0 0 16px 4px var(--battman-red);}16%{box-shadow:0 0 16px 4px var(--battman-orange);}
        33%{box-shadow:0 0 16px 4px var(--battman-yellow);}50%{box-shadow:0 0 16px 4px var(--battman-green);}
        66%{box-shadow:0 0 16px 4px var(--battman-blue);}83%{box-shadow:0 0 16px 4px var(--battman-purple);}
        100%{box-shadow:0 0 16px 4px var(--battman-red);}
      }
