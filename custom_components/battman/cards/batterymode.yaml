        position: relative !important; overflow: hidden !important;
        border: var(--fx-border, 1px solid var(--battman-border-neutral)) !important;
        animation: var(--fx-glow-name, none) var(--fx-glow-duration, 0s) ease-in-out infinite;
      }
      ha-card::before {
        content:''; position:absolute; z-index:0; top:50%; left:50%;
        width:360px; height:360px; transform: translate(-50%,-50%);
        background: var(--fx-chase-gradient, none);
        animation: fx-spin var(--fx-chase-duration, 0s) linear infinite;
        display: var(--fx-ring, none);
      }
      ha-card::after {
        content:''; position:absolute; z-index:1; inset: var(--fx-ring-width, 2px); border-radius:6px;
        background: linear-gradient(var(--fx-fill-soft, var(--battman-surface-card)),var(--fx-fill-soft, var(--battman-surface-card))), var(--battman-surface-card); display: var(--fx-ring, none);
      }
      ha-card > * { position: relative !important; z-index: 2 !important; }
      @media (prefers-reduced-motion: reduce) { ha-card, ha-card::before { animation: none !important; } }
  - type: custom:button-card
    icon: mdi:information-outline
    show_name: false
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: ' '
          style: --mdc-dialog-min-width:min(94vw,480px);--mdc-dialog-max-width:min(94vw,480px);
          content: |-
            [[[
            // Engine log popup: the engine's last-run log, drawn by Battman's engine log renderer
            // (battman-enginelog.js), the same one the Log page uses: a section per heading,
            // its details under it; True / False and $ amounts coloured.
            const LOG = '[[map:debug_log]]';
            const wrap = inner => `<div style='box-sizing:border-box;width:100%;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;border-radius:8px;background:var(--battman-surface-popup);color:var(--primary-text-color);font-family:var(--primary-font-family,var(--battman-font,sans-serif));'>${inner}</div>`;
            const note = (t, c) => `<div style='padding:8px 10px;font-size:15px;font-weight:700;color:${c};'>${t}</div>`;
            let body;
            const st = states[LOG];
            const R = window.battmanEngineLog;
            if (!R) body = note('Engine log: Battman\'s log renderer (battman-enginelog.js) isn\'t loaded. Refresh the page.', 'var(--battman-darkred)');
            else if (!st) body = note(`Engine log: missing ${LOG}`, 'var(--battman-darkred)');
            else {
              const raw = String(st.attributes?.message ?? '');
              body = raw.trim() ? R.render(raw, { title: 'Engine log' })
                                : note(`${LOG} has no log message yet.`, 'var(--battman-text-muted)');
            }
            const out = wrap(body);
            // the popup sits outside the themed view, so resolve var(--x) to real values from this card's style
            let cs = null;
            try { cs = getComputedStyle((this && this.nodeType === 1) ? this : document.documentElement); } catch (e) {}
            if (!cs) return out;
            let res = out;
            for (let i = 0; i < 6 && /var\(--/.test(res); i++) {
              res = res.replace(/var\((--[\w-]+)(?:\s*,([^()]*))?\)/g, (m, name, fb) => {
                const v = cs.getPropertyValue(name).trim();
                return v || (fb !== undefined ? fb.trim() : m);
              });
            }
            return res;
            ]]]
    styles:
      card:
      - box-shadow: none
      - padding: '0'
      - margin: '0'
      - height: 40px
      - min-height: 40px
      - max-height: 40px
      - background: var(--battman-surface-card) !important
      - border-radius: 8px !important
      - border: 1px solid var(--battman-border-neutral) !important
      icon:
      - width: 16px
      - height: 16px
      - color: var(--battman-text-dim) !important
  card_mod:
    style:
      .: ':host { --stack-card-gap: 4px; --horizontal-stack-card-gap: 4px; }'
      $: '.content { gap: 4px !important; }'
