# name: Pricy
# description: The price curve editor: the buy and sell prices the battery works to, for each hour, by month or season.
# preview: pricy.webp
#
# A Battman card: on a dashboard it's `type: custom:battman-pricy`, and it updates
# with Battman releases. For now it shows Battman's Pricy page (/battmanfiles/pricy.html)
# in a frame; the card name stays the same if that changes later.
#
# Size: in a sections view, drag it to the size you want (it fills the card); in a
# panel view it fills the page. aspect_ratio only applies in an older masonry view.
type: iframe
url: /battmanfiles/pricy.html
aspect_ratio: "100:100"
grid_options:
  columns: full
  rows: 12
  min_rows: 6
