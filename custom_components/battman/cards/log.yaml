# name: Log
# description: The engine log: each run's decisions, with power, prices and battery charge charted over the day.
# preview: log.webp
#
# A Battman card: on a dashboard it's `type: custom:battman-log`, and it updates
# with Battman releases. For now it shows Battman's Log page (/battmanfiles/log.html)
# in a frame; the card name stays the same if that changes later.
#
# Size: in a sections view, drag it to the size you want (it fills the card); in a
# panel view it fills the page. aspect_ratio only applies in an older masonry view.
type: iframe
url: /battmanfiles/log.html
aspect_ratio: "100:100"
grid_options:
  columns: full
  rows: 12
  min_rows: 6
