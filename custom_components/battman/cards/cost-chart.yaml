# name: Cost chart
# description: Daily buy, sell and net cost, with your Sigen import and export, charted over the month.
# preview: cost-chart.webp
#
# A Battman card: on a dashboard it's `type: custom:battman-cost-chart`, and it updates
# with Battman releases. [[map:name]] = an entry in Battman's entity map (quote it
# when it's a whole value). To try changes on your own HA, copy this file to
# config/battman/cards/cost-chart.yaml and edit that copy.
# Shows Battman's cost chart page (/battmanfiles/cost-chart.html) in a frame, flush with the view.
type: iframe
url: /battmanfiles/cost-chart.html
grid_options:
  columns: full
  rows: 9
card_mod:
  style: |
    ha-card { height: 100%; background: transparent; border: none; box-shadow: none; padding: 0; overflow: hidden; }
    .wrapper { height: 100% !important; padding: 0 !important; }
    iframe { height: 100% !important; width: 100% !important; border: 0 !important; }
