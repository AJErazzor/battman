  custom_fields:
    pill: |
      [[[
        var S = variables.battman;
        if (!window.bmT) window.bmT = {};
        window.bmT.hass = function () {
          var el = document.querySelector('home-assistant');
          if (el && el.hass) return el.hass;
          var ha = document.querySelector('hc-main') || document.querySelector('home-assistant-main');
          if (ha && ha.hass) return ha.hass;
          var els = document.querySelectorAll('*');
          for (var i = 0; i < els.length; i++) { if (els[i].hass) return els[i].hass; }
          return null;
        };
        window.bmT.diag = function (msg) {
          var d = document.getElementById('bmt-diag');
          if (d) { d.textContent = msg; d.style.display = 'block'; }
        };
        window.bmT.svc = function (dom, svc, data) {
          try {
            var H = window.bmT.hass();
            if (!H) { window.bmT.diag('no hass (' + (document.querySelector('home-assistant') ? 'el found, no .hass' : 'no home-assistant el') + ')'); return; }
            if (!H.callService) { window.bmT.diag('hass has no callService'); return; }
            H.callService(dom, svc, data);
          } catch (e) { window.bmT.diag('svc err: ' + (e && e.message ? e.message : e)); }
        };
        window.bmT.unit = function () { try { return localStorage.getItem('battman_timer_unit') === 'm' ? 'm' : 'h'; } catch (e) { return 'h'; } };
        window.bmT.setUnit = function (el, u) {
          try { localStorage.setItem('battman_timer_unit', u); } catch (e) {}
          var w = el.parentElement;
          var h = w.querySelector('.bmu-h'), m = w.querySelector('.bmu-m');
          h.style.background = u === 'h' ? 'var(--battman-blue-soft-bg)' : 'var(--battman-surface-card)';
          h.style.color      = u === 'h' ? 'var(--battman-blue)' : 'var(--battman-text-muted)';
          m.style.background = u === 'm' ? 'var(--battman-blue-soft-bg)' : 'var(--battman-surface-card)';
          m.style.color      = u === 'm' ? 'var(--battman-blue)' : 'var(--battman-text-muted)';
        };
        window.bmT.toggle = function () {
          var H = window.bmT.hass(); if (!H) { window.bmT.diag('toggle: no hass'); return; }
          var t = H.states[S.timer_entity] || {};
          window.bmT.svc('timer', t.state === 'active' ? 'cancel' : 'start', { entity_id: S.timer_entity });
        };
        window.bmT.plus = function () {
          var H = window.bmT.hass(); if (!H) { window.bmT.diag('plus: no hass'); return; }
          var t = H.states[S.timer_entity] || {};
          var rem = 0;
          if (t.state === 'active' && t.attributes && t.attributes.finishes_at) {
            var ms = new Date(t.attributes.finishes_at) - new Date();
            rem = ms > 0 ? Math.round(ms / 1000) : 0;
          }
          var d = window.bmT.unit() === 'm' ? 60 : 3600;
          window.bmT.svc('timer', 'start', { entity_id: S.timer_entity, duration: rem + d });
        };
        window.bmT.minus = function () {
          var H = window.bmT.hass(); if (!H) { window.bmT.diag('minus: no hass'); return; }
          var t = H.states[S.timer_entity] || {};
          if (t.state !== 'active') return;
          window.bmT.svc('timer', 'change', { entity_id: S.timer_entity, duration: window.bmT.unit() === 'm' ? '-00:01:00' : '-01:00:00' });
        };

