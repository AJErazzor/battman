              attr_price: sellSolarPrice
              attr_reset: sellSolarAllowReset
              price_rule: above
              direction: down
              money_label: EARN
              special_at: 0
              special_desc: ''
              label_soc: SOC %
              label_price: PRICE ¢
              help_soc: Battery level threshold for solar selling, overriding the normal time-based curve.
              help_price: Minimum sell price — solar only sold if price is above this value.
              attr_pin: sellSolarPinned
            - id: buy
              name: Buy Override
              row_label: BUY<br>OVERRIDE
              color: var(--battman-yellow)
              dim: var(--battman-yellow-border)
              shade: var(--battman-yellow-wash)
              shade_border: var(--battman-yellow-border-soft)
              bg: var(--battman-yellow-soft-bg)
              attr_soc: buyOverrideSOC
              attr_price: buyOverridePrice
              attr_reset: buyOverrideAllowReset
              price_rule: below
              direction: up
              money_label: COST
              special_at: 0
              special_desc: ''
              label_soc: SOC %
              label_price: PRICE ¢
              help_soc: Fixed battery level to buy up to, overriding the normal time-based curve.
              help_price: Maximum buy price — energy only bought if price is below this value.
              allow_negative: true
              attr_pin: buyOverridePinned
            - id: any
              name: Buy Anytime
              row_label: BUY<br>ANYTIME
