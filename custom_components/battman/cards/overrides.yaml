# name: Overrides
# description: Override dock (Sell / Sell Solar / Buy / Buy Anytime / Drain), control centre with presets and Net Target, and the override timer.
#
# A Battman card: on a dashboard it's `type: custom:battman-overrides`, and it updates
# with Battman releases. [[map:name]] = an entry in Battman's entity map (quote it
# when it's a whole value). To try changes on your own HA, copy this file to
# config/battman/cards/overrides.yaml and edit that copy.
#
# Settings change by firing the parameters update event (SetAttribute) and starting or
# cancelling the override timer, exactly as before, so the current engine stays in charge.
# Rows and popups come from Battman's library (/battman/battman-lib.js, window.BattmanLib).
# The rows' settings block is written once (&settings) and shared.
# No made-up values: a row's kWh uses the rated capacity sensor (shows — if it's missing),
# a missing SOC shows —, and missing buy / sell totals show — and block setting a Net Target.
type: vertical-stack
card_mod:
  style:
    .: ':host { --stack-card-gap: 2px; }'
    $: '.content { gap: 2px !important; }'
cards:
- type: custom:button-card
  variables:
    battman:
      params_entity: '[[map:parameters]]'
      soc_entity: '[[map:battery_soc]]'
      timer_entity: '[[map:override_timer]]'
      forecast_entity: '[[map:buy_forecast]]'
      charge_kw_entity: '[[map:available_max_power]]'
      capacity_entity: '[[map:rated_energy_capacity]]'
      price_field: advanced_price_predicted
      round_step_cents: 1
      safety_min_minutes: 30
      safety_min_intervals: 2
      event_name: '[[map:parameters_update_event]]'
      sell_total_entity: '[[map:sell_total]]'
      buy_total_entity: '[[map:buy_total]]'
      net_src: |
        var st = states || {};
        function day(e) { var x = st[e]; return x && x.attributes ? parseFloat(x.attributes.day) : NaN; }  /* Battman: missing total = unknown, not $0 */
        var net = day(S.sell_total_entity) - day(S.buy_total_entity) - (parseFloat(a.dailyNetworkCharge) || 0);
        var ts = parseFloat(a.netTargetSellPrice) || 0, tb = parseFloat(a.netTargetBuyPrice) || 0;
        function met(v) {
          if (!v || typeof v !== "string" || v.indexOf("|") < 0) return null;
          var p = v.split("|"), t = new Date(p[0].trim().replace(/\.\d+/, ""));
          if (isNaN(t.getTime())) return null;
          var n = new Date();
          if (t.getFullYear() !== n.getFullYear() || t.getMonth() !== n.getMonth() || t.getDate() !== n.getDate()) return null;
          return { t: t, v: parseFloat(p[1]) || 0 };
        }
        function money(v) { if (isNaN(v)) return "—"; var n = Math.abs(v) < 0.005 ? 0 : v; return (n < 0 ? "\u2212" : "") + "$" + Math.abs(n).toFixed(2); }
        var mode = ts !== 0 ? "sell" : (tb !== 0 ? "buy" : "");
        var tgt = mode === "sell" ? ts : tb;
        var sm = met(a.netTargetSellMet), bm = met(a.netTargetBuyMet), metK = "";
        if (!mode) { if (sm && (!bm || sm.t >= bm.t)) metK = "sell"; else if (bm) metK = "buy"; }
        var rem = mode === "sell" ? tgt - net : (mode === "buy" ? net - tgt : 0);
        if (rem < 0) rem = 0;
        return { net: net, mode: mode, target: tgt, be: mode !== "" && Math.abs(tgt) < 0.005, rem: rem, met: metK, metAt: metK === "sell" ? sm.t : (metK === "buy" ? bm.t : null), active: mode !== "" || metK !== "", money: money };
      overrides:
      - id: sell
        name: Sell Override
        row_label: SELL<br>OVERRIDE
        color: var(--battman-green)
        dim: var(--battman-green-border)
        shade: var(--battman-green-wash)
        shade_border: var(--battman-green-border-soft)
        bg: var(--battman-green-soft-bg)
        attr_soc: sellOverrideSOC
        attr_price: sellOverridePrice
        attr_reset: sellOverrideAllowReset
        price_rule: above
        direction: down
        money_label: EARN
        special_at: 100
        special_desc: NO SELLING
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Fixed battery level to sell down to, overriding the normal time-based curve. Setting 100% means no selling at all.
        help_price: Minimum sell price — energy only sold if price is above this value.
        attr_pin: sellOverridePinned
      - id: sellsolar
        name: Sell Solar
        row_label: SELL<br>SOLAR
        color: var(--battman-orange)
        dim: var(--battman-orange-border)
        shade: var(--battman-orange-wash)
        shade_border: var(--battman-orange-border-soft)
        bg: var(--battman-orange-soft-bg)
        attr_soc: sellSolarSOC
        attr_price: sellSolarPrice
        attr_reset: sellSolarAllowReset
        price_rule: above
        direction: down
        money_label: EARN
        special_at: 0
        special_desc: ''
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Battery level threshold for solar selling, overriding the normal time-based curve.
        help_price: Minimum sell price — solar only sold if price is above this value.
        attr_pin: sellSolarPinned
      - id: buy
        name: Buy Override
        row_label: BUY<br>OVERRIDE
        color: var(--battman-yellow)
        dim: var(--battman-yellow-border)
        shade: var(--battman-yellow-wash)
        shade_border: var(--battman-yellow-border-soft)
        bg: var(--battman-yellow-soft-bg)
        attr_soc: buyOverrideSOC
        attr_price: buyOverridePrice
        attr_reset: buyOverrideAllowReset
        price_rule: below
        direction: up
        money_label: COST
        special_at: 0
        special_desc: ''
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Fixed battery level to buy up to, overriding the normal time-based curve.
        help_price: Maximum buy price — energy only bought if price is below this value.
        allow_negative: true
        attr_pin: buyOverridePinned
      - id: any
        name: Buy Anytime
        row_label: BUY<br>ANYTIME
        color: var(--battman-purple)
        dim: var(--battman-purple-border)
        shade: var(--battman-purple-wash)
        shade_border: var(--battman-purple-border-soft)
        bg: var(--battman-purple-soft-bg)
        attr_soc: buyAnytimeSOC
        attr_price: buyAnytimePrice
        attr_reset: buyAnytimeAllowReset
        price_rule: below
        direction: up
        money_label: COST
        special_at: 0
        special_desc: ''
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Target battery level to charge up to at any time, ignoring the time-based curve.
        help_price: Maximum buy price — energy only bought if price is below this value.
        attr_pin: buyAnytimePinned
      - id: drain
        name: Drain Battery
        row_label: DRAIN<br>BATTERY
        color: var(--battman-red)
        dim: var(--battman-red-border)
        shade: var(--battman-red-wash)
        shade_border: var(--battman-red-border-soft)
        bg: var(--battman-red-soft-bg)
        attr_soc: drainBatterySOC
        attr_price: drainBatteryPrice
        attr_reset: drainBatteryAllowReset
        price_rule: below
        direction: down
        money_label: COST
        special_at: 100
        special_desc: NO DRAINING
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Fixed battery level to drain down to — the house runs off the battery with solar off until this level, then the override clears.
        help_price: Only drain while price is below this value (kept for consistency; drain is a manual mode).
        attr_pin: drainBatteryPinned
  entity: '[[map:parameters]]'
  triggers_update:
  - '[[map:parameters]]'
  - '[[map:sell_total]]'
  - '[[map:buy_total]]'
  - '[[map:override_timer]]'
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
    - padding: '0'
    - margin: '0'
    - height: 52px
    - min-height: 52px
    - max-height: 52px
    - overflow: hidden
    - box-shadow: none
    - border-radius: 8px
    - background: |
        [[[
          var a = entity.attributes;
          var NS = new Function("a", "states", "S", variables.battman.net_src)(a, states, variables.battman);
          return NS.met ? 'linear-gradient(var(--battman-teal-soft-bg),var(--battman-teal-soft-bg)),var(--battman-surface-card)' : 'var(--battman-surface-card)';
        ]]]
    - border: |
        [[[
          var a = entity.attributes;
          var NS = new Function("a", "states", "S", variables.battman.net_src)(a, states, variables.battman);
          if (NS.active) return '1px solid var(--battman-teal-border)';
          var warn = variables.battman.overrides.some(function (o) {
            return ((parseFloat(a[o.attr_soc]) || 0) > 0 || (parseFloat(a[o.attr_price]) || 0) > 0)
                && (a[o.attr_reset] === false || a[o.attr_reset] === 'false');
          });
          if (warn) return '1px solid var(--battman-amber-border-soft)';
          return String(a.armedScene || '').trim() ? '1px solid var(--battman-blue-border)' : '1px solid var(--battman-border-neutral-soft)';
        ]]]
    grid:
    - grid-template-areas: '"content"'
    - grid-template-columns: 1fr
    - grid-template-rows: 52px
    custom_fields:
      content:
      - grid-area: content
      - height: 52px
      - width: 100%
  custom_fields:
    content: |
      [[[
        var S = variables.battman;
        var a = entity.attributes;
        var NS = new Function("a", "states", "S", S.net_src)(a, states, S);
        var LKP = 'M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z';
        var anyOn = false, noSell = false, warn = false, warnDots = '';
        S.overrides.forEach(function (o) {
          var soc = parseFloat(a[o.attr_soc]) || 0, price = parseFloat(a[o.attr_price]) || 0;
          var on = soc > 0 || price > 0 || (o.allow_negative && price < 0);
          if (on) anyOn = true;
          if (o.special_at > 0 && soc === o.special_at) noSell = true;
          var lk = a[o.attr_reset] === false || a[o.attr_reset] === 'false';
          if (on && lk) { warn = true; warnDots += '<div style="width:7px;height:7px;border-radius:50%;background:' + o.color + ';box-shadow:0 0 6px ' + o.color + '"></div>'; }
        });
        var label  = noSell ? 'OVERRIDES \u00b7 NO SELL' : 'OVERRIDES';
        var lcolor = noSell ? 'var(--battman-green)' : (anyOn ? 'var(--battman-text-bright)' : 'var(--battman-text-muted)');

        var lockChip = (warn && !NS.active)
          ? '<div style="display:flex;align-items:center;gap:7px;flex:none">'
          +   '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--battman-amber);flex:none"><path d="' + LKP + '"/></svg>'
          +   '<span style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--battman-amber);white-space:nowrap">No reset</span>'
          +   '<div style="display:flex;gap:5px;align-items:center">' + warnDots + '</div>'
          + '</div>'
          : '';


        var armName = String(a.armedScene || '').trim();
        var armEsc = armName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        var armChip = armName
          ? '<div title="Runs at 00:01" style="display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:12px;flex:0 1 auto;min-width:0;background:var(--battman-blue-soft-bg);border:1px solid var(--battman-blue-border-strong)">'
          +   '<svg viewBox="0 0 24 24" class="bmmoon" style="width:12px;height:12px;fill:var(--battman-blue);flex:none"><path d="M12.3 2a9.9 9.9 0 0 0 0 20 10 10 0 0 0 8.7-5.1A8 8 0 0 1 12.3 2z"/></svg>'
          +   '<span style="font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--battman-blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">' + armEsc + '</span>'
          +   '<span style="font-size:10px;font-weight:800;color:var(--battman-blue);flex:none">00:01</span>'
          + '</div>'
          : '';

        var plugOn = (a.drainBatteryPlughole === true || a.drainBatteryPlughole === 'true') && ((parseFloat(a.drainBatterySOC) || 0) > 0 || (parseFloat(a.drainBatteryPrice) || 0) > 0);
        var plugChip = plugOn
          ? '<div style="display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;flex:none;background:var(--battman-red-soft-bg);border:1px solid var(--battman-red)">'
          +   '<span style="font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--battman-red);white-space:nowrap">Plughole</span>'
          + '</div>'
          : '';

        var netRight = '';
        if (NS.active) {
          var TC = 'var(--battman-teal)';
          var t1 = 'font-size:12px;font-weight:800;letter-spacing:0.04em;color:' + TC + ';white-space:nowrap';
          var t2 = 'font-size:12px;font-weight:700;opacity:0.9;color:' + TC + ';white-space:nowrap';
          var big = function (lbl, v) {
            return '<div style="display:flex;flex-direction:column;align-items:flex-end;flex:none">'
                 +   '<span style="font-size:8px;font-weight:800;letter-spacing:0.1em;color:' + TC + ';opacity:0.6;white-space:nowrap">' + lbl + '</span>'
                 +   '<span style="font-size:22px;font-weight:900;color:' + TC + ';line-height:1;white-space:nowrap">' + v + '</span>'
                 + '</div>';
          };
          var word = NS.mode === 'sell' ? ' to make' : ' to spend';
          if (NS.mode && NS.be) {
            netRight = '<div style="text-align:right;line-height:1.25;flex:none"><div style="' + t1 + '">BREAK EVEN</div><div style="' + t2 + '">' + NS.money(NS.rem) + word + '</div></div>';
          } else if (NS.mode) {
            netRight = '<div style="display:flex;align-items:center;gap:12px;flex:none"><span style="' + t2 + '">' + NS.money(NS.rem) + word + '</span>' + big(NS.mode === 'sell' ? 'SELL TARGET' : 'BUY BUDGET', NS.money(NS.target)) + '</div>';
          } else {
            netRight = '<div style="display:flex;align-items:center;gap:12px;flex:none"><span style="' + t1 + '">' + (NS.met === 'sell' ? 'TARGET MET' : 'BUDGET REACHED') + (NS.metAt ? ' ' + ('0' + NS.metAt.getHours()).slice(-2) + ':' + ('0' + NS.metAt.getMinutes()).slice(-2) : '') + '</span>' + big('NET TODAY', NS.money(NS.net)) + '</div>';
          }
        }

        return '<style>.bmb{transition:filter .1s,transform .1s}.bmb:active{transform:scale(0.96);filter:brightness(1.5)}.bmmoon{animation:bmpulse 1.6s ease-in-out infinite}@keyframes bmpulse{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.bmmoon{animation:none}}</style>'
             + '<div class="bmb" style="height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;cursor:pointer">'
             +   '<div style="display:flex;align-items:center;gap:10px;min-width:0"><div style="font-size:11px;font-weight:800;letter-spacing:0.14em;color:' + lcolor + ';white-space:nowrap;flex:none">' + label + '</div>' + armChip + plugChip + '</div>'
             +   lockChip + netRight
             + '</div>';
      ]]]
  tap_action:
    action: fire-dom-event
    browser_mod:
      service: browser_mod.popup
      data:
        title: ' '
        style: --mdc-dialog-min-width:340px;--mdc-dialog-max-width:360px;
        content: |
          [[[
            var S = variables.battman;
            var ovJson = JSON.stringify(S.overrides.map(function (o) { return { id: o.id, name: o.name, c: o.color, dim: o.dim, wash: o.shade, as: o.attr_soc, ap: o.attr_price, ar: o.attr_reset, pn: o.attr_pin, ls: o.label_soc, lp: o.label_price, an: o.allow_negative }; }));
            var _any = S.overrides.filter(function(o){return o.id==="any";})[0] || {};
