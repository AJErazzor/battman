            var D = _any.dim || "var(--battman-purple-border)";
            var inner = 'var OV=' + ovJson + ';var PARAMS="' + S.params_entity + '";var EVT="' + S.event_name + '";var TMR="' + S.timer_entity + '";var FCE="' + S.forecast_entity + '",CKW="' + S.charge_kw_entity + '",CAP="' + S.capacity_entity + '",SOCE="' + S.soc_entity + '";var PFIELD="' + S.price_field + '",RSTEP=' + (S.round_step_cents || 1) + ',SMIN=' + (S.safety_min_minutes || 30) + ',SIVL=' + (S.safety_min_intervals || 2) + ';'
              + 'if(!window.BattmanLib){if(!window.__battmanLibLoad){window.__battmanLibLoad=1;var _s=document.createElement("script");_s.src="/battman/battman-lib.js";_s.onload=function(){window.__battmanLibLoad=2;};_s.onerror=function libWaitFailed(){window.__battmanLibLoad=3;};document.head.appendChild(_s);}var _me=arguments.callee,_t0=Date.now();(function libWait(){if(window.BattmanLib)return _me(root);if(window.__battmanLibLoad===3||Date.now()-_t0>15000){root.innerHTML="<div style=\\"padding:16px;color:var(--error-color,#db4437);font-family:var(--battman-font,sans-serif)\\"><b>Battman card problem</b><br>Battman library /battman/battman-lib.js did not load. Refresh the page.</div>";return;}setTimeout(libWait,100);})();return;}var L=window.BattmanLib;'
