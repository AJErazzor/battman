  hold_action:
    action: fire-dom-event
    browser_mod:
      service: browser_mod.popup
      data:
        title: ''
        content: |
          [[[
            return '<div style="background:var(--battman-surface-popup);padding:14px 16px;border-radius:8px;font-family:var(--battman-font);">'
              + '<div style="font-size:9px;font-weight:700;color:var(--battman-text-muted);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--battman-border-neutral-soft);">Override Dock</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:11px;">Rows appear below the dock when an override is active or pinned. The override timer follows the same rule.</div>'
              + '<div style="border-top:1px solid var(--battman-border-neutral-soft);margin:8px 0;"></div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-text-bright);font-weight:600;">Dock tap:</span> control centre \u2014 presets, values, pins and the override timer.</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-text-bright);font-weight:600;">Row tap:</span> quick-edit. <span style="color:var(--battman-text-bright);font-weight:600;">Double-tap:</span> clear. <span style="color:var(--battman-text-bright);font-weight:600;">Hold:</span> help.</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-amber);font-weight:600;">No reset:</span> shown on the right of the dock, with a dot per locked override, and the dock border turns amber. A locked override will NOT clear itself when its target is met.</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-teal);font-weight:600;">Net target:</span> a daily net goal (sell) or budget (buy), set in the control centre. When net today passes it the watchdog clears that side and the dock shows TARGET MET or BUDGET REACHED until the timer ends, a new target is set, or midnight. The No Reset chip hides while a target is shown; padlocks on rows still apply.</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-text-bright);font-weight:600;">Override timer:</span> when running it shows as its own row. Tap the clock \u2014 there or in the control centre \u2014 for the timer sheet: extend chips, run-until chips, or an exact finish time. Pin it to keep it visible while it is off.</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-text-bright);font-weight:600;">Presets:</span> a preset saved with an Until time re-resolves that time every time it is applied.</div>'
              + '<div style="margin-bottom:4px;color:var(--battman-text-muted);font-size:10px;"><span style="color:var(--battman-text-bright);font-weight:600;">Preset names:</span> up to ~9 characters keep the row as-is. Longer names shrink the cost value in steps, then move it beside the kWh figure.</div>'
              + '<div style="margin-top:10px;padding:6px 8px;background:var(--battman-yellow-soft-bg);border-left:2px solid var(--battman-yellow);border-radius:3px;font-size:10px;color:var(--battman-yellow);font-weight:700;letter-spacing:0.02em;">\u26a1 Spike Rules will always override everything</div>'
              + '</div>';
          ]]]
- variables:
    battman: &settings
      params_entity: '[[map:parameters]]'
      soc_entity: '[[map:battery_soc]]'
      timer_entity: '[[map:override_timer]]'
      forecast_entity: '[[map:buy_forecast]]'
      charge_kw_entity: '[[map:available_max_power]]'
      capacity_entity: '[[map:rated_energy_capacity]]'
      price_field: advanced_price_predicted
      round_step_cents: 1
      safety_min_minutes: 30
      safety_min_intervals: 2
      event_name: '[[map:parameters_update_event]]'
      sell_total_entity: '[[map:sell_total]]'
      buy_total_entity: '[[map:buy_total]]'
      overrides:
      - id: sell
        name: Sell Override
        row_label: SELL<br>OVERRIDE
        color: var(--battman-green)
        dim: var(--battman-green-border)
        shade: var(--battman-green-wash)
        shade_border: var(--battman-green-border-soft)
        bg: var(--battman-green-soft-bg)
        attr_soc: sellOverrideSOC
        attr_price: sellOverridePrice
        attr_reset: sellOverrideAllowReset
        price_rule: above
        direction: down
        money_label: EARN
        special_at: 100
        special_desc: NO SELLING
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Fixed battery level to sell down to, overriding the normal time-based curve. Setting 100% means no selling at all.
        help_price: Minimum sell price — energy only sold if price is above this value.
        attr_pin: sellOverridePinned
      - id: sellsolar
        name: Sell Solar
        row_label: SELL<br>SOLAR
        color: var(--battman-orange)
        dim: var(--battman-orange-border)
        shade: var(--battman-orange-wash)
        shade_border: var(--battman-orange-border-soft)
        bg: var(--battman-orange-soft-bg)
        attr_soc: sellSolarSOC
        attr_price: sellSolarPrice
        attr_reset: sellSolarAllowReset
        price_rule: above
        direction: down
        money_label: EARN
        special_at: 0
        special_desc: ''
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Battery level threshold for solar selling, overriding the normal time-based curve.
        help_price: Minimum sell price — solar only sold if price is above this value.
        attr_pin: sellSolarPinned
      - id: buy
        name: Buy Override
        row_label: BUY<br>OVERRIDE
        color: var(--battman-yellow)
        dim: var(--battman-yellow-border)
        shade: var(--battman-yellow-wash)
        shade_border: var(--battman-yellow-border-soft)
        bg: var(--battman-yellow-soft-bg)
        attr_soc: buyOverrideSOC
        attr_price: buyOverridePrice
        attr_reset: buyOverrideAllowReset
        price_rule: below
        direction: up
        money_label: COST
        special_at: 0
        special_desc: ''
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Fixed battery level to buy up to, overriding the normal time-based curve.
        help_price: Maximum buy price — energy only bought if price is below this value.
        allow_negative: true
        attr_pin: buyOverridePinned
      - id: any
        name: Buy Anytime
        row_label: BUY<br>ANYTIME
        color: var(--battman-purple)
        dim: var(--battman-purple-border)
        shade: var(--battman-purple-wash)
        shade_border: var(--battman-purple-border-soft)
        bg: var(--battman-purple-soft-bg)
        attr_soc: buyAnytimeSOC
        attr_price: buyAnytimePrice
        attr_reset: buyAnytimeAllowReset
        price_rule: below
        direction: up
        money_label: COST
        special_at: 0
        special_desc: ''
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Target battery level to charge up to at any time, ignoring the time-based curve.
        help_price: Maximum buy price — energy only bought if price is below this value.
        attr_pin: buyAnytimePinned
      - id: drain
        name: Drain Battery
        row_label: DRAIN<br>BATTERY
        color: var(--battman-red)
        dim: var(--battman-red-border)
        shade: var(--battman-red-wash)
        shade_border: var(--battman-red-border-soft)
        bg: var(--battman-red-soft-bg)
        attr_soc: drainBatterySOC
        attr_price: drainBatteryPrice
        attr_reset: drainBatteryAllowReset
        price_rule: below
        direction: down
        money_label: COST
        special_at: 100
        special_desc: NO DRAINING
        label_soc: SOC %
        label_price: PRICE ¢
        help_soc: Fixed battery level to drain down to — the house runs off the battery with solar off until this level, then the override clears.
        help_price: Only drain while price is below this value (kept for consistency; drain is a manual mode).
        attr_pin: drainBatteryPinned
    ov_id: sell
  entity: '[[map:parameters]]'
  triggers_update:
  - '[[map:parameters]]'
  - '[[map:inverter_soc]]'
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  styles:
    card:
    - padding: '0'
    - margin: '0'
    - height: 60px
    - min-height: 60px
    - max-height: 60px
    - overflow: hidden
    - box-shadow: none
    - border-radius: 8px
    - background: transparent
    - border: none
    grid:
    - grid-template-areas: '"content"'
    - grid-template-columns: 1fr
    - grid-template-rows: 60px
