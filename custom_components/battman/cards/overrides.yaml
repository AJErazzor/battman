        var bg = on ? 'var(--battman-blue-wash)' : 'var(--battman-border-neutral)';
        var bd = on ? 'var(--battman-blue-border-strong)' : 'var(--battman-border-neutral)';
        var kx = on ? '19px' : '2px';
        var kc = on ? 'var(--battman-blue)' : 'var(--battman-text-muted)';
        return '<div onclick="bmT.toggle()" ontouchend="event.preventDefault();bmT.toggle()" class="bmp" style="width:46px;height:27px;border-radius:999px;position:relative;cursor:pointer;'
             + 'background:' + bg + ';border:1px solid ' + bd + '">'
             + '<div style="position:absolute;top:2px;left:' + kx + ';width:21px;height:21px;border-radius:50%;background:' + kc + ';transition:all .2s"></div>'
             + '</div>'
             + '<div id="bmt-diag" style="display:none;position:absolute;left:8px;right:8px;bottom:2px;z-index:9;background:var(--battman-darkred-bg);color:var(--battman-darkred);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-align:center;pointer-events:none"></div>'
             + '<style>.bmp:active{transform:scale(0.94)}.bmb{transition:filter .1s,transform .1s}.bmb:active{transform:scale(0.94);filter:brightness(1.6)}</style>';
      ]]]
