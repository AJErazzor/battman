# name: Settings
# description: Every Battman setting on one page, in sections you can drag between two columns.
# preview: settings.webp
#
# A Battman card: on a dashboard it's `type: custom:battman-settings`, and it updates
# with Battman releases. For now it shows Battman's Settings page (/battmanfiles/settings.html)
# in a frame; the card name stays the same if that changes later.
#
# Size: in a panel view it fills the page (best: the page scrolls by itself); in a sections
# view, drag it to the size you want. aspect_ratio only applies in an older masonry view.
type: iframe
url: /battmanfiles/settings.html
aspect_ratio: "100:100"
grid_options:
  columns: full
  rows: 16
  min_rows: 8
