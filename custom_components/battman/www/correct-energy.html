<!DOCTYPE html>
<!-- Battman Correct Totals: fix the buy/sell totals for a period (from Smiggles correct_energy4).
     Entities come from Battman's entity map; colours from a Battman theme. No fallbacks:
     anything missing is shown as an error. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battman Correct Totals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--primary-font-family, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif);
      background: var(--battman-surface-card);
      color: var(--battman-text-bright);
      padding: 10px;
    }

    .intro { font-size: 12px; color: var(--battman-text-muted); margin-bottom: 10px; line-height: 1.4; }

    .status {
      font-size: 12px; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px;
      text-align: center; display: none;
    }
    .status.show { display: block; }
    .status.info    { background: var(--battman-blue-soft-bg);  color: var(--battman-blue); }
    .status.success { background: var(--battman-green-soft-bg); color: var(--battman-green); }
    .status.error   { background: var(--battman-red-soft-bg);   color: var(--battman-red); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

    .period-block { border: 1px solid var(--battman-border-neutral); border-radius: 6px; padding: 10px; }

    .period-title {
      font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--battman-text-muted); margin-bottom: 8px;
    }

    .field-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .field-label { font-size: 12px; color: var(--battman-text-muted); width: 28px; flex-shrink: 0; }

    input[type="number"] {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid var(--battman-border-neutral);
      color: var(--battman-text-bright); font-size: 13px; font-family: inherit;
      padding: 3px 2px; outline: none; text-align: right; min-width: 0; -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"]:focus { border-bottom-color: var(--battman-amber); }

    .btn-row { display: flex; gap: 5px; margin-top: 8px; }
    button {
      flex: 1; padding: 7px 0; border-radius: 4px; font-size: 11px; font-family: inherit; font-weight: 600;
      cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase; transition: opacity 0.15s;
    }
    button:active { opacity: 0.6; }
    .btn-apply { background: var(--battman-amber-soft-bg); color: var(--battman-amber); border: 1px solid var(--battman-amber); }
    .btn-reset { background: transparent; color: var(--battman-text-muted); border: 1px solid var(--battman-border-neutral); }

    .fatal { padding: 24px; font-family: sans-serif; color: #ccc; background: #1c1c1c; min-height: 100vh; }
    .fatal b { display: block; margin-bottom: 12px; letter-spacing: .05em; }
  </style>
</head>
<body>
  <div id="app">
    <div class="intro">Overwrites the running totals for a period. Use it to fix a total that went wrong.
      The totals keep counting from whatever you set.</div>
    <div id="status" class="status"></div>
    <div class="grid" id="periods"></div>
  </div>
  <script>
    const PERIODS = [
      { key: 'day',       label: 'Today' },
      { key: 'yesterday', label: 'Yesterday' },
      { key: 'month',     label: 'This Month' },
      { key: 'bill',      label: 'Billing Period' },
    ];
    const NEEDS = ['sell_total', 'buy_total'];
    // Battman theme colours this page needs. No built-in fallbacks.
    const THEME_VARS = ['--battman-surface-card', '--battman-text-bright', '--battman-text-muted',
      '--battman-border-neutral', '--battman-amber', '--battman-amber-soft-bg', '--battman-blue',
      '--battman-blue-soft-bg', '--battman-green', '--battman-green-soft-bg', '--battman-red',
      '--battman-red-soft-bg'];
    let SELL_ENTITY, BUY_ENTITY;

    function getHass() {
      try { const el = window.parent.document.querySelector('home-assistant'); return el ? el.hass : null; }
      catch (e) { return null; }
    }
    function getToken() { const h = getHass(); return h && h.auth && h.auth.data && h.auth.data.access_token; }

    function showStatus(msg, type = 'info') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `status show ${type}`;
      if (type === 'success') setTimeout(() => el.className = 'status', 2500);
    }
    function showFatal(msg) {
      document.body.innerHTML = '<div class="fatal"><b>BATTMAN CORRECT TOTALS PROBLEM</b></div>';
      const p = document.createElement('div'); p.textContent = msg;
      document.querySelector('.fatal').appendChild(p);
    }

    // ---- startup checks: entity map, theme, entities + their period attributes ----
    async function loadEntityMap() {
      const tok = getToken();
      if (!tok) throw new Error('Not logged in to Home Assistant (no access token from the parent page).');
      const r = await fetch('/api/battman/entities', { headers: { Authorization: 'Bearer ' + tok } });
      if (!r.ok) throw new Error('Battman entity map unavailable (HTTP ' + r.status + '). Is the Battman integration installed and set up?');
      const m = (await r.json()).entities || {};
      const missing = NEEDS.filter(k => !m[k]);
      if (missing.length) throw new Error('Battman entity map has no entry for: ' + missing.join(', '));
      SELL_ENTITY = m.sell_total; BUY_ENTITY = m.buy_total;
    }
    function syncTheme() {
      let ps; try { ps = parent.getComputedStyle(window.frameElement || parent.document.documentElement); }
      catch (e) { return 'Cannot read the dashboard theme.'; }
      const missing = THEME_VARS.filter(v => !ps.getPropertyValue(v).trim());
      if (missing.length) return 'Theme colour ' + missing.slice(0, 4).join(', ') + (missing.length > 4 ? ' (+' + (missing.length - 4) + ' more)' : '') + ' not found — this view needs a Battman theme.';
      THEME_VARS.concat(['--primary-font-family']).forEach(v => {
        const val = ps.getPropertyValue(v).trim(); if (val) document.documentElement.style.setProperty(v, val);
      });
      return null;
    }
    // Returns {sell, buy} state objects, or throws naming exactly what's missing.
    function readTotals() {
      const h = getHass();
      if (!h) throw new Error('Home Assistant not reachable from this page.');
      const out = {}, problems = [];
      [['sell', 'sell_total', SELL_ENTITY], ['buy', 'buy_total', BUY_ENTITY]].forEach(([k, name, id]) => {
        const st = h.states[id];
        if (!st) { problems.push('entity not found: ' + name + ' → ' + id); return; }
        const bad = PERIODS.map(p => p.key).filter(a => !isFinite(parseFloat(st.attributes[a])));
        if (bad.length) problems.push(id + ' has no number for: ' + bad.join(', '));
        out[k] = st;
      });
      if (problems.length) throw new Error('Battman entity map: ' + problems.join('; '));
      return out;
    }

    function fmt(v) { return parseFloat(v).toFixed(4); }

    function render(t) {
      const container = document.getElementById('periods');
      container.innerHTML = '';
      PERIODS.forEach(p => {
        const block = document.createElement('div');
        block.className = 'period-block';
        block.innerHTML = `
          <div class="period-title">${p.label}</div>
          <div class="field-row"><span class="field-label">Sell</span>
            <input type="number" id="sell-${p.key}" value="${fmt(t.sell.attributes[p.key])}" step="0.0001"></div>
          <div class="field-row"><span class="field-label">Buy</span>
            <input type="number" id="buy-${p.key}" value="${fmt(t.buy.attributes[p.key])}" step="0.0001"></div>
          <div class="btn-row">
            <button class="btn-apply" data-apply="${p.key}">Apply</button>
            <button class="btn-reset" data-reset="${p.key}">Reset</button>
          </div>`;
        container.appendChild(block);
      });
      container.querySelectorAll('[data-apply]').forEach(b => b.addEventListener('click', () => applyCorrection(b.dataset.apply)));
      container.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => resetInputs(b.dataset.reset)));
    }

    async function applyCorrection(key) {
      const label = PERIODS.find(p => p.key === key).label;
      const sellIn = document.getElementById(`sell-${key}`).value.trim();
      const buyIn  = document.getElementById(`buy-${key}`).value.trim();
      const newSell = parseFloat(sellIn), newBuy = parseFloat(buyIn);
      if (sellIn === '' || buyIn === '' || !isFinite(newSell) || !isFinite(newBuy)) {
        showStatus(`${label}: enter a number for both Sell and Buy`, 'error'); return;
      }
      let t;
      try { t = readTotals(); } catch (e) { showStatus(e.message, 'error'); return; }
      const oldSell = fmt(t.sell.attributes[key]), oldBuy = fmt(t.buy.attributes[key]);
      if (!confirm(`Set ${label}:\n\nSell  $${oldSell} → $${fmt(newSell)}\nBuy   $${oldBuy} → $${fmt(newBuy)}\n\nThis overwrites the running totals.`)) {
        showStatus('Not changed', 'info'); return;
      }
      showStatus('Applying…', 'info');
      const hass = getHass();
      try {
        await hass.callApi('POST', `states/${SELL_ENTITY}`, { state: t.sell.state, attributes: { ...t.sell.attributes, [key]: newSell } });
        await hass.callApi('POST', `states/${BUY_ENTITY}`,  { state: t.buy.state,  attributes: { ...t.buy.attributes,  [key]: newBuy } });
        showStatus(`✓ ${label} updated`, 'success');
      } catch (e) {
        showStatus(`Error: ${e && e.message || e}`, 'error');
      }
    }

    function resetInputs(key) {
      let t;
      try { t = readTotals(); } catch (e) { showStatus(e.message, 'error'); return; }
      document.getElementById(`sell-${key}`).value = fmt(t.sell.attributes[key]);
      document.getElementById(`buy-${key}`).value  = fmt(t.buy.attributes[key]);
    }

    (async function start() {
      try { await loadEntityMap(); } catch (e) { showFatal(e.message); return; }
      const themeProblem = syncTheme();
      if (themeProblem) { showFatal(themeProblem); return; }
      let t;
      try { t = readTotals(); } catch (e) { showFatal(e.message); return; }
      render(t);
      setInterval(syncTheme, 5000);   // follow a live theme switch on the view
    })();
  </script>
</body>
</html>
