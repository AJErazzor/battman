<!DOCTYPE html>
<!-- Battman Cost Chart (reset hour = largest-abs change; handles buy's positive reset spike when odometer runs negative) -->
<!-- Served by the Battman integration at /battmanfiles/cost-chart.html. Entities come from Battman's entity map; colours from a Battman theme. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Last 10 Days Activity</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root {
    --bg:      var(--primary-background-color, #111318);
    --card:    var(--card-background-color, #1c1e24);
    --text:    var(--primary-text-color, #e5e7eb);
    --muted:   var(--secondary-text-color, #9aa4b2);
    --border:  var(--divider-color, #2a2d35);
    --accent:  var(--primary-color, #4b9fea);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  input, textarea, select, button { font-family: inherit; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--primary-font-family, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif);
    padding: 0;
  }
  .panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .title {
    padding: 12px 16px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .stats {
    display: flex; flex-wrap: wrap; gap: 10px 18px;
    justify-content: space-between; align-items: center;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
  }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .stat .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .statbreak { display: none; }
  @media (max-width: 640px) { .statbreak { display: block; flex-basis: 100%; height: 0; } }
  .chartWrap { flex: 1; position: relative; padding: 10px 10px 6px; min-height: 0; }
  .msg { padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
  /* --- range controls --- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; font-weight: 600; line-height: 1;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .pill:hover { color: var(--text); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dates { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .dates label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .dates input[type="date"] {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 8px; font: inherit; font-size: 12px; color-scheme: dark;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="title" id="titleEl">Last 10 Days Activity</div>
  <div class="controls">
    <div class="pills" id="pills"></div>
    <div class="dates">
      <label>From <input type="date" id="fromDt"></label>
      <label>To <input type="date" id="toDt"></label>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chartWrap"><canvas id="c"></canvas><div class="msg" id="msg" style="display:none"></div></div>
</div>

<script>
  if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);
  Chart.defaults.plugins.datalabels = Chart.defaults.plugins.datalabels || {};

  const DAY_PILLS = [5, 10, 14, 20, 30];
  const DEFAULT_DAYS = window.matchMedia('(max-width: 640px)').matches ? 5 : 10;
  let curStart = null, curEnd = null;   // Date at 00:00 for first / last day shown
  let curKey = null;                     // which pill is active ('days:N' | 'cycle:0' | 'cycle:1' | 'custom')
  // Entity IDs come from Battman's entity map (GET /api/battman/entities).
  // The page only knows the Battman names below.
  const NEEDS = ['buy_total', 'sell_total', 'network_fee_total', 'parameters', 'grid_export_today', 'grid_import_today'];
  let ENT_BUY, ENT_SELL, ENT_FEE, ENT_PARAM, ENT_EXP, ENT_IMP;

  // Battman theme colours this page needs. No built-in fallbacks: if the view
  // isn't on a Battman theme the page says so instead of guessing.
  const THEME_VARS = ['--battman-green', '--battman-amber', '--battman-red'];

  let COL = { grid:'#2a2d35', muted:'#9aa4b2', text:'#e5e7eb' };
  let FATAL = null;   // set when the page can't run; shown instead of the chart
  let chart = null;

  function haRoot() { try { return parent.document.querySelector('home-assistant'); } catch(e){ return null; } }
  function getHass() { const r = haRoot(); return r && r.hass; }
  function getToken() { const h = getHass(); return h && h.auth && h.auth.data && h.auth.data.access_token; }

  // pull theme tokens across the iframe boundary
  function syncTheme() {
    let el; try { el = window.frameElement || parent.document.documentElement; } catch(e){ return; }
    const ps = parent.getComputedStyle(el);
    const map = { '--bg':'--primary-background-color','--card':'--card-background-color','--text':'--primary-text-color',
                  '--muted':'--secondary-text-color','--border':'--divider-color','--accent':'--primary-color',
                  '--green':'--battman-green','--amber':'--battman-amber','--red':'--battman-red',
                  '--primary-font-family':'--primary-font-family' };
    for (const [loc, tok] of Object.entries(map)) { const v = ps.getPropertyValue(tok).trim(); if (v) document.documentElement.style.setProperty(loc, v); }
    const g = getComputedStyle(document.documentElement);
    COL = {
      green: g.getPropertyValue('--green').trim(),
      amber: g.getPropertyValue('--amber').trim(),
      red:   g.getPropertyValue('--red').trim(),
      grid:  g.getPropertyValue('--border').trim()|| COL.grid,
      muted: g.getPropertyValue('--muted').trim() || COL.muted,
      text:  g.getPropertyValue('--text').trim()  || COL.text,
    };
    // Canvas text can't read CSS var() — set Chart.js's font from the live theme font.
    if (window.Chart) { const ff = g.getPropertyValue('--primary-font-family').trim(); if (ff) Chart.defaults.font.family = ff; }
  }

  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const money = v => (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
  const barColor = v => v < 0 ? COL.red : (v < 2 ? COL.amber : COL.green);

  // contrast: choose dark/light label text based on the bar colour's luminance
  function parseColor(s) {
    if (!s) return null; s = String(s).trim();
    if (s[0] === '#') { let h = s.slice(1); if (h.length === 3) h = h.split('').map(x => x + x).join(''); if (h.length >= 6) return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) }; }
    const m = s.match(/rgba?\(([^)]+)\)/); if (m) { const p = m[1].split(',').map(Number); return { r: p[0], g: p[1], b: p[2] }; }
    return null;
  }
  function labelColor(bg) {
    const c = parseColor(bg); if (!c) return COL.text;
    const L = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;   // 0..255
    return L > 140 ? '#141414' : '#f5f5f5';
  }

  // ---- header stats (mirrors the ApexCharts header series) ----
  function renderStats() {
    const h = getHass(); if (!h) return;
    const S = id => h.states[id];
    const sell = S(ENT_SELL), buy = S(ENT_BUY), P = S(ENT_PARAM), feeS = S(ENT_FEE);
    if (!sell || !buy || !P) return;
    const expKwh = num(S(ENT_EXP) && S(ENT_EXP).state);
    const impKwh = num(S(ENT_IMP) && S(ENT_IMP).state);
    const sellDay = num(sell.attributes.day), buyDay = num(buy.attributes.day);
    const sellAvg = expKwh > 0 ? sellDay/expKwh : 0, buyAvg = impKwh > 0 ? buyDay/impKwh : 0;
    // fee now read from the network-fee odometer's accumulators (recorded per-period), not fee × days
    const thisBill = num(sell.attributes.bill) - num(buy.attributes.bill) - num(feeS && feeS.attributes.bill);
    const lastBill = num(sell.attributes.bill_last) - num(buy.attributes.bill_last) - num(feeS && feeS.attributes.bill_last);
    const withAmber = num(P.attributes.energyIncome) + num(sell.state) - num(buy.state) - num(feeS && feeS.state);

    const sgn = v => v >= 0 ? COL.green : COL.red;
    const items = [
      { k:'Today Sell', v:`${expKwh.toFixed(2)} kWh @ $${sellAvg.toFixed(2)}`, c:COL.green },
      { k:'Today Buy',  v:`${impKwh.toFixed(2)} kWh @ $${buyAvg.toFixed(2)}`, c:COL.amber },
      { brk:true },
      { k:'This Bill', v:money(thisBill), c:sgn(thisBill) },
      { k:'Last Bill', v:money(lastBill), c:sgn(lastBill) },
      { k:'Lifetime', v:money(withAmber), c:sgn(withAmber) },
    ];
    document.getElementById('stats').innerHTML = items.map(it =>
      it.brk ? '<div class="statbreak"></div>'
      : `<div class="stat"><span class="k">${it.k}</span><span class="v" style="color:${it.c}">${it.v}</span></div>`
    ).join('');
  }

  // ---- range state: pills (N days ending today) or a custom From/To date range ----
  const pad2 = n => String(n).padStart(2, '0');
  function midnight(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function dayCount(){ return Math.round((midnight(curEnd) - midnight(curStart)) / 86400000) + 1; }
  function toDateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function fromDateStr(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  const RANGE_KEY = 'battman.costRange';
  function saveRange(v){ try { localStorage.setItem(RANGE_KEY, JSON.stringify(v)); } catch(e){} }
  function loadRange(){
    try {
      // one-time move of the range saved by the old Smiggles page
      const old = localStorage.getItem('costRange');
      if (old !== null) { if (localStorage.getItem(RANGE_KEY) === null) localStorage.setItem(RANGE_KEY, old); localStorage.removeItem('costRange'); }
      return JSON.parse(localStorage.getItem(RANGE_KEY));
    } catch(e){ return null; }
  }

  // bill cycle: read the day-of-month from the parameters sensor (falls back to 19)
  function billDay(){
    const h = getHass(); const P = h && h.states[ENT_PARAM];
    const d = P && Number(P.attributes.billDayOfMonth);
    return (isFinite(d) && d >= 1 && d <= 31) ? d : 19;
  }
  // start date of the cycle `back` cycles before the one containing `ref` (back=0 -> current)
  function cycleStart(ref, back){
    const bd = billDay();
    let y = ref.getFullYear(), m = ref.getMonth();
    if (ref.getDate() < bd) m -= 1;   // before this month's bill day -> cycle began last month
    m -= back;
    const d = new Date(y, m, 1);      // JS normalises month over/underflow
    const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(bd, dim));     // clamp (e.g. bill day 31 in a short month)
    return midnight(d);
  }
  function daysRange(n){
    const end = midnight(new Date());
    const start = new Date(end); start.setDate(start.getDate() - (n - 1));
    return { start, end, key: 'days:' + n };
  }
  function cycleRange(back){
    const today = midnight(new Date());
    const start = cycleStart(today, back);
    let end;
    if (back === 0) { end = today; }
    else { end = cycleStart(today, 0); end.setDate(end.getDate() - 1); }   // day before current cycle
    return { start, end, key: 'cycle:' + back };
  }

  function applyRange(start, end, key){ curStart = start; curEnd = end; curKey = key; syncControls(); }
  function setDaysMode(n){ const r = daysRange(n); applyRange(r.start, r.end, r.key); saveRange({ mode:'days', n }); render(); }
  function setCycleMode(back){ const r = cycleRange(back); applyRange(r.start, r.end, r.key); saveRange({ mode:'cycle', back }); render(); }
  function setCustomRange(from, to){
    let s = midnight(from), e = midnight(to);
    if (e < s) { const t = s; s = e; e = t; }        // swap if reversed
    applyRange(s, e, 'custom');
    saveRange({ mode:'custom', from: toDateStr(s), to: toDateStr(e) });
    render();
  }

  const PILLS = [
    ...DAY_PILLS.map(n => ({ key:'days:'+n, label:n+'d', fn:() => setDaysMode(n) })),
    { key:'cycle:0', label:'This cycle', fn:() => setCycleMode(0) },
    { key:'cycle:1', label:'Last cycle', fn:() => setCycleMode(1) },
  ];

  function syncControls(){
    document.querySelectorAll('.pill').forEach(b => b.classList.toggle('active', b.dataset.key === curKey));
    const from = document.getElementById('fromDt'), to = document.getElementById('toDt');
    const today = toDateStr(midnight(new Date()));
    from.max = today; to.max = today;
    from.value = toDateStr(curStart); to.value = toDateStr(curEnd);
    const t = document.getElementById('titleEl');
    if (curKey === 'cycle:0') t.textContent = 'This Bill Cycle';
    else if (curKey === 'cycle:1') t.textContent = 'Last Bill Cycle';
    else if (curKey && curKey.indexOf('days:') === 0) t.textContent = 'Last ' + curKey.slice(5) + ' Days Activity';
    else { const f = d => d.toLocaleDateString([], { day:'2-digit', month:'short' }); t.textContent = f(curStart) + ' – ' + f(curEnd); }
  }
  function buildControls(){
    document.getElementById('pills').innerHTML =
      PILLS.map(p => '<button class="pill" data-key="' + p.key + '">' + p.label + '</button>').join('');
    document.querySelectorAll('.pill').forEach(b => {
      const p = PILLS.find(x => x.key === b.dataset.key); if (p) b.onclick = p.fn;
    });
    const onDate = () => {
      const f = document.getElementById('fromDt').value, tv = document.getElementById('toDt').value;
      if (f && tv) setCustomRange(fromDateStr(f), fromDateStr(tv));
    };
    document.getElementById('fromDt').addEventListener('change', onDate);
    document.getElementById('toDt').addEventListener('change', onDate);
  }
  function initRange(){
    const saved = loadRange();
    if (saved && saved.mode === 'custom' && saved.from && saved.to){
      let s = midnight(fromDateStr(saved.from)), e = midnight(fromDateStr(saved.to));
      if (e < s) { const t = s; s = e; e = t; }
      applyRange(s, e, 'custom'); return;
    }
    if (saved && saved.mode === 'cycle' && (saved.back === 0 || saved.back === 1)){
      const r = cycleRange(saved.back); applyRange(r.start, r.end, r.key); return;
    }
    const n = (saved && saved.mode === 'days' && DAY_PILLS.includes(saved.n)) ? saved.n : DEFAULT_DAYS;
    const r = daysRange(n); applyRange(r.start, r.end, r.key);
  }

  // ---- daily values from long-term statistics (survives the 10-day recorder purge) ----
  // Uses each sensor's daily `change` (delta of the cumulative $ total, reset-safe).
  // Today's (partial) day is taken live from the sensor's `day` attribute for accuracy.
  async function fetchStats(startDate, endDate, period){
    const h = getHass(); if (!h || !h.connection) return null;
    try {
      return await h.connection.sendMessagePromise({
        type: 'recorder/statistics_during_period',
        start_time: startDate.toISOString(),
        end_time: endDate.toISOString(),
        statistic_ids: [ENT_BUY, ENT_SELL, ENT_FEE],
        period: period || 'day',
        types: ['change', 'state'],
      });
    } catch(e){ return null; }
  }
  function changeByDay(rows){
    const m = {};
    (rows||[]).forEach(r => { m[toDateStr(midnight(new Date(r.start)))] = Number(r.change) || 0; });
    return m;
  }
  // per-day network fee from the odometer's daily `change`. `present` marks which days the
  // sensor actually recorded — days before it existed simply have no row, and the caller
  // falls back to the flat current fee for those. The odometer's very first row reports
  // change 0 (no prior point to diff), so that birth day is treated as no-data too.
  function feeByDay(rows){
    const feeM = {}, present = {}; let first = true;
    (rows||[]).forEach(r => {
      const k = toDateStr(midnight(new Date(r.start)));
      const c = Number(r.change) || 0;
      if (first) { first = false; if (c === 0) return; }   // skip birth-day zero
      feeM[k] = c; present[k] = true;
    });
    return { feeM, present };
  }
  // Days a cumulative $ total ran *down* (negative daily `change`). These totals only ever
  // climb during normal trading, so a negative day is reset-safe to detect by sign alone —
  // and, unlike comparing to the previous day's state, still fires on the first day in view.
  function negDays(rows){
    const out = {};
    (rows||[]).forEach(r => { if ((Number(r.change) || 0) < -0.01) out[toDateStr(midnight(new Date(r.start)))] = true; });
    return out;
  }
  // A "bank it" zeroes buy, sell AND fee together. The FEE total is the authoritative signal:
  // it only ever accrues and is never credited, so ANY negative fee day is a bank. For days
  // before the fee sensor existed (no fee rows) fall back to buy AND sell both negative the
  // same day — requiring both guards against a one-off credit/adjustment that hits just one.
  function bankDays(res){
    const out = Object.assign({}, negDays(res[ENT_FEE]));
    const buy = negDays(res[ENT_BUY]), sell = negDays(res[ENT_SELL]);
    for (const k in buy) if (sell[k]) out[k] = true;
    return out;
  }
  // rebuild a reset day's true value from hourly change, dropping the single reset hour.
  // The reset hour is the largest-MAGNITUDE change: a negative drop when the odometer was
  // positive (sell/fee), or a POSITIVE spike when it was negative (buy runs negative on
  // negative import prices, so its bank reset jumps *up* to zero). Dropping min() only caught
  // the negative case and left buy's positive reset spike in — hence buy stayed wrong.
  async function reconstructDay(dayStart){
    const s = midnight(dayStart), e = new Date(midnight(dayStart)); e.setDate(e.getDate() + 1);
    const res = await fetchStats(s, e, 'hour');
    const rec = ent => {
      const hrs = ((res && res[ent]) || []).map(r => Number(r.change) || 0);
      if (!hrs.length) return 0;
      let reset = 0;
      for (const h of hrs) if (Math.abs(h) > Math.abs(reset)) reset = h;
      return Number((hrs.reduce((a, b) => a + b, 0) - reset).toFixed(4));
    };
    return { buy: rec(ENT_BUY), sell: rec(ENT_SELL), fee: rec(ENT_FEE) };
  }
  async function fetchDaily() {
    const start = midnight(curStart);
    let qEnd = new Date(midnight(curEnd)); qEnd.setDate(qEnd.getDate() + 1);   // exclusive: include last day fully
    const res = await fetchStats(start, qEnd);
    if (!res) return null;
    const buyM = changeByDay(res[ENT_BUY]), sellM = changeByDay(res[ENT_SELL]);
    const { feeM, present: feePresent } = feeByDay(res[ENT_FEE]);

    // bank/reset day (fee negative, or pre-fee-era buy+sell both negative): rebuild all three
    // for that day from hourly stats (drops the single reset hour) so the day shows its real
    // positive values instead of the −$ reset spike.
    const resetSet = bankDays(res);
    for (const k in resetSet) {
      const rec = await reconstructDay(fromDateStr(k));
      buyM[k] = rec.buy; sellM[k] = rec.sell;
      if (feePresent[k]) feeM[k] = rec.fee;
    }

    const h = getHass();
    const flatFee = h ? num(h.states[ENT_PARAM] && h.states[ENT_PARAM].attributes.dailyNetworkCharge) : 0;
    const todayKey = toDateStr(midnight(new Date()));
    const n = dayCount();
    const days = [], buy = [], sell = [], fee = [];
    for (let i = 0; i < n; i++) {
      const d = new Date(start); d.setDate(d.getDate()+i);
      const k = toDateStr(d);
      days.push(d); buy.push(buyM[k] || 0); sell.push(sellM[k] || 0);
      // today's fee is deterministic (stats lag ~1h); older days use the odometer where it
      // recorded, else the flat current fee for days before the sensor existed
      fee.push(k === todayKey ? flatFee : (feePresent[k] ? (feeM[k] || 0) : flatFee));
    }
    // overlay today's live partial values (statistics lag ~1h)
    if (h && n > 0 && toDateStr(days[n-1]) === todayKey){
      const bLive = Number(h.states[ENT_BUY] && h.states[ENT_BUY].attributes.day);
      const sLive = Number(h.states[ENT_SELL] && h.states[ENT_SELL].attributes.day);
      if (isFinite(bLive)) buy[n-1] = bLive;
      if (isFinite(sLive)) sell[n-1] = sLive;
    }
    return { days, buy, sell, fee };
  }

  // net total drawn above/below each day's stack
  function roundRectPath(ctx, x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const totalsPlugin = {
    id: 'stackTotals',
    afterDatasetsDraw(c) {
      const { ctx, scales:{ y } } = c;
      const meta = c.getDatasetMeta(0);
      if (!meta || !meta.data) return;
      const n = c.data.labels.length;
      const avail = n > 0 ? c.chartArea.width / n : 0;   // horizontal space per bar
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const el = meta.data[i]; if (!el) continue;
        let total = 0, pos = 0;
        c.data.datasets.forEach(ds => { const v = Number(ds.data[i]) || 0; total += v; if (v > 0) pos += v; });
        const fs = Math.max(11, Math.min(22, Math.round((el.width || 0) * 0.22)));
        ctx.font = '800 ' + fs + 'px "Segoe UI", Roboto, sans-serif';
        const txt = money(total);
        const boxH = fs + 6;
        const cx = el.x, cy = y.getPixelForValue(pos) - (boxH / 2) - 4;
        const boxW = ctx.measureText(txt).width + 12, bg = total >= 0 ? COL.green : COL.red;
        if (boxW > avail - 2) continue;   // would overlap the neighbouring bar's badge -> hide (see tooltip)
        roundRectPath(ctx, cx - boxW / 2, cy - boxH / 2, boxW, boxH, 4);
        ctx.fillStyle = bg; ctx.fill();
        ctx.fillStyle = labelColor(bg);
        ctx.fillText(txt, cx, cy);
      }
      ctx.restore();
    }
  };

  // per-segment $ labels, drawn only when the text fits inside that segment's rectangle
  const segLabelsPlugin = {
    id: 'segLabels',
    afterDatasetsDraw(c) {
      const ctx = c.ctx;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      [0, 1].forEach(di => {                       // dataset 0 = Cost (fee+buy), 1 = Sell — each labelled when it fits its segment
        const meta = c.getDatasetMeta(di); if (!meta || meta.hidden || !meta.data) return;
        const ds = c.data.datasets[di];
        meta.data.forEach((el, i) => {
          if (!el) return;
          const v = Number(ds.data[i]);
          if (!isFinite(v) || Math.abs(v) < 0.005) return;
          const w = el.width || 0;
          const base = (el.base != null) ? el.base : el.y;
          const h = Math.abs(base - el.y);
          const fs = Math.max(10, Math.min(18, Math.round(w * 0.20)));
          ctx.font = '700 ' + fs + 'px "Segoe UI", Roboto, sans-serif';
          const txt = money(v);
          const tw = ctx.measureText(txt).width;
          // Buy (di=1) and Sell (di=2) are judged independently: show each value whenever it
          // genuinely fits its OWN segment; one too-small segment never hides the other.
          if (h < fs + 2 || w < tw + 4) return;   // doesn't actually fit -> skip (tooltip still has it)
          const cx = el.x, cy = (el.y + base) / 2;
          const bw = tw + 8, bh = fs + 4;
          roundRectPath(ctx, cx - bw / 2, cy - bh / 2, bw, bh, 3);
          ctx.fillStyle = 'rgba(20,20,20,0.55)'; ctx.fill();
          ctx.fillStyle = '#f5f5f5'; ctx.fillText(txt, cx, cy);
        });
      });
      ctx.restore();
    }
  };

  async function render() {
    if (FATAL) { showMsg(FATAL); return; }
    if (typeof Chart === 'undefined') { showMsg('Chart library unavailable (offline?)'); return; }
    const data = await fetchDaily();
    if (!data) { showMsg('History unavailable'); return; }
    hideMsg();

    const labels = data.days.map(d => d.toLocaleDateString([], { day:'2-digit', month:'short' }));
    // Fee + Buy are merged into one "Cost" segment; the label shows based on the combined size.
    // Per-day fee/buy/sell arrays are retained so the tooltip can still break them out.
    const costArr = data.days.map((_, i) => -((data.fee[i] || 0) + (data.buy[i] || 0)));
    const sellArr = data.sell.map(s => s);
    const dsColor = ctx => barColor(ctx.raw);
    const mk = (label, arr) => ({
      label, data: arr, stack: 'day',
      backgroundColor: dsColor, borderWidth: 0,
      borderRadius: 3, maxBarThickness: 80,
      datalabels: { display: false }   // segment values are drawn by segLabelsPlugin (reliable fit check)
    });

    const cfg = {
      type: 'bar',
      data: { labels, datasets: [ mk('Cost', costArr), mk('Sell', sellArr) ] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 36, bottom: 20 } },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          datalabels: { clip: true },
          tooltip: {
            mode: 'index', intersect: false,
            displayColors: false,
            filter: it => Math.abs(Number(it.raw)) >= 0.005,
            callbacks: {
              // Cost is drawn as one bar but broken back out here into Fee / Buy / Sell
              label: c => {
                if (c.dataset.label !== 'Cost') return null;
                const i = c.dataIndex;
                const fee = data.fee[i] || 0, buy = data.buy[i] || 0, sell = data.sell[i] || 0;
                return [' Fee: ' + money(-fee), ' Buy: ' + money(-buy), ' Sell: ' + money(sell)];
              },
              footer: items => {
                const i = items.length ? items[0].dataIndex : 0;
                const fee = data.fee[i] || 0, buy = data.buy[i] || 0, sell = data.sell[i] || 0;
                return 'Net: ' + money(sell - buy - fee);
              }
            }
          }
        },
        scales: {
          x: { stacked: true, ticks: { color: COL.muted }, grid: { display: false } },
          y: { stacked: true, ticks: { color: COL.muted, callback: v => money(v) }, grid: { color: COL.grid } }
        }
      },
      plugins: [ totalsPlugin, segLabelsPlugin ]
    };
    if (chart) chart.destroy();
    const c = new Chart(document.getElementById('c').getContext('2d'), cfg);
    chart = c;
    // container height settles after layout inside the iframe — nudge a resize
    requestAnimationFrame(function () { try { c.resize(); } catch (e) {} });
    setTimeout(function () { try { c.resize(); } catch (e) {} }, 250);
    setTimeout(function () { try { c.resize(); } catch (e) {} }, 800);
  }
  window.addEventListener('resize', function () { if (chart) { try { chart.resize(); } catch (e) {} } });

  function showMsg(m){ const e=document.getElementById('msg'); e.style.display=''; e.textContent=m; document.getElementById('c').style.display='none'; }
  function hideMsg(){ document.getElementById('msg').style.display='none'; document.getElementById('c').style.display=''; }

  // ---- startup checks: entity map + Battman theme. Problems are shown, never papered over. ----
  async function loadEntityMap(){
    const tok = getToken();
    if (!tok) throw new Error('Not logged in to Home Assistant (no access token from the parent page).');
    const r = await fetch('/api/battman/entities', { headers: { Authorization: 'Bearer ' + tok } });
    if (!r.ok) throw new Error('Battman entity map unavailable (HTTP ' + r.status + '). Is the Battman integration installed and set up?');
    const m = (await r.json()).entities || {};
    const missing = NEEDS.filter(k => !m[k]);
    if (missing.length) throw new Error('Battman entity map has no entry for: ' + missing.join(', '));
    ENT_BUY = m.buy_total; ENT_SELL = m.sell_total; ENT_FEE = m.network_fee_total;
    ENT_PARAM = m.parameters; ENT_EXP = m.grid_export_today; ENT_IMP = m.grid_import_today;
  }
  function checkEntities(){
    const h = getHass(); if (!h) return 'Home Assistant not reachable from this page.';
    const bad = NEEDS.map((k, i) => [k, [ENT_BUY, ENT_SELL, ENT_FEE, ENT_PARAM, ENT_EXP, ENT_IMP][i]])
                     .filter(([k, id]) => !h.states[id]).map(([k, id]) => k + ' \u2192 ' + id);
    return bad.length ? 'Battman entity map: entity not found: ' + bad.join(', ') : null;
  }
  function checkTheme(){
    let ps; try { ps = parent.getComputedStyle(window.frameElement || parent.document.documentElement); } catch(e){ return 'Cannot read the dashboard theme.'; }
    const missing = THEME_VARS.filter(v => !ps.getPropertyValue(v).trim());
    return missing.length ? 'Theme colour ' + missing.join(', ') + ' not found \u2014 this view needs a Battman theme.' : null;
  }
  function recheck(){ FATAL = checkTheme() || checkEntities(); return FATAL; }

  (async function start(){
    try { await loadEntityMap(); } catch(e){ FATAL = e.message; showMsg(FATAL); return; }
    syncTheme();
    buildControls();
    initRange();
    if (!recheck()) renderStats();
    render();
    setInterval(() => { const was = FATAL; recheck(); if (FATAL) { showMsg(FATAL); return; } syncTheme(); renderStats(); if (was) render(); }, 5000);
    setInterval(render, 60000);
  })();
</script>
</body>
