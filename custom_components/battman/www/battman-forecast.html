<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battman forecast</title>
<!--
  Battman forecast page: the Chill card tap popup. Shows what script.battman_engine_forecast says Battman would
  do over the next hours: the real engine decision, slot by slot. It only READS: it calls that one script (which
  changes nothing) and draws the answer. What-if changes are held in this page only and are never saved.
-->
<style>
/* the dashboard theme's colours (copied from the parent page at start, so this page follows the active theme);
   these are the Battman Abyss values, used until then */
:root{--battman-green:#90e0c8;--battman-yellow:#fdfcdc;--battman-orange:#f4a261;--battman-blue:#2c7da0;--battman-purple:#006d77;
--battman-red:#e76f51;--battman-darkred:#c1121f;--battman-text-bright:#eaf6fa;--battman-text-muted:#7fa8b8;
--battman-surface-popup:#050d12;--battman-surface-card:#081218;--primary-text-color:#eaf6fa;--wi:#6fb7e9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--battman-surface-card)}
body{color:var(--primary-text-color);font-family:var(--primary-font-family,var(--battman-font,system-ui,-apple-system,sans-serif));font-size:15px;line-height:1.4;padding:8px}
.pop{max-width:620px;margin:0 auto;padding:10px 12px;border-radius:8px;background:var(--battman-surface-popup)}
/* the header pill (as the Chill card's popup) */
.pill{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--st,var(--battman-green)) 16%,transparent);border:1px solid color-mix(in srgb,var(--st,var(--battman-green)) 45%,transparent)}
.pill #title{font-size:17px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--st,var(--battman-green))}
.pill .asof{font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--battman-text-muted)}
.cap{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:6px 2px 0;font-size:12px;color:var(--battman-text-muted)}
.day{margin:10px 2px 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--battman-text-muted)}
.banner{display:none;margin:8px 0 0;padding:8px 10px;border:1px dashed var(--wi);border-radius:8px;background:color-mix(in srgb,var(--wi) 12%,transparent);color:var(--wi);font-size:13px;font-weight:700}
body.wi .banner{display:block}
.spin{display:none;color:var(--battman-text-muted)}body.busy .spin{display:inline}
/* the event rows: the Chill card's own look */
.row{display:flex;gap:10px;padding:9px 10px;margin-top:6px;border-radius:8px;
  background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.row.act{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.row .bar{width:4px;border-radius:2px;background:var(--c);flex-shrink:0}
.row .body{flex:1;min-width:0}
.row .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .time{font-size:17px;font-weight:800;color:var(--primary-text-color);font-variant-numeric:tabular-nums}
.row.act .time{color:var(--c)}
.row .amt{font-size:18px;font-weight:900}
.row .r2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;font-weight:700;line-height:1.3;margin-top:1px}
.row .r3{font-size:15px;opacity:.85;line-height:1.35;margin-top:2px}
.row .hint{font-weight:700;opacity:1}
.row .r4{font-size:12px;color:var(--battman-text-muted);margin-top:3px}
.chip{display:inline-block;font-size:11px;font-weight:800;line-height:1;letter-spacing:.03em;padding:3px 8px;margin-right:6px;border-radius:999px;vertical-align:2px;
  border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c)}
/* a master row you can open: a faint stack under it, and a small "n parts" with an arrow that turns */
details.grp{margin-top:6px;border-radius:8px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);
  box-shadow:0 5px 0 -3px color-mix(in srgb,var(--c) 26%,transparent),0 9px 0 -6px color-mix(in srgb,var(--c) 13%,transparent);margin-bottom:10px}
details.grp.act{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
details.grp[open]{box-shadow:none;margin-bottom:6px}
details.grp>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .row{margin:0;background:none;border:0}
.exp{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:600;color:var(--battman-text-muted);white-space:nowrap}
.exp i{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.grp[open] .exp i{transform:rotate(45deg)}
.parts{padding:0 8px 8px}
.parts .row{margin-top:6px}
/* theme effects: the Hooover / House Party rows use the same --fx-<name>-* variables as the mode buttons and the
   Chill card's pill; a theme that does not define them gives a plain row */
@keyframes fx-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fx-glow-mono{0%,100%{box-shadow:0 0 5px 0 var(--fx-glow-color,transparent)}50%{box-shadow:0 0 18px 4px var(--fx-glow-color,transparent)}}
@keyframes fx-glow-rainbow{
 0%{box-shadow:0 0 16px 4px var(--battman-red)}16%{box-shadow:0 0 16px 4px var(--battman-orange)}
 33%{box-shadow:0 0 16px 4px var(--battman-yellow)}50%{box-shadow:0 0 16px 4px var(--battman-green)}
 66%{box-shadow:0 0 16px 4px var(--battman-blue)}83%{box-shadow:0 0 16px 4px var(--battman-purple)}
 100%{box-shadow:0 0 16px 4px var(--battman-red)}}
.row.fxr{position:relative;overflow:hidden}
.row.fxr::before{content:'';position:absolute;z-index:0;top:50%;left:50%;width:900px;height:900px;transform:translate(-50%,-50%);
  background:var(--fx-chase-gradient,none);animation:fx-spin var(--fx-chase-duration,0s) linear infinite;display:var(--fx-ring,none)}
.row.fxr::after{content:'';position:absolute;z-index:1;inset:var(--fx-ring-width,2px);border-radius:6px;display:var(--fx-ring,none);
  background:linear-gradient(color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 16%,transparent)),var(--battman-surface-popup)}
.row.fxr>*{position:relative;z-index:2}
details.grp.plain{background:none;border:0}
details.grp>summary .row.fxr{background:color-mix(in srgb,var(--c) 16%,transparent)}
@media (prefers-reduced-motion:reduce){.row.fxr,.row.fxr::before{animation:none!important}}
/* total */
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px;margin-top:8px;border-radius:8px;
  background:color-mix(in srgb,var(--tc) 16%,transparent);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.total span{font-size:15px;font-weight:700}.total b{font-size:22px;font-weight:900;color:var(--tc)}
.delta{margin-top:6px;padding:8px 10px;border-radius:8px;border:1px dashed var(--wi);color:var(--wi);font-size:13px}
.msg{padding:14px 4px;color:var(--battman-text-muted);font-size:13px}.msg.bad{color:var(--battman-red)}
/* the what-if panel and the accuracy panel */
details.panel{margin-top:8px;border-radius:8px;border:1px solid color-mix(in srgb,var(--battman-text-bright) 14%,transparent);background:var(--battman-surface-card)}
details.panel>summary{padding:11px 12px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--battman-text-muted);cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel[open]>summary{border-bottom:1px solid color-mix(in srgb,var(--battman-text-bright) 14%,transparent)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid color-mix(in srgb,var(--battman-text-bright) 10%,transparent);min-height:56px;flex-wrap:wrap}
.ctl:last-child{border-bottom:none}
.ctl .l{font-size:14px}.ctl .l small{display:block;color:var(--battman-text-muted);font-size:11px}
.step{display:flex;align-items:center;gap:6px}
.step output{min-width:64px;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.step output.chg{color:var(--wi);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--battman-text-bright) 18%,transparent);background:var(--battman-surface-popup);color:var(--primary-text-color);font-size:15px;font-family:inherit;cursor:pointer}
.btn:active{background:color-mix(in srgb,var(--battman-green) 14%,transparent)}
.btn.on{border-color:var(--battman-green);background:color-mix(in srgb,var(--battman-green) 14%,transparent);color:var(--battman-green)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
ul.acc{padding:8px 14px 12px 30px;color:var(--battman-text-muted);font-size:12px;line-height:1.5}
.wi .tilde::before{content:"~"}
</style></head><body>
<div class="pop">
  <div class="pill" id="pill"><span id="title">Next hours</span><span class="asof"><span class="spin">working… </span><span id="gen"></span></span></div>
  <div class="banner" id="banner">WHAT-IF · not live · nothing is sent to the battery</div>

  <div id="out"><div class="msg">Loading…</div></div>

  <details class="panel" id="wip"><summary>What-if</summary>
    <div class="ctl"><div class="l">Battery level<small id="soc_l"></small></div>
      <div class="step"><button class="btn small" data-k="soc" data-d="-5">−5</button><output id="o_soc"></output><button class="btn small" data-k="soc" data-d="5">+5</button></div></div>
    <div class="ctl"><div class="l">Solar</div>
      <div class="chips" id="solar"><button class="btn small" data-v="0">0%</button><button class="btn small" data-v="0.5">50%</button><button class="btn small" data-v="1">100%</button><button class="btn small" data-v="1.25">125%</button></div></div>
    <div class="ctl"><div class="l">House load<small id="load_l"></small></div>
      <div class="step"><button class="btn small" data-k="load" data-d="-0.5">−</button><output id="o_load"></output><button class="btn small" data-k="load" data-d="0.5">+</button></div></div>
    <div class="ctl"><div class="l">Buy price shift<small>added to every slot</small></div>
      <div class="step"><button class="btn small" data-k="sb" data-d="-1">−1c</button><output id="o_sb"></output><button class="btn small" data-k="sb" data-d="1">+1c</button></div></div>
    <div class="ctl"><div class="l">Sell price shift<small>added to every slot</small></div>
      <div class="step"><button class="btn small" data-k="ss" data-d="-1">−1c</button><output id="o_ss"></output><button class="btn small" data-k="ss" data-d="1">+1c</button></div></div>
    <div id="ovs"></div>
    <div class="ctl"><button class="btn" id="reset">Reset to live</button><span style="font-size:12px;color:var(--muted)">changes live here only</span></div>
  </details>

  <details class="panel"><summary>How accurate is this?</summary><ul class="acc" id="acc"></ul></details>
</div>
<script>
// <pure>
// ---- turning the forecast's slots into the rows shown (no page access in this block) ----
const c1 = x => (x * 100);
const d1 = x => { const r = Math.round(c1(x) * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
const hhmm = iso => String(iso).slice(11, 16);
const money = x => (x < 0 ? '−$' : '+$') + Math.abs(x).toFixed(2);
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

function addMinutes(iso, mins) {
  // 'YYYY-MM-DDTHH:MM:SS+10:30' + minutes, as HH:MM (same offset, so only the clock part moves)
  const h = +iso.slice(11, 13), m = +iso.slice(14, 16);
  const t = (h * 60 + m + Math.round(mins)) % 1440;
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}

function kind(s) {
  // what the slot is, in the words the card uses
  const m = s.mode;
  if (m === 'Charge Solar Off') return 'hooover';
  if (m === 'Float Solar Off') return 'party';
  if (m === 'Charge') return 'buy';
  if (m === 'Discharge') return 'sell';
  if (m === 'Drain') return 'drain';
  if (m === 'Float') return 'float';
  return 'idle';
}

// v1's two "what would make Battman act" keys for a quiet slot:
//   bpk: the buy line (in whole cents), or 'P' when it is below the line but it is peak (no buying 5-9pm); null when the battery is not below the line
//   spk: the sell line (whole cents) when the battery is above the sell line, null otherwise
function bpk(s) {
  if (kind(s) !== 'idle' || !(s.soc_start < s.buy_below)) return null;
  return s.buy_reason === 'No Buy in Peak Tariff' ? 'P' : Math.round(c1(s.buy_line));
}
function spk(s) {
  return kind(s) === 'idle' && s.sell_price_known && s.soc_start > s.sell_above + 1 ? Math.round(c1(s.sell_line)) : null;
}
// two keys are "the same" when both are absent, both present and equal, or both numbers within 2c (v1's rule)
const near = (x, y) => (x === null) === (y === null) && (x === null || x === y || (typeof x === 'number' && typeof y === 'number' && Math.abs(x - y) < 2));
// the sell / buy "kind of reason" (v1 only split where this changed)
const sellCat = s => /^Solar/.test(s.sell_reason) ? 'solar' : (/Drain/.test(s.sell_reason) ? 'drain' : 'sell');
const buyCat = s => s.buy_reason === 'Anytime' ? 'anytime' : 'buy';

function group(slots) {
  // MASTERS: runs of the same kind of slot
  const S = slots.map((s, i) => Object.assign({}, s, { _end: i + 1 < slots.length ? hhmm(slots[i + 1].start) : addMinutes(s.start, s.minutes) }));
  const out = [];
  S.forEach(s => {
    const k = kind(s), last = out[out.length - 1];
    if (last && last.kind === k) last.slots.push(s); else out.push({ kind: k, slots: [s] });
  });
  out.forEach(m => { m.start = m.slots[0].live ? 'Now' : hhmm(m.slots[0].start); m.end = m.slots[m.slots.length - 1]._end; });
  return out;
}

function split(m) {
  // PARTS: v1's splitting of a master
  const parts = [];
  m.slots.forEach(s => {
    const p = parts[parts.length - 1];
    let same = false;
    if (p) {
      const f = p.slots[0];
      if (m.kind === 'idle') same = near(spk(s), p.spk) && near(bpk(s), p.bpk);
      else if (m.kind === 'buy' || m.kind === 'hooover') same = (s.buy_price < 0) === (f.buy_price < 0) && buyCat(s) === buyCat(f);
      else if (m.kind === 'sell' || m.kind === 'drain') same = sellCat(s) === sellCat(f);
      else same = true;
      // whatever the mode: a price move of 2c or more starts a new part (sell kinds follow the sell price, the rest the buy price)
      if (same && m.kind !== 'idle') {
        const px = x => c1(m.kind === 'sell' || m.kind === 'drain' ? x.sell_price : x.buy_price);
        if (Number.isFinite(px(s)) && Number.isFinite(px(f)) && Math.abs(px(s) - px(f)) >= 2) same = false;
      }
    }
    if (same) p.slots.push(s); else parts.push({ kind: m.kind, slots: [s], spk: spk(s), bpk: bpk(s) });
  });
  parts.forEach(p => { p.start = p.slots[0].live ? 'Now' : hhmm(p.slots[0].start); p.end = p.slots[p.slots.length - 1]._end; });
  return parts;
}

const rng = (vals) => { const lo = Math.min(...vals), hi = Math.max(...vals); return d1(lo) === d1(hi) ? d1(lo) : d1(lo) + '–' + d1(hi); };
const tag = (a, ruled, over) => a.some(s => s[ruled]) ? ' (' + (ruled === 'buy_ruled' ? 'buy' : 'sell') + ' rule)' : (a.some(s => s[over]) ? ' (override)' : '');

// "House 1.2 kW · solar 3.4 kW" for the slots of a row (a range when they differ)
function loadLine(a) {
  const range = v => { const lo = Math.min(...v), hi = Math.max(...v); return lo.toFixed(1) === hi.toFixed(1) ? lo.toFixed(1) : lo.toFixed(1) + '–' + hi.toFixed(1); };
  const L = a.map(s => s.load_kw).filter(Number.isFinite), P = a.map(s => s.pv_kw).filter(Number.isFinite);
  if (!L.length) return '';
  const kwh = f => { const v = sum(a, s => (Number.isFinite(s[f]) ? s[f] : 0) * s.minutes / 60); return v >= 10 ? v.toFixed(0) : v.toFixed(1); };
  const off = a.every(s => s.solar_off);   // the mode has the solar switched off: the figure is what is available, not what is used
  return `House ${range(L)} kW (${kwh('load_kw')} kWh)` + (P.length && Math.max(...P) > 0.05
    ? (off ? ` · solar switched off, ${range(P)} kW (${kwh('pv_kw')} kWh) available` : ` · solar ${range(P)} kW (${kwh('pv_kw')} kWh)`) : '');
}
// the orange line for solar that is sent to the grid (or held back because the price is negative)
function exportHint(a) {
  const kwh = sum(a, s => s.export_kwh);
  if (kwh >= 0.05) return ['var(--battman-orange)', `Exporting excess solar, ${kwh.toFixed(1)} kWh at ${d1(sum(a, s => s.export_kwh * s.sell_price) / kwh)}c`];
  if (a.some(s => s.curtail && s.pv_kw > 0.05)) return ['var(--battman-orange)', 'Solar curtailed: the export price is negative'];
  return null;
}

function describe(p) {
  // the words for a part or a whole master: { head, sub, hints:[[colour, text]], money, colour, ... }
  const a = p.slots, f = a[0], l = a[a.length - 1];
  const money$ = sum(a, x => x.money), batt = sum(a, x => x.battery_kwh);
  const avgBuy = sum(a, x => x.buy_price) / a.length, avgSell = sum(a, x => x.sell_price) / a.length;
  const soc = `battery ${Math.round(f.soc_start)}% → ${Math.round(l.soc_end)}%`;
  const kwhSold = sum(a, x => x.export_kwh).toFixed(1), kwhBought = sum(a, x => x.import_kwh).toFixed(1);
  const houseKwh = sum(a, x => (x.load_kw || 0) * x.minutes / 60);
  const kwh = Math.abs(batt).toFixed(1);   // the whole battery change (the house included): used for Drain only
  // a quiet row's colour (as the Chill card): orange when the grid is used, green when solar fills the battery, blue otherwise
  const holdCol = money$ < -0.005 ? 'var(--battman-orange)' : (l.soc_end > f.soc_start + 0.05 ? 'var(--battman-green)' : 'var(--battman-blue)');
  const o = { money: money$, color: holdCol, bg: '', chip: '', hints: [], act: p.kind !== 'idle', fx: p.kind === 'hooover' ? 'hooover' : (p.kind === 'party' ? 'houseparty' : '') };
  switch (p.kind) {
    case 'sell':
      Object.assign(o, { color: 'var(--battman-green)', head: `Sell ${kwhSold} kWh, ${soc}`,
        sub: /^Spike/.test(f.sell_reason) ? `Price spike: Amber pays ${d1(avgSell)}c (${f.sell_reason}).`
          : `Amber pays ${d1(avgSell)}c. BATTMAN sells at ${d1(f.sell_line)}c or more (${f.sell_reason}).` }); break;
    case 'buy':
      Object.assign(o, { color: 'var(--battman-yellow)', head: `Buy ${kwhBought} kWh, ${soc}`,
        sub: `${avgBuy < 0 ? 'Amber pays you ' + d1(-avgBuy) + 'c' : 'Amber charges ' + d1(avgBuy) + 'c'}. BATTMAN buys at ${d1(f.buy_line)}c or less (${f.buy_reason}).` }); break;
    case 'hooover':
      Object.assign(o, { color: 'var(--battman-purple)', chip: 'Hoooover', head: `Buy ${kwhBought} kWh, ${soc}`,
        sub: `Amber pays you ${d1(-avgBuy)}c to use power: charging to 100%, ignoring the curve.` }); break;
    case 'party':
      Object.assign(o, { color: 'var(--battman-purple)', chip: 'House Party', head: `Run the house off the grid, battery holds at ${Math.round(l.soc_end)}%`,
        sub: `Amber pays you ${d1(-avgBuy)}c to use power: holding the battery, no grid charge.` }); break;
    case 'drain':
      Object.assign(o, { color: 'var(--battman-red)', head: `Drain ${kwh} kWh, ${soc}`,
        sub: `Grid price is under the drain price (${f.sell_reason}); this moves charge, not dollars.` }); break;
    case 'float':
      Object.assign(o, { color: 'var(--battman-green)', head: `Hold the battery at ${Math.round(l.soc_end)}%`,
        sub: `Solar goes to the house and grid (${f.sell_reason}).` }); break;
    default: {
      o.head = `Do nothing, ${soc}`;
      // the Chill card's words for a quiet stretch
      o.sub = money$ < -0.005 ? 'Battery runs low, house uses the grid.' : (l.soc_end > f.soc_start ? 'Solar fills the battery.' : 'House runs off the battery.');
    }
  }
  if (p.kind === 'idle') {
    // v1's two hints under a quiet row
    if (p.bpk === 'P') o.hints.push(['var(--battman-yellow)', 'Below the buy line, but no buying in peak (5–9pm)']);
    else if (p.bpk !== null && p.bpk !== undefined) o.hints.push(['var(--battman-yellow)', `Buys if Amber charges ${d1(Math.max(...a.map(s => s.buy_line)))}c or less${tag(a, 'buy_ruled', 'buy_override')}`]);
    const sp = a.filter(s => spk(s) !== null);
    if (sp.length) o.hints.push(['var(--battman-orange)', `Sells if Amber pays ${d1(Math.min(...sp.map(s => s.sell_line)))}c or more${tag(sp, 'sell_ruled', 'sell_override')}`]);
  }
  o.load = loadLine(a);
  if (p.kind === 'sell' && houseKwh >= 0.05) o.load += ` · battery covers ${houseKwh.toFixed(1)} kWh of the house`;
  if (p.kind === 'idle' || p.kind === 'float') { const ex = exportHint(a); if (ex) o.hints.push(ex); }
  return o;
}

function summaryHints(parts) {
  // the master's one-line summary: the range of each hint across its parts
  const hints = [];
  const buys = parts.filter(p => p.bpk !== null && p.bpk !== 'P').map(p => Math.max(...p.slots.map(s => s.buy_line)));
  const sells = parts.filter(p => p.spk !== null).map(p => Math.min(...p.slots.filter(s => spk(s) !== null).map(s => s.sell_line)));
  if (parts.some(p => p.bpk === 'P')) hints.push(['var(--battman-yellow)', 'No buying in peak (5–9pm)']);
  if (buys.length) hints.push(['var(--battman-yellow)', `Buys if Amber charges ${rng(buys)}c or less`]);
  if (sells.length) hints.push(['var(--battman-orange)', `Sells if Amber pays ${rng(sells)}c or more`]);
  return hints;
}
// </pure>

// ---- the page ----
let H = null; try { H = parent.document.querySelector('home-assistant').hass; } catch (e) {}
// follow the dashboard's theme. A view can carry its own theme (this one does), and HA puts that theme's variables on the view,
// not on the page root, so read them from where this page sits (its iframe element inherits them) and fall back to the root.
try {
  const me = document.documentElement;
  const names = ['--battman-green', '--battman-yellow', '--battman-orange', '--battman-amber', '--battman-blue', '--battman-purple', '--battman-red', '--battman-darkred',
    '--battman-text-bright', '--battman-text-muted', '--battman-surface-popup', '--battman-surface-card', '--primary-text-color', '--primary-font-family', '--battman-font'];
  for (const ns of ['hooover', 'houseparty'])
    for (const k of ['chase-display', 'chase-gradient', 'chase-duration', 'ring-width', 'border', 'glow-name', 'glow-color', 'glow-duration']) names.push(`--fx-${ns}-${k}`);
  // in the Chill card's popup the dialog sits outside the themed view: find the themed view on the dashboard behind it
  const findView = () => {
    const stack = [parent.document.querySelector('home-assistant')]; let n = 0;
    while (stack.length && n++ < 30000) {
      const el = stack.pop(); if (!el || el.nodeType !== 1) continue;
      if (/VIEW/.test(el.tagName) && parent.getComputedStyle(el).getPropertyValue('--battman-green').trim()) return el;
      if (el.shadowRoot) stack.push(...el.shadowRoot.children);
      stack.push(...el.children);
    }
    return null;
  };
  const here = window.frameElement && parent.getComputedStyle(window.frameElement).getPropertyValue('--battman-green').trim() ? window.frameElement : (findView() || window.frameElement);
  const from = [here, parent.document.documentElement].filter(Boolean);
  for (const el of from) {
    const cs = parent.getComputedStyle(el);
    names.forEach(n => { const v = cs.getPropertyValue(n).trim(); if (v && !me.style.getPropertyValue(n)) me.style.setProperty(n, v); });
  }
} catch (e) {}
const $ = id => document.getElementById(id);
const hass = () => { try { return parent.document.querySelector('home-assistant').hass; } catch (e) { return H; } };
const st = id => { const h = hass(); return h && h.states[id]; };

const OVERRIDES = [
  ['sellOverride', 'Sell override', 'Sell above this price, down to this battery level'],
  ['buyOverride', 'Buy override', 'Buy below this price, up to this battery level (negative price = paid to charge)'],
  ['buyAnytime', 'Buy anytime', 'Buy below this price, up to this battery level'],
  ['sellSolar', 'Sell solar', 'Sell when above this battery level'],
  ['drainBattery', 'Drain battery', 'Drain when the grid price is under this, down to this level'],
];
const live = { soc: 0, load: 1, params: {} };
const patch = { soc: null, solar: 1, load: null, sb: 0, ss: 0, ov: {} };   // what-if changes; null / 0 / 1 = as live
let base = null, busy = false, again = false, timer = null;

const num = (v, d = 0) => { const x = parseFloat(v); return Number.isFinite(x) ? x : d; };
const dirty = () => patch.soc !== null || patch.solar !== 1 || patch.load !== null || patch.sb || patch.ss || Object.keys(patch.ov).length;

function readLive() {
  const s = st('sensor.sigen_plant_battery_state_of_charge'), l = st('sensor.battman_load_30m_avg'), p = st('sensor.battman_parameters');
  live.soc = num(s && s.state); live.load = l && Number.isFinite(parseFloat(l.state)) ? parseFloat(l.state) : null;
  live.params = (p && p.attributes) || {};
}

// Yesterday's house load by hour (kW), from Home Assistant's own statistics. null when it can't be read:
// the forecast then uses the 30-minute average for every slot.
let profile = null, profileNote = '', profileTried = false;
async function readProfile() {
  profileTried = true;
  try {
    const h = hass(), tz = (h.config && h.config.time_zone) || undefined;
    const day = d => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    const hour = d => +new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', hourCycle: 'h23' }).format(d);
    const now = new Date(), yesterday = day(new Date(now.getTime() - 24 * 3600 * 1000));
    const id = 'sensor.sigen_plant_consumed_power';
    const r = await h.callWS({ type: 'recorder/statistics_during_period', start_time: new Date(now.getTime() - 54 * 3600 * 1000).toISOString(),
      end_time: now.toISOString(), statistic_ids: [id], period: 'hour', types: ['mean'] });
    const by = Array(24).fill(null);
    (r[id] || []).forEach(x => { const d = new Date(x.start); if (day(d) === yesterday && Number.isFinite(x.mean)) by[hour(d)] = x.mean; });
    const known = by.filter(v => v !== null);
    if (known.length < 12) { profileNote = 'Yesterday\'s hourly load was not available, so the 30-minute average is used.'; return null; }
    const avg = known.reduce((t, v) => t + v, 0) / known.length;
    const fill = by.map((v, i) => {                      // a missing hour takes its neighbours' average
      if (v !== null) return v;
      const a = by[(i + 23) % 24], b = by[(i + 1) % 24];
      return a !== null && b !== null ? (a + b) / 2 : (a !== null ? a : (b !== null ? b : avg));
    });
    profileNote = '';
    return fill.map(v => Math.round(v * 100) / 100);
  } catch (e) { profileNote = 'Yesterday\'s hourly load could not be read, so the 30-minute average is used.'; return null; }
}

function request() {
  const settings = {};
  for (const [pre] of OVERRIDES) for (const f of ['Price', 'SOC']) {
    const k = pre + f; if (patch.ov[k] !== undefined) settings[k] = patch.ov[k];
  }
  const what_if = {};
  if (patch.soc !== null) what_if.soc = patch.soc;
  if (Object.keys(settings).length) what_if.settings = settings;
  const data = { what_if, solar_scale: patch.solar, price_shift: { buy: patch.sb / 100, sell: patch.ss / 100 } };
  if (patch.load !== null) data.load_kw = patch.load;
  if (profile) data.load_profile = profile;
  return data;
}

async function call(data) {
  const r = await hass().callWS({ type: 'call_service', domain: 'script', service: 'battman_engine_forecast', service_data: data, return_response: true });
  const a = r && (r.response || r);
  if (!a || !a.slots) throw new Error('no forecast came back');
  return a;
}

function controls() {
  readLive();
  const v = (k, dflt) => patch[k] === null ? dflt : patch[k];
  const socNow = v('soc', live.soc), loadNow = patch.load === null ? live.load : patch.load;
  const set = (id, txt, chg) => { const o = $(id); o.textContent = txt; o.classList.toggle('chg', !!chg); };
  set('o_soc', Math.round(socNow) + '%', patch.soc !== null);
  $('soc_l').textContent = patch.soc !== null ? 'live is ' + Math.round(live.soc) + '%' : '';
  set('o_load', loadNow === null ? '1.0 kW*' : loadNow.toFixed(1) + ' kW', patch.load !== null);
  $('load_l').textContent = patch.load !== null ? (live.load !== null ? 'live is ' + live.load.toFixed(1) + ' kW; fixed for every slot' : 'fixed for every slot')
    : (profile ? 'now is the live average; later hours follow yesterday' : '30-minute average for every slot');
  set('o_sb', (patch.sb > 0 ? '+' : '') + patch.sb + 'c', patch.sb);
  set('o_ss', (patch.ss > 0 ? '+' : '') + patch.ss + 'c', patch.ss);
  document.querySelectorAll('#solar button').forEach(b => b.classList.toggle('on', +b.dataset.v === patch.solar));
  // the overrides
  const box = $('ovs'); if (!box.dataset.built) {
    box.dataset.built = 1;
    box.innerHTML = OVERRIDES.map(([pre, name, hint]) => `<div class="ctl"><div class="l">${name}<small>${hint}</small></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <div class="step"><button class="btn small" data-ov="${pre}Price" data-d="-1">−</button><output id="ov_${pre}Price"></output><button class="btn small" data-ov="${pre}Price" data-d="1">+</button></div>
        <div class="step"><button class="btn small" data-ov="${pre}SOC" data-d="-5">−</button><output id="ov_${pre}SOC"></output><button class="btn small" data-ov="${pre}SOC" data-d="5">+</button></div></div></div>`).join('');
  }
  for (const [pre] of OVERRIDES) {
    for (const [f, unit] of [['Price', 'c'], ['SOC', '%']]) {
      const k = pre + f, lv = num(live.params[k]), cur = patch.ov[k] !== undefined ? patch.ov[k] : lv;
      set('ov_' + k, (cur === 0 ? 'off' : cur + unit), patch.ov[k] !== undefined);
    }
  }
  document.body.classList.toggle('wi', !!dirty());
}

// one row, built as the Chill card builds its rows
function rowInner(d, from, to, extra) {
  const amt = Math.abs(d.money) >= 0.005 ? `<span class="amt" style="color:${d.money > 0 ? 'var(--battman-green)' : 'var(--battman-yellow)'}"><span class="tilde"></span>${money(d.money)}</span>` : '';
  return `<div class="bar"></div><div class="body">
    <div class="r1"><span class="time">${from} – ${to}</span>${amt}</div>
    <div class="r2"><span>${d.chip ? `<span class="chip">${d.chip}</span>` : ''}<span class="tilde"></span>${d.head}</span>${extra || ''}</div>
    <div class="r3">${d.sub}${d.hints.map(h => `<br><span class="hint" style="color:${h[0]}">${h[1]}</span>`).join('')}</div>
    ${d.load ? `<div class="r4">${d.load}</div>` : ''}</div>`;
}
// the theme's effect variables for a row (the same mapping the Chill card's pill uses); all "off" when the theme defines none
const fxStyle = d => !d.fx ? '' : `--fx-ring:var(--fx-${d.fx}-chase-display,none);--fx-chase-gradient:var(--fx-${d.fx}-chase-gradient,none);--fx-chase-duration:var(--fx-${d.fx}-chase-duration,0s);` +
  `--fx-ring-width:var(--fx-${d.fx}-ring-width,2px);--fx-glow-color:var(--fx-${d.fx}-glow-color,transparent);` +
  `animation:var(--fx-${d.fx}-glow-name,none) var(--fx-${d.fx}-glow-duration,0s) ease-in-out infinite;border:var(--fx-${d.fx}-border,1px solid color-mix(in srgb,${d.color} 40%,transparent));`;
const rowHtml = (d, from, to, noFx) => `<div class="row ${d.act ? 'act' : ''} ${d.fx && !noFx ? 'fxr' : ''}" style="--c:${d.color};${noFx ? '' : fxStyle(d)}">${rowInner(d, from, to)}</div>`;

function masterHtml(m) {
  const parts = split(m);
  if (parts.length === 1) return rowHtml(describe(parts[0]), m.start, m.end);      // nothing to expand
  const d = describe(m);                                                           // the whole run, summed
  const ex = (m.kind === 'idle' || m.kind === 'float') ? exportHint(m.slots) : null;
  d.hints = (m.kind === 'idle' ? summaryHints(parts) : []).concat(ex ? [ex] : []);
  const exp = `<span class="exp">${parts.length} parts<i></i></span>`;
  const fx = !!d.fx;                       // a Hooover / House Party run: the effect goes on its top row, the parts stay plain
  return `<details class="grp ${d.act ? 'act' : ''} ${fx ? 'plain' : ''}" style="--c:${d.color}"><summary><div class="row ${fx ? 'act fxr' : ''}" style="--c:${d.color};${fxStyle(d)}">${rowInner(d, m.start, m.end, exp)}</div></summary>
    <div class="parts">${parts.map(p => rowHtml(describe(p), p.start, p.end, true)).join('')}</div></details>`;
}

// the Chill card's status: Chill / No Sun / High Use
function statusNow() {
  const r = st('sensor.battman_run'), at = (r && r.attributes) || {}, yes = v => String(v).toLowerCase() === 'true';
  if (yes(at.needSun)) return ['No Sun · Panic', 'var(--battman-orange)'];
  if (yes(at.needPower)) return ['High Use · Panic', 'var(--battman-darkred)'];
  return ['Chill', 'var(--battman-green)'];
}

function draw(a, b) {
  const masters = group(a.slots);
  const first = a.slots[0];
  const day0 = String(first.start).slice(0, 10);
  const shown = masters.map((m, i) => {
    const d = String(m.slots[0].start).slice(0, 10), prev = i ? String(masters[i - 1].slots[0].start).slice(0, 10) : day0;
    return (d !== day0 && d !== prev ? `<div class="day">Tomorrow</div>` : '') + masterHtml(m);
  }).join('');
  const t = a.total, delta = b ? t.money - b.total.money : 0, tc = t.money >= 0 ? 'var(--battman-green)' : 'var(--battman-yellow)';
  const h = Math.round(sum(a.slots, x => x.minutes) / 60);
  $('out').innerHTML = `${shown}
    <div class="total" style="--tc:${tc}"><span>Total, next ${h} hours · ends ${Math.round(t.soc_end)}%</span><b><span class="tilde"></span>${money(t.money)}</b></div>
    <div class="delta" style="${dirty() && b ? '' : 'display:none'}">What-if ${money(t.money)} · live ${b ? money(b.total.money) : ''} · difference ${money(delta)}<br>
      Battery at the end: ${Math.round(t.soc_end)}% (live ${b ? Math.round(b.total.soc_end) : ''}%)</div>`;
  $('pill').style.setProperty('--st', statusNow()[1]);
  $('title').textContent = `Next ${h} hours`;
  $('gen').textContent = 'as of ' + hhmm(a.generated);
  $('acc').innerHTML = a.assumptions.map(x => `<li>${x}</li>`).join('') + (profileNote ? `<li>${profileNote}</li>` : '') + (a.failed_slots ? `<li>${a.failed_slots} slot(s) could not be worked out.</li>` : '');
}

async function refresh() {
  if (busy) { again = true; return; }
  busy = true; document.body.classList.add('busy');
  try {
    if (profile === null && !profileTried) profile = await readProfile();
    controls();
    if (!base) base = await call(profile ? { load_profile: profile } : {});   // the live picture, once
    const a = dirty() ? await call(request()) : base;
    draw(a, base);
  } catch (e) {
    $('out').innerHTML = '<div class="msg bad">Could not get the forecast: ' + (e && e.message || e) + '</div>';
  }
  busy = false; document.body.classList.remove('busy');
  if (again) { again = false; refresh(); }
}
const later = () => { controls(); clearTimeout(timer); timer = setTimeout(refresh, 500); };

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'reset') { patch.soc = null; patch.solar = 1; patch.load = null; patch.sb = 0; patch.ss = 0; patch.ov = {}; base = null; return later(); }
  if (b.dataset.k) {
    const d = +b.dataset.d, k = b.dataset.k;
    if (k === 'soc') patch.soc = Math.max(0, Math.min(100, (patch.soc === null ? live.soc : patch.soc) + d));
    if (k === 'load') patch.load = Math.max(0, +((patch.load === null ? (live.load === null ? 1 : live.load) : patch.load) + d).toFixed(1));
    if (k === 'sb') patch.sb += d;
    if (k === 'ss') patch.ss += d;
    return later();
  }
  if (b.dataset.ov) {
    const k = b.dataset.ov, lv = num(live.params[k]), cur = patch.ov[k] !== undefined ? patch.ov[k] : lv;
    const neg = k === 'buyOverridePrice';          // the buy override may be negative
    const next = cur + (+b.dataset.d);
    patch.ov[k] = neg ? next : Math.max(0, next);
    if (patch.ov[k] === lv) delete patch.ov[k];
    return later();
  }
  if (b.parentElement && b.parentElement.id === 'solar') { patch.solar = +b.dataset.v; return later(); }
});
if (!H) $('out').innerHTML = '<div class="msg bad">This page needs to be shown inside the dashboard so it can reach Home Assistant.</div>';
else refresh();
</script>
</body></html>
