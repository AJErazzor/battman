# Battman engine.
# Managed by Battman: written into your config and replaced on every Battman update.
# Don't edit this copy. [[map:...]] markers are filled from Battman's entity map.
#
# The Battman engine: three plain steps, run whenever the price estimate or your settings change.
#   1. READ    script.battman_engine_inputs reads the sensors once into one bundle,
#   2. DECIDE  script.battman_engine_decide works out the battery mode from that bundle alone,
#   3. ACT     this script applies the decision: the log, the battery mode, the no-export switch,
#              and the battman_run_update event the cards, the run sensor and the watchdog follow.
# Step 3 is the only part that touches the inverter side. The same decide script also answers
# script.battman_engine_forecast, which asks it about every future slot.
#
# If the read or decide step fails there is no decision: a line goes to the logbook and the run
# stops. The watchdog forces Self Consume when the engine hasn't run for its limit.

blueprint:
  name: Battman engine
  description: 'The Battman engine: works out the battery mode, curtailment and limits, logs the run.'
  domain: script
  source_url: https://github.com/AJErazzor/battman
  input: {}
icon: mdi:battery-sync
mode: single
sequence:
- delay: 00:00:02
  alias: Let the sensors settle
- action: script.battman_engine_inputs
  response_variable: bundle
  continue_on_error: true
  alias: 1. READ the sensors
- if: '{{ bundle is defined and bundle is mapping }}'
  then:
  - action: script.battman_engine_decide
    data:
      params: '{{ bundle }}'
    response_variable: decision
    continue_on_error: true
    alias: 2. DECIDE
- if: '{{ decision is not defined or decision is none or decision is not mapping or not decision.mode is defined or decision.mode in [none, '''', ''unknown''] }}'
  then:
  - action: logbook.log
    data:
      name: Battman
      message: The engine could not decide (no reading or no decision), so it did not run
  - stop: The engine could not decide
    error: true
- event: battman_engine_log
  event_data:
    message: '{{ decision.log }}'
  alias: 3a. ACT - the log
- action: input_select.select_option
  target:
    entity_id: input_select.battman_mode
  data:
    option: '{{ decision.mode }}'
  alias: 3b. ACT - the battery mode
- if: '{{ decision.curtail }}'
  then:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.battman_no_export
  else:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.battman_no_export
  alias: 3c. ACT - the no-export switch
- event: battman_run_update
  event_data:
    action: ScriptRun
    lastRunAt: '{{ now().isoformat() }}'
    sellPrice: '{{ decision.run.sellPrice }}'
    sellPricePreferred: '{{ decision.run.sellPricePreferred }}'
    sellPriceLow: '{{ decision.run.sellPriceLow }}'
    sellPriceRule: '{{ decision.run.sellPriceRule }}'
    sellPriceCalc: '{{ decision.run.sellPriceCalc }}'
    sellPriceForecast: '{{ decision.run.sellPriceForecast }}'
    sellAbove: '{{ decision.run.sellAbove }}'
    sellAboveA: '{{ decision.run.sellAboveA }}'
    sellAboveB: '{{ decision.run.sellAboveB }}'
    sellReason: '{{ decision.run.sellReason }}'
    buyPrice: '{{ decision.run.buyPrice }}'
    buyPricePreferred: '{{ decision.run.buyPricePreferred }}'
    buyPriceHigh: '{{ decision.run.buyPriceHigh }}'
    buyPriceRule: '{{ decision.run.buyPriceRule }}'
    buyPriceCalc: '{{ decision.run.buyPriceCalc }}'
    buyPriceForecast: '{{ decision.run.buyPriceForecast }}'
    buyBelow: '{{ decision.run.buyBelow }}'
    buyBelowA: '{{ decision.run.buyBelowA }}'
    buyBelowB: '{{ decision.run.buyBelowB }}'
    sellPriceOverride: '{{ decision.run.sellPriceOverride }}'
    sellAboveOverride: '{{ decision.run.sellAboveOverride }}'
    sellPriceSolar: '{{ decision.run.sellPriceSolar }}'
    sellAboveSolar: '{{ decision.run.sellAboveSolar }}'
    sellPriceProtect: '{{ decision.run.sellPriceProtect }}'
    buyPriceOverride: '{{ decision.run.buyPriceOverride }}'
    buyBelowOverride: '{{ decision.run.buyBelowOverride }}'
    buyPriceAnytime: '{{ decision.run.buyPriceAnytime }}'
    buyBelowAnytime: '{{ decision.run.buyBelowAnytime }}'
    drainBatteryPrice: '{{ decision.run.drainBatteryPrice }}'
    drainBatterySOC: '{{ decision.run.drainBatterySOC }}'
    drainBatteryPlughole: '{{ decision.run.drainBatteryPlughole }}'
    buyReason: '{{ decision.run.buyReason }}'
    needy: '{{ decision.run.needy }}'
    needSun: '{{ decision.run.needSun }}'
    needPower: '{{ decision.run.needPower }}'
  alias: 3d. ACT - tell the rest of Battman (the run sensor, the cards, the watchdog)
