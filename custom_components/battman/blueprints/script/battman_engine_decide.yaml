# Battman engine.
# Managed by Battman: written into your config and replaced on every Battman update.
# Don't edit this copy.
#
# Decide: works out what the battery should do (mode, curtail, the run record and the log text) from
# one bundle, `params` (built by script.battman_engine_inputs, or supplied by hand for a what-if).
# It reads NO sensors and NO clock, and acts on nothing: it returns the decision as its response.
# script.battman_engine acts on it; script.battman_engine_forecast asks it for every future slot.
#
# Read it top to bottom. Units: prices $/kWh (settings in cents, divided by 100 here), SOC %, kWh, kW.
# Amber's shapes and signs are kept for now: a forecast entry is {start_time, duration (minutes),
# per_kwh}, and a feed-in forecast per_kwh is NEGATIVE when you earn (the steps below flip it).

blueprint:
  name: Battman engine – decide
  description: The Battman engine's decision, from a parameter bundle. Reads no sensors, acts on nothing.
  domain: script
  source_url: https://github.com/AJErazzor/battman
  input: {}
icon: mdi:head-cog-outline
# parallel: a forecast can run this many times at once and a real run never waits behind it
mode: parallel
max: 20
max_exceeded: silent
fields:
  params:
    name: Parameter bundle
    description: >-
      Everything the decision needs (see script.battman_engine_inputs for how it is built):
      now, soc, capacity_kwh, mode_now, on_grid, pv_remaining_p10, load_avg_kw, buy_now, sell_now,
      buy_forecast, sell_forecast, is_estimate, settings, soc_curves, price_curves, rules, day, tracking.
    required: true
sequence:
- variables:
    # shown in the engine's log
    version: 1.0.23
    sellSOCProrate: true
    buySOCProrate: true
    remainingPVGapAllowedkwh: '{{params.settings.needyTriggerPVGap | float}}'
    highConsumptionkw: '{{params.settings.needyTriggerConsumption | float}}'
    spikePrice1: '{{(params.settings.sellSpikePrice1 | float) / 100}}'
    spikeLowSOC1: '{{params.settings.sellSpikeSOC1 | float}}'
    spikePrice2: '{{(params.settings.sellSpikePrice2 | float) /100}}'
    spikeLowSOC2: '{{params.settings.sellSpikeSOC2 | float}}'
    buyAnytimePrice: '{{(params.settings.buyAnytimePrice | float) /100}}'
    buyAnytimeSOCBelow: '{{params.settings.buyAnytimeSOC | float}}'
    overrideSellPrice: '{{(params.settings.sellOverridePrice | float) /100}}'
    overrideSellSOC: '{{params.settings.sellOverrideSOC | float}}'
    solarSellPrice: '{{(params.settings.sellSolarPrice | float) /100}}'
    solarSellSOC: '{{params.settings.sellSolarSOC | float}}'
    overrideBuyPrice: '{{(params.settings.buyOverridePrice | float) /100}}'
    overrideBuySOC: '{{params.settings.buyOverrideSOC | float}}'
    drainBatteryPrice: '{{(params.settings.drainBatteryPrice | float) /100}}'
    drainBatterySOC: '{{params.settings.drainBatterySOC | float}}'
    drainBatteryPlughole: '{{ params.settings.drainBatteryPlughole | bool }}'
  alias: Limits
- variables:
    # Minutes since midnight, local time (from params.now). The clock windows used below (HH:MM to HH:MM)
    # are [HH:MM:00, HH:MM:00) on whole minutes, so they are exactly these minute ranges.
    clockMinutes: "{{ as_local(as_datetime(params.now)).hour * 60 + as_local(as_datetime(params.now)).minute }}"
  alias: Clock
- variables:
    # One-minute pulses as the tariff changes over (10:00, 16:00, 17:00, 21:00)
    tariffSwap10: '{{ clockMinutes == 600 }}'
    tariffSwap16: '{{ clockMinutes == 960 }}'
    tariffSwap17: '{{ clockMinutes == 1020 }}'
    tariffSwap21: '{{ clockMinutes == 1260 }}'
    # Peak 17:00 up to (not including) 20:59, solar sponge 10:00 up to (not including) 15:59
    tariffImportPeak: '{{ clockMinutes >= 1020 and clockMinutes < 1259 }}'
    tariffImportSolarSponge: '{{ clockMinutes >= 600 and clockMinutes < 959 }}'
  alias: Tariff Times
- variables:
    currentSOC: '{{ params.soc | float(0) }}'
    currentMode: '{{ params.mode_now }}'
    batterykwh: '{{params.capacity_kwh | float(0) | round(0)}}'
    currentSOCkwh: '{{ (currentSOC / 100) * batterykwh | round(2) }}'
  alias: Battery State
- variables:
    pvRemainingKnown: '{{ params.pv_remaining_p10 | is_number }}'
    pvRemaining10kwh: '{{ params.pv_remaining_p10 | float if pvRemainingKnown else none }}'
    pvRemainingNotGood: '{{ pvRemainingKnown and (batterykwh-currentSOCkwh - pvRemaining10kwh) > remainingPVGapAllowedkwh }}'
  alias: PV Forecast
- variables:
    needSun: |
      {{ (pvRemainingNotGood and tariffImportSolarSponge) | bool(false)  }}
    loadAvgKnown: "{{ (params.load_avg_kw is number) }}"
    needPower: |
      {{ loadAvgKnown and (params.load_avg_kw | float > highConsumptionkw) }}
    highConsumption: |
      {{ needPower or (pvRemainingNotGood and tariffImportSolarSponge) }}
    highConsumptionText: |
      {% if highConsumption %}
         {{ '_high' }}
      {% else%}
          {{ '' }}
      {% endif %}
    minuteOfDay: '{{ as_local(as_datetime(params.now)).minute | int(0) }}'
    hourOfDay: '{{ as_local(as_datetime(params.now)).hour | int(0) }}'
    nextHourofDay: '{{(as_local(as_datetime(params.now)) + timedelta(hours=1)).hour | int(0) }}'
    monthOfYear: '{{ as_local(as_datetime(params.now)).strftime(''%b'') | lower }}'
    nextHourofDayMonth: '{{(as_local(as_datetime(params.now)) + timedelta(hours=1)).strftime(''%b'') | lower }}'
    socCurves: '{{ params.soc_curves | default({}) }}'
    minSOCForSellA: |
      {# min SOC for selling at now, ie can sell if current SOC >= this and price is right #}  {{ socCurves.get(monthOfYear, {}).get('sell'~highConsumptionText, [99]*24)[hourOfDay] | int  }}
    minSOCForSellB: |
      {# min SOC for selling at now, ie can sell if current SOC >= this and price is right #} {% if not sellSOCProrate %}
        {{ minSOCForSellA }}
      {%else%}
        {{ socCurves.get(nextHourofDayMonth, {}).get('sell'~highConsumptionText, [99]*24)[nextHourofDay] | int  }}
      {%endif%}
    minSOCForSell: |
      {# min SOC for selling at now, ie can sell if current SOC >= this and price is right #}  {{(minSOCForSellA+((minSOCForSellB - minSOCForSellA)*minuteOfDay/60)) | round(2, 'floor')}}
    minSOCForBuyA: |
      {# min SOC for selling at now, ie can sell if current SOC >= this and price is right #}  {{ socCurves.get(monthOfYear, {}).get('buy'~highConsumptionText, [5]*24)[hourOfDay] | int  }}
    minSOCForBuyB: |
      {# min SOC for selling at now, ie can sell if current SOC >= this and price is right #}  {% if  not buySOCProrate %}
        {{ minSOCForBuyA }}
      {%else%}
        {{ socCurves.get(nextHourofDayMonth, {}).get('buy'~highConsumptionText, [5]*24)[nextHourofDay] | int  }}
      {%endif%}
    minSOCForBuy: |
      {# min SOC for selling at now, ie can sell if current SOC >= this and price is right #} {{(minSOCForBuyA+((minSOCForBuyB - minSOCForBuyA)*minuteOfDay/60)) | round(2, 'floor')}}
  alias: SOC
- variables:
    priceCurves: '{{ params.price_curves | default({}) }}'
    defaultSellPrice: '{{ priceCurves.get(monthOfYear, {}).get(''sell''~highConsumptionText, {}).get(''high'',  [99]*24)[hourOfDay] | float(15) / 100 }}'
    lowSellPrice: '{{ priceCurves.get(monthOfYear, {}).get(''sell''~highConsumptionText, {}).get(''low'',  [99]*24)[hourOfDay] | float(10) / 100 }}'
    defaultBuyPrice: '{{ priceCurves.get(monthOfYear, {}).get(''buy''~highConsumptionText, {}).get(''low'',  [99]*24)[hourOfDay] | float(6) / 100 }}'
    highBuyPrice: '{{ priceCurves.get(monthOfYear, {}).get(''buy''~highConsumptionText, {}).get(''high'',  [99]*24)[hourOfDay] | float(9) / 100 }}  '
    currentBuyPrice: '{{ params.buy_now | float(0) }}'
    currentSellPrice: '{{ params.sell_now  | float(0) }}'
    forecastBuyPrice: '{{ params.buy_forecast | default([]) }}'
    forecastSellPrice: '{{ params.sell_forecast | default([])}}'
    isEstimate: |
      {{ params.is_estimate }}
    minSOCForSellProratedOffset: '{{params.settings.sellProrateSOCOffset | float}}'
    minSOCForSellLowOffset: '{{params.settings.sellLowSOCOffset | float}}'
    minSOCForBuyProratedOffset: '{{params.settings.buyProrateSOCOffset | float}}'
    minSOCForBuyHighOffset: '{{params.settings.buyHighSOCOffset | float}}'
    minSOCForSellLow: '{{  min((minSOCForSell + minSOCForSellLowOffset),101)  | float(0) }}'
    minSOCForSellProrated: '{{ min((minSOCForSell + minSOCForSellProratedOffset),101) | float(0) }}'
    minSOCForBuyProrated: '{{ max((minSOCForBuy - minSOCForBuyProratedOffset),0) | float(0) }}'
    minSOCForBuyHigh: '{{ max((minSOCForBuy - minSOCForBuyHighOffset),0) | float(0) }}'
    todayCost: |
      {% set todaysellCost = params.day.sell | float(0) %}
      {% set todaybuyCost = params.day.buy | float(0) %}
      {% set todayfee = params.settings.dailyNetworkCharge | float %}
      {{ todaysellCost - todaybuyCost - todayfee }}
    todaysImportCostCentsPerKwh: |
      {% set todaysellCost = params.tracking.sell.Cost | float(0) %}
      {% set todaybuyCost = params.tracking.buy.Cost | float(0) %}
      {% set todaybuykwh = params.tracking.buy.kwh | float(0) %}
      {% set todaybuycuttoffcKwh = params.tracking.buy.CutOffcKwh | float(0) %}
      {% set todaybuycuttoffKwh = params.tracking.buy.CutOffKwh | float(0) %}
      {% set todaybuyOffset = params.tracking.buy.Offset | float(0) %}
      {% if todaybuyCost <= 0
            or todaybuykwh <= todaybuycuttoffKwh
            or todaybuycuttoffcKwh <= 0
            or todaybuyCost <= todaysellCost %}
        0
      {% elif (todaybuyCost / todaybuykwh) * 100 <= todaybuycuttoffcKwh %}
        0
      {% else %}
        {{ ((todaybuyCost / todaybuykwh) + (todaybuyOffset / 100)) | round(2) }}
      {% endif %}
  alias: Prices
- variables:
    avg_buy_Next: |
      {# Next buy forecast #} {% set forecasts = forecastBuyPrice %} {% set ns =namespace(window=[]) %} {% for f in forecasts[0:1] %}
        {% set ns.window = ns.window + [f] %}
      {% endfor %} {% if ns.window | length > 0 %}
        {{ ((ns.window | map(attribute='per_kwh') | map('float') | sum) / (ns.window | length)) | round(4) }}
      {% else %}
        0
      {% endif %}
    avg_fit_Next: |
      {# Next feed in forecast #} {% set forecasts = forecastSellPrice %} {% set ns =namespace(window=[]) %} {% for f in forecasts[0:1] %}
        {% set ns.window = ns.window + [f] %}
      {% endfor %}
      {% if ns.window | length > 0 %}

          {{ (((ns.window | map(attribute='per_kwh') | map('float') | sum) * -1) / (ns.window | length)) | round(4) }}

      {% else %}
        0
      {% endif %}
  alias: Price Forecasts
- variables:
    buyRule: |
      {% set rule = none %}  {% set useRules = params.rules.buy_on %}
      {% if useRules  %}
         {% set rules = params.rules.buy or [] %}
         {% set rule = rules[as_local(as_datetime(params.now)).hour] if rules | length > as_local(as_datetime(params.now)).hour else none %}
      {% endif %}  {{rule}}
    buyRuleAvgs: |
      {% if buyRule  %}

         {% set rule = buyRule %}
         {% if not rule or not rule.isActive  %}
           {{[]}}

         {% elif rule.hours_ahead | int(0) > 0  %}

          {% set interval = rule.grouping_minutes %}  {# minutes per bucket #}
          {% set hours_ahead = rule.hours_ahead %} {# cutoff X hours time #}

          {# --- Adjust to 5 minute blocks ---#}
          {% set interval = interval // 5 %}
          {% if interval == 0 %} {% set interval = 1 %}{% endif %}

          {# --- Build cutoff ---#}
          {% set cutoff = as_local(as_datetime(params.now)) + timedelta(hours=hours_ahead) %}
          {% set cutoff = cutoff.replace(minute=0, second=0, microsecond=0) %}

          {# --- Build 5-minute normalised series until cutoff --- #}

          {% set forecasts = forecastBuyPrice %}
          {% set forecastsTo5m = namespace(forecasts=[],Interval=[]) %}
          {% for f in forecasts %}
            {# --- Stop if we've passed cutoff time --- #}
            {% if as_timestamp(f.start_time) >= as_timestamp(cutoff) %}
              {% break %}
            {% endif %}

            {# --- Expand into 5-minute intervals --- #}
            {% set repeat = (f.duration | int) // 5 %}
            {% for _ in range(repeat) %}
              {% set forecastsTo5m.forecasts = forecastsTo5m.forecasts + [f] %}
            {% endfor %}
          {% endfor %}

          {# --- Group by interval and adverage --- #}
          {% for i in range(0, forecastsTo5m.forecasts | length, interval) %}
            {% set chunk = forecastsTo5m.forecasts[i:i+interval] %}
            {% if chunk | length > 0 %}
              {% set avg = (chunk | map(attribute='per_kwh') | map('float') | map('multiply', 1) | sum) / (chunk | length) %}
              {% set forecastsTo5m.Interval = forecastsTo5m.Interval + [avg] %}
            {% endif %}
          {% endfor %}

          {{forecastsTo5m.Interval}}

         {% else %}
            {{[]}}
         {% endif %}
      {% else %}
          {{[]}}
      {% endif %}
    buyRuleAvgsDetail: |
      {% set detailns = namespace(detail=[]) %}

      {% if buyRuleAvgs | length != 0 %}
        {% set startTime = as_timestamp(forecastBuyPrice[0].start_time)%}
        {% set cutoff = as_timestamp((as_local(as_datetime(params.now)) + timedelta(hours=buyRule.hours_ahead)).replace(minute=0, second=0, microsecond=0)) %}

        {% for i in range(0, buyRuleAvgs  | length) %}
           {% set avg = buyRuleAvgs[i]| round(4) %}
           {% set start = (startTime + 60*buyRule.grouping_minutes*i) | timestamp_custom('%H:%M', true) %}
           {% set end = (startTime + 60*buyRule.grouping_minutes*(i+1)) | timestamp_custom('%H:%M', true) %}
           {% if i == ((buyRuleAvgs | length) - 1) %}
             {% set end = (cutoff) | timestamp_custom('%H:%M', true)%}
           {%endif%}
           {% set detailns.detail = detailns.detail + [{'start': start,'end': end,'avg': avg}] %}
        {% endfor %}
      {% endif %}

      {{detailns.detail}}
    buyRuleResult: |
      {% if buyRule  %}
         {% set rule = buyRule %}

         {# --- Not Active --- #}
         {% if not rule or not rule.isActive  %}
           {{0}}

         {# --- Look ahead has bee defined --- #}
         {% elif rule.hours_ahead | int(0) > 0  %}

          {# --- Get Max --- #}
          {% set result = buyRuleAvgs | min if buyRuleAvgs | length > 0 else 0%}

          {# --- Apply adjustments --- #}
          {% if rule.offset != 0 %}{% set result = result +  rule.offset/100 %}{% endif %}
          {% if  rule.roundTo > 0  %}{% set result = result | round( rule.roundTo,  rule.roundtype) %}{% endif %}
          {% if result < 0  %}{% set result = 0 %}{% endif %}
          {{result}}

         {% else %}
            {{0}}
         {% endif %}
      {% else %}
          {{0}}
      {% endif %}
    buyPriceCalc: |
      {# Set buy price around defaultBuyPrice and highBuyPrice by looking at some SOC data. Using a gap of 10%. If > 10% high price, between 10%-1% prorate down to defult price #}

       {% set buyPriceNow = defaultBuyPrice %}
       {% if minSOCForBuyHigh < minSOCForBuy and currentSOC  <= minSOCForBuyHigh  %}
         {% set buyPriceNow = highBuyPrice %}
       {% elif minSOCForBuyHigh < minSOCForBuy and  minSOCForBuyProrated > minSOCForBuyHigh and currentSOC <= minSOCForBuyProrated %}
         {% set buyPriceNow = defaultBuyPrice - ((highBuyPrice -defaultBuyPrice  ) * ((currentSOC  - minSOCForBuyProrated   )/(minSOCForBuyProrated- minSOCForBuyHigh) )) %}
       {% else %}
         {% set buyPriceNow = defaultBuyPrice %}
       {% endif %}

       {{buyPriceNow}}
    buyPrice: |
      {# Set buy price around defaultBuyPrice and highBuyPrice by looking at some SOC data. Using a gap of 10%. If > 10% high price, between 10%-1% prorate down to defult price #}

       {% set buyPriceNow = buyPriceCalc %}

       {% if buyRuleResult != 0 and buyRuleResult < highBuyPrice %}
         {% if buyRuleResult < buyPriceNow  %}
           {% set buyPriceNow = buyRuleResult %}
         {% elif buyRuleResult > buyPriceNow and ((currentSOC > minSOCForBuyHigh and currentSOC < minSOCForBuyProrated) or ( overrideBuySOC > 0 and currentSOC < overrideBuySOC)) %}
           {% set buyPriceNow = buyRuleResult %}
         {% endif %}
       {% endif %}

       {{buyPriceNow}}
  alias: Tweak Buy Price
- variables:
    sellRule: |
      {% set rule = none %}  {% set useRules = params.rules.sell_on %}
      {% if useRules  %}
         {% set rules = params.rules.sell or [] %}
         {% set rule = rules[as_local(as_datetime(params.now)).hour] if rules | length > as_local(as_datetime(params.now)).hour else none %}
      {% endif %}  {{rule}}
    sellRuleAvgs: |
      {% if sellRule  %}

         {% set rule = sellRule %}
         {% if not rule or not rule.isActive  %}
           {{[]}}

         {% elif rule.hours_ahead | int(0) > 0  %}

          {% set interval = rule.grouping_minutes %}  {# minutes per bucket #}
          {% set hours_ahead = rule.hours_ahead %} {# cutoff X hours time #}

          {# --- Adjust to 5 minute blocks ---#}
          {% set interval = interval // 5 %}
          {% if interval == 0 %} {% set interval = 1 %}{% endif %}

          {# --- Build cutoff ---#}
          {% set cutoff = as_local(as_datetime(params.now)) + timedelta(hours=hours_ahead) %}
          {% set cutoff = cutoff.replace(minute=0, second=0, microsecond=0) %}

          {# --- Build 5-minute normalised series until cutoff --- #}

          {% set forecasts = forecastSellPrice %}
          {% set forecastsTo5m = namespace(forecasts=[],Interval=[]) %}
          {% for f in forecasts %}
            {# --- Stop if we've passed cutoff time --- #}
            {% if as_timestamp(f.start_time) >= as_timestamp(cutoff) %}
              {% break %}
            {% endif %}

            {# --- Expand into 5-minute intervals --- #}
            {% set repeat = (f.duration | int) // 5 %}
            {% for _ in range(repeat) %}
              {% set forecastsTo5m.forecasts = forecastsTo5m.forecasts + [f] %}
            {% endfor %}
          {% endfor %}

          {# --- Group by interval and adverage --- #}
          {% for i in range(0, forecastsTo5m.forecasts | length, interval) %}
            {% set chunk = forecastsTo5m.forecasts[i:i+interval] %}
            {% if chunk | length > 0 %}
              {% set avg = (chunk | map(attribute='per_kwh') | map('float') | map('multiply', -1) | sum) / (chunk | length) %}
              {% set forecastsTo5m.Interval = forecastsTo5m.Interval + [avg] %}
            {% endif %}
          {% endfor %}

          {{forecastsTo5m.Interval}}

         {% else %}
            {{[]}}
         {% endif %}
      {% else %}
          {{[]}}
      {% endif %}
    sellRuleAvgsDetail: |
      {% set detailns = namespace(detail=[]) %}

      {% if sellRuleAvgs | length != 0 %}
        {% set startTime = as_timestamp(forecastSellPrice[0].start_time)%}
        {% set cutoff = as_timestamp((as_local(as_datetime(params.now)) + timedelta(hours=sellRule.hours_ahead)).replace(minute=0, second=0, microsecond=0)) %}

        {% for i in range(0, sellRuleAvgs  | length) %}
           {% set avg = sellRuleAvgs[i]| round(4) %}
           {% set start = (startTime + 60*sellRule.grouping_minutes*i) | timestamp_custom('%H:%M', true) %}
           {% set end = (startTime + 60*sellRule.grouping_minutes*(i+1)) | timestamp_custom('%H:%M', true) %}
           {% if i == ((sellRuleAvgs | length) - 1) %}
             {% set end = (cutoff) | timestamp_custom('%H:%M', true)%}
           {%endif%}
           {% set detailns.detail = detailns.detail + [{'start': start,'end': end,'avg': avg}] %}
        {% endfor %}
      {% endif %}

      {{detailns.detail}}
    sellRuleResult: |
      {% if sellRule  %}
         {% set rule = sellRule %}

         {# --- Not Active --- #}
         {% if not rule or not rule.isActive  %}
           {{0}}

         {# --- Look ahead has bee defined --- #}
         {% elif rule.hours_ahead | int(0) > 0  %}

          {# --- Get Max --- #}
          {% set result = sellRuleAvgs | max if sellRuleAvgs | length > 0 else 0%}

          {# --- Apply adjustments --- #}
          {% if rule.offset != 0 %}{% set result = result +  rule.offset/100 %}{% endif %}
          {% if  rule.roundTo > 0  %}{% set result = result | round( rule.roundTo,  rule.roundtype) %}{% endif %}
          {% if result < 0  %}{% set result = 0 %}{% endif %}
          {{result}}

         {# --- No Look ahead but has last chance --- #}
         {% elif rule.allowLastChance and todayCost < 0  %}
           {{lowSellPrice}}

         {% else %}
            {{0}}
         {% endif %}
      {% else %}
          {{0}}
      {% endif %}
    todaysImportCostCentsPerKwhLastChance: |
      {% set allowLastChance = params.tracking.buy.AllowLastChance | int(0)  %}  {% if allowLastChance == 1 and sellRule and sellRule.allowLastChance and todayCost < 0 %}
         0
      {% else  %}
        {{todaysImportCostCentsPerKwh}}
      {% endif %}
    sellPriceCalc: |
      {# Set sell price around defaultSellPrice and lowSellPrice by looking at some avg data #}
      {% set sellPriceNow = defaultSellPrice %} {% if todayCost < 0 and minSOCForSellLow > minSOCForSell and currentSOC  >= minSOCForSellLow %}
          {% set sellPriceNow = max(todaysImportCostCentsPerKwh, lowSellPrice) %}
      {% elif todayCost < 0 and minSOCForSellProrated > minSOCForSell and  minSOCForSellLow > minSOCForSellProrated and currentSOC >= minSOCForSellProrated %}
          {% set sellPriceNow = max(todaysImportCostCentsPerKwh,
                (defaultSellPrice - ((defaultSellPrice - lowSellPrice)
                  * ((currentSOC - minSOCForSellProrated) / (minSOCForSellLow - minSOCForSellProrated))))) %}
      {% else %}
          {% set sellPriceNow = max(todaysImportCostCentsPerKwh, defaultSellPrice)%}
      {% endif %}

      {{sellPriceNow}}
    sellPrice: |
      {# Set sell price around defaultSellPrice and lowSellPrice by looking at some avg data #}
      {% set sellPriceNow = sellPriceCalc %}           {% if sellRuleResult != 0 and sellRuleResult > lowSellPrice %}
        {% if sellRuleResult >= sellPriceNow and sellRule.allowLastChance and todayCost < 0  %}
          {# Sell at rounded down avg #}
          {%set sellPriceNow = max (todaysImportCostCentsPerKwhLastChance, sellRuleResult)%}
        {% elif sellRuleResult >= sellPriceNow  %}
          {# Sell at rounded down avg #}
          {%set sellPriceNow = max (todaysImportCostCentsPerKwh,  sellRuleResult)%}
        {% elif sellRule.allowLastChance and todayCost < 0  %}
          {# Price is bad, drop to low? #}
          {%set sellPriceNow = max (todaysImportCostCentsPerKwhLastChance, lowSellPrice, sellRuleResult)%}
        {% endif %}
      {% endif %}   {%set sellPriceNow = max(todaysImportCostCentsPerKwh, sellPriceNow)%}
      {{sellPriceNow}}
  alias: Tweak Sell Price
- variables:
    soakCharge: |
      {# When true will charge the battery on -ve buy, otherwise hold of for a better price and just run house #}   {% if overrideBuyPrice < 0  %}
        {% if currentBuyPrice <= overrideBuyPrice %}
          {{true}}
       {% else %}
          {{false}}
        {% endif %}
      {% elif currentBuyPrice <= 0 %}
        {{true}}
      {% else %}
        {{false}}
      {% endif %}
  alias: Charge Rules (Negative)
- variables:
    buyReason: |
      {# Check if we should buy #}

      {% set buyReasonResult = [false, 0, 'No Buy']  %}
      {% if overrideBuyPrice < 0 %}
        {% if currentBuyPrice <= overrideBuyPrice  %}
         {% set buyReasonResult = [true, 9, 'Override Price -ve']  %}
        {% endif %}

      {% elif overrideBuyPrice > 0 and overrideBuySOC > 0  %}
        {% if currentBuyPrice <= overrideBuyPrice and currentSOC <= overrideBuySOC %}
         {% set buyReasonResult = [true, 1, 'Override Price and SOC']  %}
        {% endif %}

      {% elif overrideBuyPrice > 0 and overrideBuySOC == 0 %}
        {%if currentBuyPrice <= overrideBuyPrice and currentSOC < minSOCForBuy %}
           {% set buyReasonResult = [true, 2, 'Override Price']  %}
        {% endif %}

      {% elif overrideBuySOC > 0 and overrideBuyPrice == 0 %}
        {%if currentBuyPrice <= buyPrice and currentSOC <= overrideBuySOC %}
          {% set buyReasonResult = [true, 3, 'Override SOC']  %}
        {% endif %}

      {% elif tariffImportPeak %}
        {% set buyReasonResult = [false, 0, 'No Buy in Peak Tariff']  %}

      {% elif currentBuyPrice <= buyPrice and currentSOC < minSOCForBuy %}

        {% if buyRuleResult != 0 and buyRuleResult == buyPrice %}
          {% set buyReasonResult = [true, 4, 'Rule Active']  %}
        {% elif buyPriceCalc != 0 and buyPriceCalc == buyPrice and buyPrice == highBuyPrice %}
          {% set buyReasonResult = [true, 5, 'High']  %}
        {% elif buyPriceCalc != 0 and buyPriceCalc == buyPrice and buyPrice == defaultBuyPrice %}
          {% set buyReasonResult = [true, 6, 'Preferred']  %}
        {% else %}
          {% set buyReasonResult = [true, 7, 'Prorate']  %}
        {% endif %}

      {% elif buyAnytimePrice > 0 and currentBuyPrice <= buyAnytimePrice and currentSOC < buyAnytimeSOCBelow %}
        {% set buyReasonResult = [true, 8, 'Anytime']  %}
      {% endif %}

      {{buyReasonResult}}
    buyCharge: |
      {# When element 0 is true will charge the battery on +ve buy #}

      {% if buyReason[0] %}
        {{true}}
      {% else %}
        {{false}}
      {% endif %}
  alias: Charge Rules (Positive)
- variables:
    # Sell Solar by the hour: an Active sell rule with its Sell solar switch on. The settings are shared by every hour.
    # An unset setting is the setting's own default, never 0 (a 0 price and level would sell solar for nothing).
    solarRulePrice: '{{ (params.settings.get(''sellSolarRulePrice'', 5) | float(5)) / 100 }}'
    solarRuleSOC: '{{ params.settings.get(''sellSolarRuleSOC'', 5) | float(5) }}'
    solarRuleExcessKwh: '{{ params.settings.get(''sellSolarRuleExcess'', 10) | float(10) }}'
    # once selling, it carries on until the excess is this much (kWh) under the setting, so a forecast that
    # wobbles around the setting doesn't flip the mode on every run
    solarRuleHoldKwh: 1
    # this hour's sell rule exists (Sell rules enabled), is Active and has Sell solar switched on
    solarRuleOn: >-
      {{ (sellRule is mapping
          and sellRule.isActive == true
          and sellRule.get('allowSellSolar', false) == true) | bool(false) }}
    # kWh still to fit in the battery, and how much of Solcast's 10% remaining-today forecast is left once it is full
    solarRuleToFullKwh: '{{ batterykwh - currentSOCkwh }}'
    solarRuleExcess: '{{ (pvRemaining10kwh - solarRuleToFullKwh) if pvRemainingKnown else none }}'
    # Already in Float: keep selling solar while the excess is within the hold of the setting and the price isn't
    # negative. The price and battery level were tested when it started, so they aren't tested again here.
    solarRuleHolding: >-
      {{ currentMode == 'Float'
         and solarRuleExcess is not none
         and solarRuleExcess >= solarRuleExcessKwh - solarRuleHoldKwh
         and currentSellPrice >= 0 }}
    # Not in Float yet: start when all three limits are met (price and battery level are "at or above").
    solarRuleStart: >-
      {{ solarRuleExcess is not none
         and solarRuleExcess >= solarRuleExcessKwh
         and currentSellPrice >= solarRulePrice
         and currentSOC >= solarRuleSOC }}
  alias: Sell Solar Rule
- variables:
    sellReason: |
      {# Check if we should sell #}
      {% set sellReasonResult = [false, 0, 'No Sell']  %}

      {% if overrideSellPrice > 0 and overrideSellSOC > 0 and currentSellPrice >= overrideSellPrice and currentSOC > overrideSellSOC %}
        {% set sellReasonResult = [true, 1, 'Override Price and SOC']  %}

      {% elif overrideSellPrice > 0 and overrideSellSOC == 0 and currentSellPrice >= overrideSellPrice and currentSOC > minSOCForSell %}
        {% set sellReasonResult = [true, 2, 'Override Price']  %}

      {% elif overrideSellSOC > 0 and overrideSellPrice == 0 and currentSellPrice >= sellPrice and currentSOC > overrideSellSOC %}
        {% set sellReasonResult = [true, 3, 'Override SOC']  %}

      {% elif overrideSellPrice == 0 and overrideSellSOC == 0 and currentSellPrice >= sellPrice and currentSOC > minSOCForSell %}
        {% if sellRuleResult != 0 and sellRuleResult == sellPrice %}
          {% set sellReasonResult = [true, 4, 'Rule Active']  %}
        {% elif sellPriceCalc != 0 and sellPriceCalc == sellPrice and sellPrice == lowSellPrice %}
          {% set sellReasonResult = [true, 5, 'Low']  %}
        {% elif sellPriceCalc != 0 and sellPriceCalc == sellPrice and sellPrice == defaultSellPrice %}
          {% set sellReasonResult = [true, 6, 'Preferred']  %}
        {% elif sellPriceCalc != 0 and sellPriceCalc == sellPrice and sellPrice == todaysImportCostCentsPerKwh %}
          {% set sellReasonResult = [true, 7, 'Protected']  %}
        {% else %}
          {% set sellReasonResult = [true, 8, 'Prorate']  %}
        {% endif %}

      {% elif currentSellPrice > spikePrice1 and currentSOC > spikeLowSOC1 %}
        {% set sellReasonResult = [true, 9, 'Spike 1']  %}

      {% elif currentSellPrice > spikePrice2 and currentSOC > spikeLowSOC2 %}
        {% set sellReasonResult = [true, 10, 'Spike 2']  %}

      {% elif solarSellPrice > 0 and solarSellSOC> 0 and currentSellPrice > solarSellPrice and currentSOC > solarSellSOC %}
        {% set sellReasonResult = [true, 11, 'Solar']  %}

      {% elif solarSellPrice == 0 and solarSellSOC > 0 and currentSOC > solarSellSOC %}
        {% set sellReasonResult = [true, 13, 'Solar -ve']  %}

      {% elif drainBatteryPrice > 0 and drainBatterySOC > 0 and currentBuyPrice < drainBatteryPrice and currentSOC > drainBatterySOC %}
        {% set sellReasonResult = [true, 12, 'Drain']  %}

      {% elif drainBatteryPrice > 0 and drainBatterySOC == 0 and currentBuyPrice < drainBatteryPrice and currentSOC > minSOCForBuy %}
        {% set sellReasonResult = [true, 12, 'Drain']  %}
      {# Last, so it only acts when nothing above wants to: this hour's Sell solar rule (see Sell Solar Rule above) #}
      {% elif solarRuleOn and (solarRuleHolding or solarRuleStart) %}
        {% set sellReasonResult = [true, 14, 'Solar Rule']  %}

      {% endif %}
      {{sellReasonResult}}
    sellDischarge: |
      {# When element 0 is true will discharge the battery on +ve sell #}

      {% if sellReason[0] %}
        {{true}}
      {% else %}
        {{false}}
      {% endif %}
  alias: Discharge Rules
- variables:
    holdMode: |
      {# When true will continue the current mode thru the estimated time, otherwise drop to self consume #}
      {% if tariffSwap10 or tariffSwap16 or tariffSwap17 or tariffSwap21 %}
        {{false}}
      {% elif currentMode == 'Float Solar Off' and avg_buy_Next >= 0.01 %}
        {{false}}
      {% elif currentMode == 'Charge Solar Off' and avg_buy_Next >= 0.01 %}
        {{false}}
      {% elif currentMode == 'Solar Soak' and avg_buy_Next >= 0.05  %}
        {{false}}
      {% elif currentMode == 'Charge' and ((overrideBuySOC > 0 and currentSOC < overrideBuySOC) or (overrideBuySOC == 0 and avg_buy_Next > highBuyPrice)) %}
        {{false}}
      {% elif currentMode == 'Discharge' and avg_fit_Next <= 0.05 %}
        {{false}}
      {% elif currentMode == 'Drain' %}
        {{true}}
      {% else %}
        {{true}}
      {% endif %}
  alias: Hold the current mode
- variables:
    curtail: '{{ currentSellPrice < 0 }}'
    soak: '{{ currentBuyPrice < 0 }}'
    solar_mode: |
      {# Now just choose a mode #}
      {% if not params.on_grid %}
        Self Consume
      {% else %}
        {% if isEstimate == true %}
           {% if holdMode == true %}
              {{ currentMode }}
           {% else %}
              Self Consume
           {% endif %}
        {% elif soak == true %}
          {% if soakCharge %}
              Charge Solar Off
          {% elif drainBatteryPlughole and sellDischarge and sellReason[2] == 'Drain' %}
              Drain
          {% else %}
              Float Solar Off
          {% endif %}
        {% elif buyCharge %}
             Charge
        {% elif curtail != true and sellDischarge and sellReason[2] == 'Solar' %}
             Float
        {% elif sellDischarge and sellReason[2] == 'Solar -ve' %}
             Float
        {% elif curtail != true and sellDischarge and sellReason[2] == 'Solar Rule' %}
             Float
        {% elif sellDischarge and sellReason[2] == 'Drain' %}
             Drain
        {% elif curtail != true and sellDischarge  %}
             Discharge

        {% else %}
             Self Consume
        {% endif %}

      {% endif %}
    sellReason: |
      {% if solar_mode == 'Discharge'%}
        {{sellReason}}
      {% elif solar_mode == 'Drain'%}
        {{[true, sellReason[1], 'No, Draining']}}
      {% elif solar_mode == 'Float' and sellReason[2] == 'Solar Rule'%}
         {{[true, sellReason[1], 'Solar Rule']}}
      {% elif solar_mode == 'Float' and sellReason[2] in ['Solar', 'Solar -ve']%}
         {{[true, sellReason[1], 'Solar Only']}}
      {% else %}
         {{[false, sellReason[1], sellReason[2]]}}
      {% endif %}
    buyReason: |
      {% if solar_mode == 'Charge'%}
        {{buyReason}}
      {% elif solar_mode == 'Charge Solar Off'  %}
        {{[true, 9, 'Hoooover']}}
      {% elif solar_mode == 'Float Solar Off' %}
        {{[true, 10, 'House Party']}}
      {% else %}
        {{[false, buyReason[1], buyReason[2]]}}
      {% endif %}
  alias: Set mode
- variables:
    prettyMessage: |
      Run: {{ as_local(as_datetime(params.now)).strftime('%Y-%m-%d %H:%M:%S') }}

      Mode: {{currentMode}} → {{solar_mode}} {% if buyReason[0] %}({{buyReason[2]}}){% elif sellReason[0]%}({{sellReason[2]}}){%endif%}

      Prices: {% if isEstimate %} (Est){% endif %} {% if spikePrice1 <= currentSellPrice %} (Spike 1){% endif %}{% if spikePrice2 <= currentSellPrice %} (Spike 2){% endif %}
        Sell: ${% if overrideSellPrice > 0 %} {{ overrideSellPrice }} (Overriding ${{sellPrice | round(4)}}) {% else %} {{ sellPrice | round(4) }}{% endif %} (Current: ${{currentSellPrice}}) (Prorate: ${{defaultSellPrice}}/${{lowSellPrice}})
        Buy: ${% if overrideBuyPrice > 0 %} {{ overrideBuyPrice }} (Overriding ${{buyPrice | round(4)}}) {% else %}{{buyPrice | round(4)}} {% endif %}(Current: ${{currentBuyPrice}}) (Prorate: ${{defaultBuyPrice}}/${{highBuyPrice}})
        {% if todaysImportCostCentsPerKwh > 0 %}Min Sell: ${{todaysImportCostCentsPerKwh}} until buy is recovered{% endif %}


      Battery: {{currentSOC}}% ({{currentSOCkwh | round(1)}} kWh)

      SOC Limits:{% if highConsumption %} (On High Curve!){% endif %}
      {% if not loadAvgKnown %}  Load average: missing (sensor.battman_load_30m_avg has no value), high consumption check skipped
      {% endif %}  Sell Above: {% if overrideSellSOC > 0  %} {{ overrideSellSOC}}% (Overriding {{minSOCForSell}}%) {% else %} {{minSOCForSell}}% {% endif %} {% if sellSOCProrate %} (Prorate: {{ minSOCForSellA}}%/{{ minSOCForSellB}}%) {% endif %}
        Buy Below: {% if overrideBuySOC > 0  %} {{ overrideBuySOC}}% (Overriding {{minSOCForBuy}}%) {% else %} {{minSOCForBuy}}% {% endif %} {% if buySOCProrate %} (Prorate: {{ minSOCForBuyA}}%/{{ minSOCForBuyB}}%)  {% endif %}

      Solar:{% if pvRemainingNotGood and tariffImportSolarSponge %} (Bad!){% endif %}
      {% if pvRemainingKnown %}  Remaining (10%): {{pvRemaining10kwh}} kWh{% else %}  Remaining (10%): missing (sensor.solcast_pv_forecast_forecast_remaining_today has no estimate10), sun check skipped{% endif %}
      {% if solarRuleOn %}  Sell Solar rule: {% if solarRuleExcess is none %}no excess figure (no Solcast forecast){% else %}excess {{solarRuleExcess | round(1)}} kWh (needs {{solarRuleExcessKwh}}, holds to {{solarRuleExcessKwh - solarRuleHoldKwh}}), price {{(solarRulePrice * 100) | round(1)}}c or more, battery {{solarRuleSOC}}% or more{% endif %}
      {% endif %}
      Actions:
        Curtail: {{curtail}}
        Soak: {{soak}}
        Sell Discharge: {{sellDischarge}}
        Buy Charge: {{buyCharge}}
        Soak Charge: {{soakCharge}}
        Hold Mode: {{holdMode}}

      Sell Forecasts:
        Next Sell: ${{avg_fit_Next}}{% if sellRule and sellRule.isActive %}

        Sell rule is Active and looking ahead {{sellRule.hours_ahead}} hrs
        Best Avg Sell is: ${{sellRuleResult}} for the Window
        Rule : Offset {{sellRule.offset}}c/kwh, Rounding {{sellRule.roundtype}} {{sellRule.roundTo}}
        Grouping {{sellRule.grouping_minutes}} minutes, Low sell {{sellRule.allowLastChance}}

        {% for i in range(0, sellRuleAvgsDetail  | length) %}
        {{sellRuleAvgsDetail[i].start}} To {{sellRuleAvgsDetail[i].end}} Avg {{sellRuleAvgsDetail[i].avg }} c/kwh{% endfor %}

        {% endif %}



      Buy Forecasts:
        Next Buy: ${{avg_buy_Next}}{% if buyRule and buyRule.isActive %}

        Buy rule is Active and looking ahead {{buyRule.hours_ahead}} hrs
        Best Avg Buy is: ${{buyRuleResult}} for the Window
        Rule : Offset {{buyRule.offset}}c/kwh, Rounding {{buyRule.roundtype}} {{buyRule.roundTo}}
        Grouping {{buyRule.grouping_minutes}} minutes

        {% for i in range(0, buyRuleAvgsDetail  | length) %}
        {{buyRuleAvgsDetail[i].start}} To {{buyRuleAvgsDetail[i].end}} Avg {{buyRuleAvgsDetail[i].avg }} c/kwh{% endfor %}

        {% endif %}

      Version: {{version}}
      Debug:
      Today Cost: ${{todayCost | round(2)}}
      Protected Sell: {{todaysImportCostCentsPerKwh}}c/kwh
      Tracking Sell: ${{params.tracking.sell.Cost | float(0) }} for {{params.tracking.sell.kwh | float(0) }}kwh.
      Tracking Buy: ${{params.tracking.buy.Cost | float(0) }} for {{params.tracking.buy.kwh | float(0) }}kwh
  alias: Debug Message

- variables:
    result:
      mode: '{{ solar_mode }}'
      curtail: '{{ curtail }}'
      soak: '{{ soak }}'
      soakCharge: '{{ soakCharge }}'
      buyCharge: '{{ buyCharge }}'
      sellDischarge: '{{ sellDischarge }}'
      holdMode: '{{ holdMode }}'
      isEstimate: '{{ isEstimate }}'
      todayCost: '{{ todayCost }}'
      # the same record the engine publishes in battman_run_update (without lastRunAt)
      run:
        sellPrice: '{{sellPrice}}'
        sellPricePreferred: '{{defaultSellPrice}}'
        sellPriceLow: '{{lowSellPrice}}'
        sellPriceRule: '{{sellRuleResult}}'
        sellPriceCalc: '{{sellPriceCalc}}'
        sellPriceForecast: '{{sellRuleAvgsDetail}}'
        sellAbove: '{{minSOCForSell}}'
        sellAboveA: '{{minSOCForSellA}}'
        sellAboveB: '{{minSOCForSellB}}'
        sellReason: '{{sellReason}}'
        buyPrice: '{{buyPrice}}'
        buyPricePreferred: '{{defaultBuyPrice}}'
        buyPriceHigh: '{{highBuyPrice}}'
        buyPriceRule: '{{buyRuleResult}}'
        buyPriceCalc: '{{buyPriceCalc}}'
        buyPriceForecast: '{{buyRuleAvgsDetail}}'
        buyBelow: '{{minSOCForBuy}}'
        buyBelowA: '{{minSOCForBuyA}}'
        buyBelowB: '{{minSOCForBuyB}}'
        sellPriceOverride: '{{overrideSellPrice}}'
        sellAboveOverride: '{{overrideSellSOC}}'
        sellPriceSolar: '{{solarSellPrice}}'
        sellAboveSolar: '{{solarSellSOC}}'
        sellPriceProtect: '{{todaysImportCostCentsPerKwh}}'
        buyPriceOverride: '{{overrideBuyPrice}}'
        buyBelowOverride: '{{overrideBuySOC}}'
        buyPriceAnytime: '{{buyAnytimePrice}}'
        buyBelowAnytime: '{{buyAnytimeSOCBelow}}'
        drainBatteryPrice: '{{drainBatteryPrice}}'
        drainBatterySOC: '{{drainBatterySOC}}'
        drainBatteryPlughole: '{{drainBatteryPlughole}}'
        buyReason: '{{buyReason}}'
        needy: '{{highConsumption}}'
        needSun: '{{needSun}}'
        needPower: '{{needPower}}'
      # the engine log text, as the engine would write it
      log: '{{ prettyMessage }}'
  alias: Decision
- stop: Decision made
  response_variable: result
