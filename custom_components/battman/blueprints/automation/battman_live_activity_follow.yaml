blueprint:
  name: Battman Live Activity – follow an entity
  author: Battman
  description: >-
    Turns the Live Activity switch on when an entity goes to one state and off once
    it has been in another state for a while. For example: on when the car's
    ignition turns ON, off once it's been OFF for 2 minutes, so a quick stop doesn't
    restart it.


    Which entity, which states and how long are Battman settings on the Battman
    dashboard (Settings → Live Activity). A blank entity means nothing is followed.
    Battman creates this automation for you. Installed and updated by the Battman
    integration.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    settings:
      name: Battman settings
      description: The sensor holding Battman's settings (its Live Activity ones among them).
      default: sensor.battman_parameters
      selector:
        entity:
          domain: sensor
    live_switch:
      name: On/off switch
      default: switch.battman_live_activity
      selector:
        entity:
          domain:
            - switch
            - input_boolean

mode: restart

trigger_variables:
  settings: !input settings

triggers:
  - trigger: template
    value_template: >-
      {% set e = (state_attr(settings, 'liveActivityFollow') or '') | trim %}
      {{ e != '' and states(e) == state_attr(settings, 'liveActivityFollowOn') }}
    id: "on"
  - trigger: template
    value_template: >-
      {% set e = (state_attr(settings, 'liveActivityFollow') or '') | trim %}
      {{ e != '' and states(e) == state_attr(settings, 'liveActivityFollowOff') }}
    for:
      minutes: "{{ state_attr(settings, 'liveActivityFollowDelay') | int }}"
    id: "off"

conditions:
  # coming back from unavailable/unknown isn't a real change (e.g. after a restart)
  - condition: template
    value_template: >-
      {{ trigger.from_state is none
         or trigger.from_state.state not in ['unavailable', 'unknown'] }}

actions:
  - action: "homeassistant.turn_{{ trigger.id }}"
    target:
      entity_id: !input live_switch
