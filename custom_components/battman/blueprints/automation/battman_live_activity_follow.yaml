blueprint:
  name: Battman Live Activity – follow an entity
  author: Battman
  description: >-
    Turns the Live Activity switch on when an entity goes to one state and off once
    it has been in another state for a while. For example: on when the car's
    ignition turns ON, off once it's been OFF for 2 minutes, so a quick stop doesn't
    restart it.


    Which entity, which states and how long are Battman settings on the Battman
    dashboard (Settings → Live Activity). A blank entity means nothing is followed.
    Battman creates this automation for you. Installed and updated by the Battman
    integration.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    follow_setting:
      name: Entity to follow (setting)
      default: text.battman_live_activity_follow
      selector:
        entity:
          domain: text
    on_setting:
      name: "'On' state (setting)"
      default: text.battman_live_activity_follow_on
      selector:
        entity:
          domain: text
    off_setting:
      name: "'Off' state (setting)"
      default: text.battman_live_activity_follow_off
      selector:
        entity:
          domain: text
    delay_setting:
      name: Off after, minutes (setting)
      default: number.battman_live_activity_follow_delay
      selector:
        entity:
          domain:
            - number
            - input_number
    live_switch:
      name: On/off switch
      default: switch.battman_live_activity
      selector:
        entity:
          domain:
            - switch
            - input_boolean

mode: restart

trigger_variables:
  follow_setting: !input follow_setting
  on_setting: !input on_setting
  off_setting: !input off_setting
  delay_setting: !input delay_setting

triggers:
  - trigger: template
    value_template: >-
      {% set e = states(follow_setting) | trim %}
      {{ e not in ['', 'unknown', 'unavailable'] and states(e) == states(on_setting) }}
    id: "on"
  - trigger: template
    value_template: >-
      {% set e = states(follow_setting) | trim %}
      {{ e not in ['', 'unknown', 'unavailable'] and states(e) == states(off_setting) }}
    for:
      minutes: "{{ states(delay_setting) | int }}"
    id: "off"

conditions:
  # coming back from unavailable/unknown isn't a real change (e.g. after a restart)
  - condition: template
    value_template: >-
      {{ trigger.from_state is none
         or trigger.from_state.state not in ['unavailable', 'unknown'] }}

actions:
  - action: "homeassistant.turn_{{ trigger.id }}"
    target:
      entity_id: !input live_switch
