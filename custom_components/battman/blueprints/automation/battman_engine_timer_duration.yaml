blueprint:
  name: Battman engine – override timer start
  description: Starts the override timer at 10 minutes when it's started from idle.
  domain: automation
  source_url: https://github.com/AJErazzor/battman
  input: {}
triggers:
- trigger: state
  entity_id:
  - timer.battman_override_timer
  from:
  - idle
  to:
  - active
actions:
- action: timer.change
  metadata: {}
  data:
    duration: '-11:50:00'
  target:
    entity_id: timer.battman_override_timer
mode: single
