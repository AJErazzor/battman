blueprint:
  name: Battman Live Activity – on/off
  author: Battman
  description: >-
    Shows the battery Live Activity while the switch is on and clears it when it's
    turned off. Restarts it every few hours while on (iOS ends a Live Activity after
    about 8 hours). The feed-in spike alert is its own automation (Battman Spike alert).


    Uses the script made from the "Battman Live Activity – push" blueprint. Battman
    creates this automation and that script for you; settings are on the Battman
    dashboard (Settings → Notifications). Installed and updated by the Battman integration.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    push_script:
      name: Push script
      description: The script made from "Battman Live Activity – push" (Battman creates it for you).
      default: script.battman_live_activity_push
      selector:
        entity:
          domain: script
    live_switch:
      name: On/off switch
      default: switch.battman_live_activity
      selector:
        entity:
          domain:
            - switch
            - input_boolean
    keep_alive_hours:
      name: Restart every (hours)
      description: iOS ends a Live Activity after about 8 hours. Not a dashboard setting on purpose.
      default: 7
      selector:
        number:
          min: 1
          max: 8
          unit_of_measurement: h

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input live_switch
    to: "on"
    id: "on"
  - trigger: state
    entity_id: !input live_switch
    to: "off"
    id: "off"
  - trigger: state
    entity_id: !input live_switch
    to: "on"
    for:
      hours: !input keep_alive_hours
    id: keep_alive

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "on"
        sequence:
          - action: script.turn_on
            target:
              entity_id: !input push_script
            data:
              variables:
                alert: false
      - conditions:
          - condition: trigger
            id: "off"
        sequence:
          - action: script.turn_on
            target:
              entity_id: !input push_script
            data:
              variables:
                clear: true
      - conditions:
          - condition: trigger
            id: keep_alive
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input live_switch
          - delay:
              seconds: 5
          - action: homeassistant.turn_on
            target:
              entity_id: !input live_switch
