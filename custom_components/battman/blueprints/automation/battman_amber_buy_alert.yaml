blueprint:
  name: Battman Amber – cheap price alert
  author: Battman
  description: >-
    Sends a notification when the live buy price drops below the alert threshold, with
    buttons to charge the battery for 5 or 10 minutes. Skipped while the battery is already charging.


    Battman creates this automation for you; settings are on the Battman dashboard
    (Settings → Notifications). Installed and updated by the Battman integration.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    buy_price:
      name: Buy price ($/kWh)
      default: sensor.amber_5min_current_general_price
      selector:
        entity:
          domain: sensor
    battery_soc:
      name: Battery state of charge (%)
      default: sensor.sigen_plant_battery_state_of_charge
      selector:
        entity:
          domain: sensor
    battery_mode:
      name: Battery mode
      default: [[map:mode]]
      selector:
        entity:
          domain: input_select
    settings:
      name: Battman settings
      description: The sensor holding Battman's settings (the alert ones among them).
      default: [[map:parameters]]
      selector:
        entity:
          domain: sensor

mode: single

trigger_variables:
  buy_price: !input buy_price
  settings: !input settings

triggers:
  - trigger: template
    value_template: >-
      {% set limit = state_attr(settings, 'amberBuyAlertThreshold') %}
      {{ has_value(buy_price) and limit is number and states(buy_price) | float * 100 < limit }}

conditions:
  - condition: template
    value_template: "{{ state_attr(settings, 'amberBuyAlert') | bool(false) }}"
  - condition: template
    value_template: "{{ (state_attr(settings, 'alertNotifyTarget') or '') | trim | length > 0 }}"
  - condition: template
    value_template: "{{ states(mode_e) != 'Charge' }}"

variables:
  settings: !input settings
  soc_e: !input battery_soc
  mode_e: !input battery_mode
  buy_e: !input buy_price

actions:
  - action: "notify.{{ state_attr(settings, 'alertNotifyTarget') | trim }}"
    data:
      title: "⚡ Cheap Power"
      message: >-
        Buy {{ (states(buy_e) | float(0) * 100) | round(1) }}c · SOC {{ states(soc_e) | float(0) | round(0) }}% · Charge battery?
      data:
        actions:
          - action: AMBER_CHARGE_5
            title: 5 min
          - action: AMBER_CHARGE_10
            title: 10 min
