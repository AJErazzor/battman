# Battman managed dashboard view: History (from the Smiggles History view).
# Edit like any dashboard YAML. Files in this folder become views, in filename order.
# Grid is Battman's grid power sensor (kW, + import / - export), so its line starts from
# v0.17.0; the Log page's grid graph is worked out from the Sigen import / export history.
type: sections
title: History
path: history
icon: mdi:history
show_icon_and_title: true
max_columns: 4
theme: Battman Coffee
header:
  card:
    type: markdown
    text_only: true
    content: |
      # Battman History
badges:
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: '{{battery_soc}}'
    name: SOC
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: '{{buy_price}}'
    name: Buy
    show_entity_picture: false
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    entity: '{{feed_in_price}}'
    name: FIT
sections:
  - type: grid
    column_span: 4
    cards:
      - type: history-graph
        hours_to_show: 5
        entities:
          - entity: '{{mode}}'
            name: Mode
          - entity: '{{buy_price}}'
            name: Buy Price
          - entity: '{{feed_in_price}}'
            name: Sell Price
          - entity: '{{battery_soc}}'
            name: SOC
          - entity: '{{grid_power}}'
            name: Grid
          - entity: '{{home_power}}'
            name: Home
          - entity: '{{battery_power}}'
            name: Battery
          - entity: '{{load_30m}}'
            name: Load
          - entity: '{{pv_power}}'
            name: Solar
        grid_options:
          columns: 48
          rows: 12
