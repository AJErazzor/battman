# Battman dashboard view: Help (Battman's built-in guide)
# Edit like any dashboard YAML. Files in this folder become views, in filename order.
# Create help view (on the Battman device) adds this view to a Battman dashboard that hasn't got one.
type: panel
path: help
title: Help
icon: mdi:help-circle-outline
show_icon_and_title: true
theme: Battman Nord
cards:
  - type: custom:battman-guide
