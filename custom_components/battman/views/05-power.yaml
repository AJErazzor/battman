# Battman dashboard view: Power. Built from Battman cards (custom:battman-<id>),
# added one at a time as they move over from Smiggles.
# Edit like any dashboard YAML. Files in this folder become views, in filename order.
#
# Layout follows the Smiggles Power view. Each card goes in its original section and
# position as it moves over:
#   Section 1: (power-flow: stays yours) · battery mode stack · state · profitloss · overrides
#   Section 2 (2 columns wide): amber5minpricegrid · limits · amber24hourforecasttable
#   Section 3: gauges · (PV chart, solar forecast: left out for now) · nemmix (generation and demand mix)
type: sections
title: Power
path: power
icon: mdi:sofa
show_icon_and_title: true
max_columns: 4
theme: Battman Nord
# Heading: the strip with tagline on wide screens, the wordmark with tagline on phones
# (same 768 px line as HA's Mobile visibility).
header:
  card:
    type: vertical-stack
    cards:
      - type: custom:battman-image
        image: battman-strip-tagline.webp
        background: none
        frame: false
        height: 100
        visibility:
          - condition: screen
            media_query: '(min-width: 768px)'
      - type: custom:battman-image
        visibility:
          - condition: screen
            media_query: '(max-width: 767px)'
        image: battman-wordmark-tagline.webp
        background: none
        frame: false
        height: 60
sections:
  - type: grid
    cards:
      - type: custom:battman-batterymode
      - type: custom:battman-state
      - type: custom:battman-profitloss
      - type: custom:battman-overrides
  - type: grid
    column_span: 2
    cards:
      - type: custom:battman-amber5minpricegrid
      - type: custom:battman-limits
      - type: custom:battman-amber24hourforecasttable
  - type: grid
    cards:
      - type: custom:battman-gauges
      - type: custom:battman-nemmix
