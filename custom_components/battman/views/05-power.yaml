# Battman managed dashboard view: Power. Built from Battman cards (custom:battman-<id>),
# added one at a time as they move over from Smiggles.
# Edit like any dashboard YAML. Files in this folder become views, in filename order.
type: sections
title: Power
path: power
icon: mdi:sofa
show_icon_and_title: true
max_columns: 4
theme: Battman Nord
sections:
  - type: grid
    cards:
      - type: custom:battman-limits
