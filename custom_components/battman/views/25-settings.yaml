              const prettyNotify = function(svc){ if (svc.indexOf('mobile_app_')===0){ var k=svc.slice(11); return devMap[k] || titleCase(k); } return titleCase(svc); };
              const problem = function(id){ var p = states[id].attributes.problem; return p ? `<div class="desc" style="color:var(--battman-red)">⚠ ${esc(p)}</div>` : ''; };

              const swOn = states[ID.sw].state === 'on';
              const swHtml = `<ha-switch ontouchstart="event.stopPropagation()" ${swOn?'checked':''} onclick="event.stopPropagation();${H}.callService('switch','toggle',{entity_id:'${ID.sw}'})"></ha-switch>`;

              const ph = states[ID.phone];
              const phoneOpts = (ph.attributes.options || []).map(function(o){
                var label = o === 'Off' ? '— Off —' : prettyNotify(o) + (o === ph.state && ph.attributes.problem ? ' (not found)' : '');
                return `<option value="${esc(o)}"${o === ph.state ? ' selected' : ''}>${esc(label)}</option>`; }).join('');
              const phoneHtml = `<select ${stop} onchange="${H}.callService('select','select_option',{entity_id:'${ID.phone}',option:this.value})">${phoneOpts}</select>`;

              const textField = function(id, width){ return `<div class="field" style="width:${width}px;min-width:${width}px;max-width:55%"><input type="text" value="${esc(states[id].state)}" ${stop} onchange="${H}.callService('text','set_value',{entity_id:'${id}',value:this.value})" style="text-align:left"></div>`; };
              const numField = function(id, step, sfx){ return `<div class="field"><input type="text" inputmode="decimal" value="${esc(states[id].state)}" ${stop} onchange="${H}.callService('number','set_value',{entity_id:'${id}',value:this.value})"><span class="sfx">${sfx}</span></div>`; };

              const f = (states[ID.follow].state || '').trim();
              const fe = f ? states[f] : null;
              const followNow = !f ? 'Blank = not following anything (use the switch)'
                : fe ? `Now: ${esc((fe.attributes && fe.attributes.friendly_name) || f)} is ${esc(fe.state)}` : '';

              const made = ['script.battman_live_activity_push','automation.battman_live_activity_on_off','automation.battman_live_activity_updates','automation.battman_live_activity_follow'];
              const notMade = made.filter(function(id){ return !states[id]; });
              const madeDesc = notMade.length
                ? `<span style="color:var(--battman-red)">Not found: ${esc(notMade.join(', '))} (deleted or renamed)</span>`
                : 'The script and 3 automations Battman made are all there';

              return `<div class="pad">
                ${head}
                <div class="note">Your battery on your phone's lock screen. Pick a phone, then switch it on, or let it follow something like your car's ignition.</div>
                <div class="rows">
                  <div class="row"><div class="lbl"><div class="name">Live Activity</div><div class="desc">On shows it, off clears it</div></div>${swHtml}</div>
                  <div class="row"><div class="lbl"><div class="name">Phone</div><div class="desc">Which HA notify service gets it (Off sends nothing)</div>${problem(ID.phone)}</div>${phoneHtml}</div>
                  <div class="subdiv">Follow an entity</div>
                  <div class="row"><div class="lbl"><div class="name">Entity</div><div class="desc">${followNow}</div>${problem(ID.follow)}</div>${textField(ID.follow, 220)}</div>
                  <div class="row"><div class="lbl"><div class="name">On when it becomes</div></div>${textField(ID.on, 130)}</div>
                  <div class="row"><div class="lbl"><div class="name">Off when it becomes</div><div class="desc">…and has stayed that way for the time below</div></div>${textField(ID.off, 130)}</div>
                  <div class="row"><div class="lbl"><div class="name">Off after</div><div class="desc">So a quick stop doesn't restart it</div></div>${numField(ID.delay, 1, 'min')}</div>
                  <div class="subdiv">Alerts</div>
                  <div class="row"><div class="lbl"><div class="name">Feed-in spike alert</div><div class="desc">Push with a sound when feed-in rises above this</div></div>${numField(ID.spike, 0.01, '$/kWh')}</div>
                  <div class="subdiv">Automations</div>
                  <div class="row"><div class="lbl"><div class="name">Battman's automations</div><div class="desc">${madeDesc}</div></div><button class="rst" ${stop.replace('onclick="event.stopPropagation()"','')} onclick="event.stopPropagation();${H}.callService('battman','create_live_activity',{})">Create missing</button></div>
                </div>
              </div>`;
            ]]]
