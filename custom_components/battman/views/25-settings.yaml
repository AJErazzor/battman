          space-between; gap: 10px; padding: 7px 14px; background:
          var(--battman-surface-popup);
          border-bottom: 1px solid
          var(--battman-border-neutral); }

          .def-label { font-size: 12px; color:
          var(--battman-text-muted); flex: 1; }

          .def-ctrl  { display: flex; align-items: center; gap: 5px;
          flex-shrink: 0; }

          .def-ctrl input { width: 64px; font-size: 12px; padding: 4px 7px;
          background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); text-align:
          right; -moz-appearance: textfield; }

          .def-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none;
          }

          .def-unit  { font-size: 11px; color:
          var(--battman-text-muted); opacity: 0.6;
          }

          .def-head  { grid-column: 1/-1; background:
          var(--battman-surface-card); padding:
          6px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
          text-transform: uppercase; color:
          var(--battman-text-muted); border-bottom:
          1px solid var(--battman-border-neutral);
          opacity: 0.7; }

          .pad { padding-bottom: 12px; }

          ha-switch { flex-shrink: 0; width: 55px; min-width: 55px; display:
          block; touch-action: manipulation;
          --ha-switch-checked-background-color:
          var(--battman-green-border-strong);
          --ha-switch-checked-border-color:
          var(--battman-green-border-strong);
          --ha-switch-checked-thumb-background-color:
          var(--battman-green); }
        custom_fields:
          content: |
            [[[
              const sra       = entity.attributes;
              const curHour = new Date().getHours();
              const lastSel = parseInt(localStorage.getItem('buyHourSel') || '0');
              const userPicked = (Date.now() - lastSel) < 30000;
              const h = userPicked ? parseInt(sra.selected_hour ?? curHour) : curHour;
              const rule      = (sra.rules || [])[h] || {};
              const srEnabled = entity.state === 'True' || entity.state === 'true';
              const hourNames = ['12am','1am','2am','3am','4am','5am','6am','7am','8am',
                                 '9am','10am','11am','12pm','1pm','2pm','3pm','4pm','5pm',
                                 '6pm','7pm','8pm','9pm','10pm','11pm'];

              // Toggle → fires {{buy_rules_event}} state
              function swSR(attr, val) {
                return `<ha-switch ontouchstart="event.stopPropagation()" ${val?'checked':''} onclick="event.stopPropagation();document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'${attr}',value:${val?'false':'true'}}})"></ha-switch>`;
              }

              // Toggle → fires rule item for the currently selected hour
              function swRule(item, val) {
                return `<ha-switch ontouchstart="event.stopPropagation()" ${val?'checked':''} onclick="event.stopPropagation();document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'rules',hour:${h},item:'${item}',value:${val?'false':'true'}}})"></ha-switch>`;
              }

              // Number input → fires rule item for the currently selected hour
              function numRule(item, val, sfx) {
                return `<div class="field"><input type="text" inputmode="decimal" value="${val}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onchange="(function(el){document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'rules',hour:${h},item:'${item}',value:parseFloat(el.value)||el.value}})})(this)"><span class="sfx">${sfx}</span></div>`;
              }

              // No dynamic chip rebuild — preview updates on Apply only
              // Avoids quote-escaping hell in HTML onchange attributes

              // Default preview chips (4h from current hour)
              const defChips = Array.from({length:4},(_,i)=>{
                const hr=(h+i)%24; const ahead=4-i;
                return `<div style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--battman-green-soft-bg);border:1px solid var(--battman-green-border-light);border-radius:6px;margin:0 4px 4px 0;"><span style="font-size:12px;color:var(--battman-text-muted);">${hourNames[hr]}</span><span style="font-size:10px;color:var(--battman-green);opacity:0.6;">→</span><span style="font-size:11px;color:var(--battman-green);font-weight:700;">${ahead}h</span></div>`;
              }).join('');

              return `<div class="pad">
                <div class="glabel">
                  <div class="glabel-left"><ha-icon icon="mdi:lightning-bolt"></ha-icon>Buy rules</div>
                </div>
                <div class="note">Fine-grained control over the buy price target each hour. Select an hour then configure its rule or apply a cascade.</div>

                <div class="rows">
                  <!-- state: master switch for all buy rule processing -->
                  <div class="row"><div class="lbl"><div class="name">Buy rules enabled</div><div class="desc">Master switch for all buy rule processing</div></div>${swSR('state', srEnabled)}</div>
                  <!-- selected_hour: which hour is shown below -->
                  <div class="row">
                    <div class="lbl"><div class="name">Hour</div><div class="desc">Select hour to configure</div></div>
                    <div class="hpick">
                      <button ontouchstart="event.stopPropagation()" class="hbtn" onclick="event.stopPropagation();localStorage.setItem('buyHourSel',Date.now());document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'selected_hour',value:${(h+23)%24}}})">&#8249;</button>
                      <div class="hval">${h}</div>
                      <button ontouchstart="event.stopPropagation()" class="hbtn" onclick="event.stopPropagation();localStorage.setItem('buyHourSel',Date.now());document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'selected_hour',value:${(h+1)%24}}})">&#8250;</button>
                    </div>
                  </div>
                </div>

                <!-- Mode toggle: Single hour vs Cascade -->
                <div style="display:flex;gap:2px;margin:16px 16px 0;background:var(--battman-surface-popup);border-radius:6px;padding:3px;border:1px solid var(--battman-border-neutral);">
                  <button ontouchstart="event.stopPropagation()" onclick="event.stopPropagation();this.closest('.pad').querySelector('.single-panel').style.display='';this.closest('.pad').querySelector('.cascade-panel').style.display='none';this.style.background='var(--battman-green-border-strong)';this.style.color='white';this.nextElementSibling.style.background='transparent';this.nextElementSibling.style.color='var(--battman-text-muted)';"
                    style="flex:1;padding:7px 0;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--battman-font);background:var(--battman-green-border-strong);color:white;letter-spacing:0.02em;">Single hour</button>
                  <button ontouchstart="event.stopPropagation()" onclick="event.stopPropagation();this.closest('.pad').querySelector('.cascade-panel').style.display='';this.closest('.pad').querySelector('.single-panel').style.display='none';this.style.background='var(--battman-green-border-strong)';this.style.color='white';this.previousElementSibling.style.background='transparent';this.previousElementSibling.style.color='var(--battman-text-muted)';"
                    style="flex:1;padding:7px 0;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--battman-font);background:transparent;color:var(--battman-text-muted);letter-spacing:0.02em;">⚡ Cascade</button>
                </div>

                <!-- ── SINGLE HOUR PANEL ── -->
                <div class="single-panel">
                  <div class="subdiv" style="margin-top:10px;">Hour ${h} settings</div>
                  <div class="rows" style="border-top:none;">
                    <!-- isActive: whether this hour's rule is enabled -->
                    <div class="row"><div class="lbl"><div class="name">Active</div><div class="desc">Enable this rule for hour ${h}</div></div>${swRule('isActive', rule.isActive)}</div>
                    <!-- hours_ahead: how many hours of future prices to consider -->
                    <div class="row"><div class="lbl"><div class="name">Look ahead</div><div class="desc">Hours of future prices to consider</div></div>${numRule('hours_ahead', rule.hours_ahead??3, 'hrs')}</div>
                    <!-- grouping_minutes: interval for grouping dispatch windows -->
                    <div class="row"><div class="lbl"><div class="name">Grouping</div><div class="desc">Interval for grouping dispatch windows</div></div>${numRule('grouping_minutes', rule.grouping_minutes??60, 'min')}</div>
                    <!-- roundTo: decimal places for price target -->
                    <div class="row"><div class="lbl"><div class="name">Round to</div><div class="desc">Decimal places for price target</div></div>${numRule('roundTo', rule.roundTo??2, 'places')}</div>
                    <!-- roundtype: direction to round the price target (none/floor/ceil) -->
                    <div class="row"><div class="lbl"><div class="name">Round type</div><div class="desc">Direction to round the price target</div></div>
                      <select onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onchange="(function(el){document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'rules',hour:${h},item:'roundtype',value:el.value}})})(this)">
                        <option value="none"  ${(rule.roundtype||'none')==='none' ?'selected':''}>None</option>
                        <option value="floor" ${rule.roundtype==='floor'?'selected':''}>Down (floor)</option>
                        <option value="ceil"  ${rule.roundtype==='ceil' ?'selected':''}>Up (ceil)</option>
                      </select>
                    </div>
                    <!-- offset: fixed c/kWh adjustment added to price target -->
                    <div class="row"><div class="lbl"><div class="name">Offset by</div><div class="desc">Fixed adjustment added to price target</div></div>${numRule('offset', rule.offset??0, 'c/kWh')}</div>
                  </div>
                </div>

                <!-- ── CASCADE PANEL ── -->
                <!-- Sets isActive=true and hours_ahead=N..1 across consecutive hours.
                     Stops before 0 — hours_ahead >= 1 only. Other settings preserved. -->
                <div class="cascade-panel" style="display:none;">
                  <div style="font-size:12px;color:var(--battman-text-muted);line-height:1.5;padding:12px 16px 0;">
                    Set a start hour and max look-ahead. Each subsequent hour gets a decreasing look-ahead — stops before 0, preserving all other rule settings.
                  </div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 0;">
                    <div>
                      <div style="font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--battman-text-muted);margin-bottom:6px;">Start hour</div>
                      <select class="cas-start" style="width:100%;" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" >
                        ${hourNames.map((l,i)=>`<option value="${i}" ${i===h?'selected':''}>${l}</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <div style="font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--battman-text-muted);margin-bottom:6px;">Max look-ahead</div>
                      <div class="field" style="width:100%;max-width:none;">
                        <input type="text" inputmode="decimal" class="cas-la" value="4" min="1" max="12" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                        <span class="sfx">hrs</span>
                      </div>
                    </div>
                  </div>
                  <div style="padding:10px 16px 0;">
                    <div style="font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--battman-text-muted);margin-bottom:8px;">Preview</div>
                    <div class="cas-chips" style="display:flex;flex-wrap:wrap;min-height:34px;">${defChips}</div>
                  </div>
                  <div style="padding:12px 16px;">
                    <button ontouchstart="event.stopPropagation()" class="cas-apply" onclick="event.stopPropagation();var panel=this.closest('.cascade-panel');var start=parseInt(panel.querySelector('.cas-start').value);var la=Math.max(1,parseInt(panel.querySelector('.cas-la').value)||1);var hass=document.querySelector('home-assistant').hass;for(var i=0;i<la;i++){var hr=(start+i)%24;var ahead=la-i;hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'rules',hour:hr,item:'isActive',value:true}});hass.connection.sendMessage({type:'fire_event',event_type:'{{buy_rules_event}}',event_data:{attribute:'rules',hour:hr,item:'hours_ahead',value:ahead}});}var btn=this;btn.textContent='Applied';btn.style.background='var(--battman-green)';setTimeout(function(){btn.textContent='Apply cascade';btn.style.background='var(--battman-green-border-strong)';},2000);"
                      style="width:100%;padding:10px;border:none;border-radius:6px;background:var(--battman-green-border-strong);color:white;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--battman-font);transition:background 0.2s;">
                      Apply cascade
                    </button>
                  </div>
                </div>

              </div>`;
            ]]]
      - type: custom:button-card
        entity: '{{parameters}}'
        show_icon: false
        show_state: false
        show_name: false
        tap_action:
          action: none
        hold_action:
          action: none
        styles:
          card:
            - padding: 0
            - box-shadow: none
            - border-radius: var(--ha-card-border-radius, 8px)
            - background: var(--battman-surface-card)
            - border: 1px solid var(--battman-border-neutral)
            - pointer-events: none
          custom_fields:
            content:
              - pointer-events: all
              - width: 100%
              - display: block
              - text-align: left
        extra_styles: >
          * { box-sizing: border-box; margin: 0; padding: 0; }

          .glabel      { display: flex; align-items: center; justify-content:
          space-between; font-size: 15px; font-weight: 600; padding: 16px 16px
          0; gap: 8px; letter-spacing: 0.01em; }

          .glabel-left { display: flex; align-items: center; gap: 7px; }

          .glabel ha-icon { --mdc-icon-size: 18px; color:
          var(--battman-green); flex-shrink: 0; }

          .note { font-size: 12px; line-height: 1.5; color:
          var(--battman-green); background:
          var(--battman-green-soft-bg); border: 1px solid
          var(--battman-green-border); border-radius:
          var(--ha-card-border-radius,8px); padding: 9px 12px; margin: 10px 16px
          0; white-space: normal; word-break: break-word; }

          .rows           { margin-top: 10px; border-top: 1px solid
          var(--battman-border-neutral); }

          .row            { display: flex; align-items: center; gap: 16px;
          padding: 14px 16px; border-bottom: 1px solid
          var(--battman-border-neutral); min-width: 0;
          min-height: 52px; }

          .row:last-child { border-bottom: none; }

          .lbl            { flex: 1; min-width: 0; white-space: normal; }

          .name           { font-size: 14px; font-weight: 500; word-break:
          break-word; }

          .desc           { font-size: 12px; color:
          var(--battman-text-muted); margin-top:
          2px; line-height: 1.3; word-break: break-word; overflow: hidden; }

          .subdiv { font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
          text-transform: uppercase; color:
          var(--battman-text-muted); background:
          var(--battman-surface-popup);
          padding: 6px 16px; border-bottom: 1px solid
          var(--battman-border-neutral); border-top: 1px
          solid var(--battman-border-neutral); }

          .field            { margin-top: 1px; display: inline-flex;
          align-items: center; width: 130px; min-width: 130px; max-width: 130px;
          background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; overflow: hidden; flex-shrink: 0; min-height:
          40px; }

          .field input      { background: transparent; border: none; outline:
          none; color: var(--battman-text-bright);
          font-size: 14px; font-family: var(--battman-font); padding: 6px 8px;
          flex: 1; min-width: 0; text-align: right; -moz-appearance: textfield;
          touch-action: manipulation; }

          .field input::-webkit-inner-spin-button { -webkit-appearance: none; }

          .field .sfx       { font-size: 12px; color:
          var(--battman-text-muted); padding: 0 8px
          0 2px; white-space: nowrap; flex-shrink: 0; }

          .field:focus-within { border-color:
          var(--battman-green); }

          input[type=time], input[type=date] { background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); font-size:
          14px; font-family: var(--battman-font); padding: 6px 8px; width:
          130px; min-width: 130px; max-width: 130px; flex-shrink: 0; text-align:
          right; min-height: 40px; box-sizing: border-box; }

          input[type=time]:focus, input[type=date]:focus { outline: none;
          border-color: var(--battman-green); }

          input[type=time]::-webkit-calendar-picker-indicator,
          input[type=date]::-webkit-calendar-picker-indicator { display: none; }

          select       { background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); font-size:
          14px; font-family: var(--battman-font); padding: 6px 10px; width:
          130px; appearance: none; cursor: pointer; flex-shrink: 0; min-height:
          40px; box-sizing: border-box; }

          select:focus { outline: none; border-color:
          var(--battman-green); }

          button.rst       { background:
          var(--battman-green-soft-bg); border: 1px solid
          var(--battman-border-neutral); border-radius:
          4px; color: var(--battman-text-muted);
          font-size: 12px; font-family: var(--battman-font); padding: 4px 10px;
          cursor: pointer; flex-shrink: 0; }

          button.rst:hover { border-color:
          var(--battman-green); color:
          var(--battman-green); }

          .hpick       { display: flex; align-items: center; gap: 4px;
          flex-shrink: 0; }

          .hbtn        { width: 40px; height: 40px; background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-muted); font-size:
          18px; cursor: pointer; display: flex; align-items: center;
          justify-content: center; padding: 0; flex-shrink: 0; }

          .hbtn:hover  { border-color:
          var(--battman-green); color:
          var(--battman-green); }

          .hval        { min-width: 36px; text-align: center; font-size: 14px;
          padding: 5px 8px; background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); min-height:
          40px; box-sizing: border-box; display: flex; align-items: center;
          justify-content: center; }

          .qdaily { font-size: 11px; color:
          var(--battman-text-muted); margin-top:
          2px; }

          .def-row  { display: flex; align-items: center; justify-content:
          space-between; gap: 10px; padding: 7px 14px; background:
          var(--battman-surface-popup);
          border-bottom: 1px solid
          var(--battman-border-neutral); }

          .def-label { font-size: 12px; color:
          var(--battman-text-muted); flex: 1; }

          .def-ctrl  { display: flex; align-items: center; gap: 5px;
          flex-shrink: 0; }

          .def-ctrl input { width: 64px; font-size: 12px; padding: 4px 7px;
          background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); text-align:
          right; -moz-appearance: textfield; }

          .def-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none;
          }

          .def-unit  { font-size: 11px; color:
          var(--battman-text-muted); opacity: 0.6;
          }

          .def-head  { grid-column: 1/-1; background:
          var(--battman-surface-card); padding:
          6px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
          text-transform: uppercase; color:
          var(--battman-text-muted); border-bottom:
          1px solid var(--battman-border-neutral);
          opacity: 0.7; }

          .pad { padding-bottom: 12px; }

          ha-switch { flex-shrink: 0; width: 55px; min-width: 55px; display:
          block; touch-action: manipulation;
          --ha-switch-checked-background-color:
          var(--battman-green-border-strong);
          --ha-switch-checked-border-color:
          var(--battman-green-border-strong);
          --ha-switch-checked-thumb-background-color:
          var(--battman-green); }
        custom_fields:
          content: |
            [[[
              const p = entity.attributes;

              function numField(attr, val, sfx, min, max) {
                const minAttr  = min != null ? ` min="${min}"` : '';
                const maxAttr  = max != null ? ` max="${max}"` : '';
                const onChange = `(function(el){var v=parseFloat(el.value)||el.value;${min!=null?`if(v<${min})v=${min};`:''}${max!=null?`if(v>${max})v=${max};`:''}el.value=v;document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{parameters_update_event}}',event_data:{action:'SetAttribute','${attr}':v}})})(this)`;
                return `<div class="field"><input type="text" inputmode="decimal"${minAttr}${maxAttr} value="${val}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onchange="${onChange}"><span class="sfx">${sfx}</span></div>`;
              }

              function rstBtn(section) {
                const defs  = (p.defaults || {})[section] || {};
                const pairs = Object.entries(defs).map(e => `['${e[0]}',${e[1]}]`).join(',');
                return `<button class="rst" onclick="event.stopPropagation();[${pairs}].forEach(function(x){document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{parameters_update_event}}',event_data:{action:'SetAttribute',[x[0]]:x[1]}})})">&#8635; Reset</button>`;
              }

              return `<div class="pad">
                <div class="glabel">
                  <div class="glabel-left"><ha-icon icon="mdi:hand-extended"></ha-icon>Needy curve triggers</div>
                  ${rstBtn('needyCurve')}
                </div>
                <div class="note">Activates a more aggressive charging curve when the house is consuming a lot or solar will not fill the battery before sunset.</div>
                <div class="rows">
                  <!-- needyTriggerPVGap: remaining solar kWh needed to fill battery -->
                  <div class="row"><div class="lbl"><div class="name">PV to full battery gap</div><div class="desc">Remaining solar needed to fill the battery</div></div>${numField('needyTriggerPVGap', p.needyTriggerPVGap??3, 'kWh')}</div>
                  <!-- needyTriggerConsumption: house consumption kW above which needy curve activates -->
                  <div class="row"><div class="lbl"><div class="name">House power above</div><div class="desc">Consumption threshold to trigger needy curve</div></div>${numField('needyTriggerConsumption', p.needyTriggerConsumption??3.5, 'kW')}</div>
                </div>
              </div>`;
            ]]]
