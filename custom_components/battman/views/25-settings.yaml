          .hpick       { display: flex; align-items: center; gap: 4px;
          flex-shrink: 0; }

          .hbtn        { width: 40px; height: 40px; background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-muted); font-size:
          18px; cursor: pointer; display: flex; align-items: center;
          justify-content: center; padding: 0; flex-shrink: 0; }

          .hbtn:hover  { border-color:
          var(--battman-green); color:
          var(--battman-green); }

          .hval        { min-width: 36px; text-align: center; font-size: 14px;
          padding: 5px 8px; background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); min-height:
          40px; box-sizing: border-box; display: flex; align-items: center;
          justify-content: center; }

          .qdaily { font-size: 11px; color:
          var(--battman-text-muted); margin-top:
          2px; }

          .def-row  { display: flex; align-items: center; justify-content:
          space-between; gap: 10px; padding: 7px 14px; background:
          var(--battman-surface-popup);
          border-bottom: 1px solid
          var(--battman-border-neutral); }

          .def-label { font-size: 12px; color:
          var(--battman-text-muted); flex: 1; }

          .def-ctrl  { display: flex; align-items: center; gap: 5px;
          flex-shrink: 0; }

          .def-ctrl input { width: 64px; font-size: 12px; padding: 4px 7px;
          background:
          var(--battman-surface-popup);
          border: 1px solid var(--battman-border-neutral);
          border-radius: 4px; color:
          var(--battman-text-bright); text-align:
          right; -moz-appearance: textfield; }

          .def-ctrl input::-webkit-inner-spin-button { -webkit-appearance: none;
          }

          .def-unit  { font-size: 11px; color:
          var(--battman-text-muted); opacity: 0.6;
          }

          .def-head  { grid-column: 1/-1; background:
          var(--battman-surface-card); padding:
          6px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
          text-transform: uppercase; color:
          var(--battman-text-muted); border-bottom:
          1px solid var(--battman-border-neutral);
          opacity: 0.7; }

          .pad { padding-bottom: 12px; }

          ha-switch { flex-shrink: 0; width: 55px; min-width: 55px; display:
          block; touch-action: manipulation;
          --ha-switch-checked-background-color:
          var(--battman-green-border-strong);
          --ha-switch-checked-border-color:
          var(--battman-green-border-strong);
          --ha-switch-checked-thumb-background-color:
          var(--battman-green); }
        custom_fields:
          content: |
            [[[
              const p  = entity.attributes;
              const dg = (p.defaults || {}).gridChargingPositive || {};
              const dd = (p.defaults || {}).gridDischarging      || {};
              const ds = (p.defaults || {}).spikeSelling         || {};
              const dn = (p.defaults || {}).needyCurve           || {};
              const dw = (p.defaults || {}).watchdog             || {};
              const db = (p.defaults || {}).billing              || {};

              const isOpen = localStorage.getItem('resetDefaultsOpen') === '1';

              function defRow(label, val, unit, last) {
                const border = last ? '' : 'border-bottom:1px solid var(--battman-border-neutral);';
                return `<div class="def-row" style="${border}">
                  <span class="def-label">${label}</span>
                  <div class="def-ctrl">
                    <input type="text" inputmode="decimal" value="${val}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                    <span class="def-unit">${unit}</span>
                  </div>
                </div>`;
              }

              function defHead(label) {
                return `<div class="def-head">${label}</div>`;
              }

              return `<div class="resetdefs">
                <div ontouchstart="event.stopPropagation()" onclick="event.stopPropagation();var box=this.nextElementSibling;var open=box.style.display!=='none';box.style.display=open?'none':'';localStorage.setItem('resetDefaultsOpen',open?'0':'1');this.querySelector('.chev').style.transform=open?'rotate(0deg)':'rotate(90deg)';"
                     style="display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 10px;padding:12px 16px;font-size:13px;font-weight:500;color:var(--battman-text-muted);cursor:pointer;user-select:none;min-width:0;">
                  <span style="flex-shrink:0;">&#9881; Reset defaults</span>
                  <span style="font-size:12px;font-weight:400;opacity:0.4;flex:1;min-width:120px;white-space:normal;overflow-wrap:break-word;">&#8212; edit the values each &#8635; Reset button restores</span>
                  <span class="chev" style="margin-left:auto;font-size:16px;flex-shrink:0;transition:transform 0.15s;transform:rotate(${isOpen ? 90 : 0}deg);">&#8250;</span>
                </div>
                <div class="resetdefs-body" style="display:${isOpen ? '' : 'none'};">
                  <div style="display:grid;grid-template-columns:1fr;gap:1px;background:var(--battman-border-neutral);border-top:1px solid var(--battman-border-neutral);">
                    ${defHead('Grid charging (+ve)')}
                    ${defRow('Prorate price SOC offset', dg.buyProrateSOCOffset??1,  '%')}
                    ${defRow('High price SOC offset',    dg.buyHighSOCOffset??10,    '%', true)}
                    ${defHead('Grid discharging')}
                    ${defRow('Prorate price SOC offset', dd.sellProrateSOCOffset??30, '%')}
                    ${defRow('Low price SOC offset',     dd.sellLowSOCOffset??50,     '%', true)}
                    ${defHead('Spike selling')}
                    ${defRow('Spike sell price 1', ds.sellSpikePrice1??500, 'c/kWh')}
                    ${defRow('Sell above SOC 1',   ds.sellSpikeSOC1??10,   '%')}
                    ${defRow('Spike sell price 2', ds.sellSpikePrice2??100, 'c/kWh')}
                    ${defRow('Sell above SOC 2',   ds.sellSpikeSOC2??15,   '%', true)}
                    ${defHead('Needy curve')}
                    ${defRow('PV to full battery gap', dn.needyTriggerPVGap??3,         'kWh')}
                    ${defRow('House power above',      dn.needyTriggerConsumption??3.5, 'kW', true)}
                    ${defHead('Watchdog')}
                    ${defRow('Script not run limit',  dw.watchdogScriptNotRunLimit??10,    'min')}
                    ${defRow('Script disabled limit', dw.watchdogScriptDisabledLimit??10,  'min', true)}
                    ${defHead('Billing')}
                    ${defRow('Daily network charge', db.dailyNetworkCharge??1.09, '$')}
                    ${defRow('Bill day of month',    db.billDayOfMonth??2,        'day', true)}
                  </div>
                  <div style="padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--battman-border-neutral);">
                    <span style="font-size:11px;color:var(--battman-text-muted);opacity:0.5;flex:1 1 200px;min-width:0;overflow-wrap:break-word;">Saved to {{parameters}}</span>
                    <div style="display:flex;gap:8px;flex-shrink:0;margin-left:auto;">
                      <button style="background:transparent;border:1px solid var(--battman-border-neutral);border-radius:4px;color:var(--battman-text-muted);font-size:12px;padding:6px 14px;cursor:pointer;" onclick="event.stopPropagation();var root=this.closest('.resetdefs');root.querySelector('.resetdefs-body').style.display='none';root.querySelector('.chev').style.transform='rotate(0deg)';localStorage.setItem('resetDefaultsOpen','0');">Cancel</button>
                      <button style="background:var(--battman-green-border-strong);border:none;border-radius:4px;color:white;font-size:12px;padding:6px 14px;cursor:pointer;" onclick="event.stopPropagation();
                        var box=this.closest('.resetdefs');
                        var inputs=box.querySelectorAll('.def-ctrl input[type=text]');
                        var nd={gridChargingPositive:{},gridDischarging:{},spikeSelling:{},needyCurve:{},watchdog:{},billing:{}};
                        var keys=['buyProrateSOCOffset','buyHighSOCOffset','sellProrateSOCOffset','sellLowSOCOffset','sellSpikePrice1','sellSpikeSOC1','sellSpikePrice2','sellSpikeSOC2','needyTriggerPVGap','needyTriggerConsumption','watchdogScriptNotRunLimit','watchdogScriptDisabledLimit','dailyNetworkCharge','billDayOfMonth'];
                        var secs=['gridChargingPositive','gridChargingPositive','gridDischarging','gridDischarging','spikeSelling','spikeSelling','spikeSelling','spikeSelling','needyCurve','needyCurve','watchdog','watchdog','billing','billing'];
                        inputs.forEach(function(inp,i){if(keys[i])nd[secs[i]][keys[i]]=parseFloat(inp.value);});
                        document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{parameters_update_event}}',event_data:{action:'SetDefaults',defaults:nd}});
                        ">Save defaults</button>
                    </div>
                  </div>
                </div>
              </div>`;
            ]]]
cards: []
