        custom_fields:
          content: |
            [[[
              const buyEnt  = states['{{power_provider_buy}}'];
              const sellEnt = states['{{power_provider_sell}}'];
              if (!buyEnt) return '<div style="padding:16px;color:var(--battman-text-muted)">Loading…</div>';

              const buyAttr  = buyEnt.attributes  || {};
              const sellAttr = sellEnt?.attributes || {};
              const h        = parseInt(buyAttr.selectedHour ?? new Date().getHours());
              const provider   = buyAttr.provider ?? 'Amber';
              const activeTab   = localStorage.getItem('pvTariffTab') || 'buy';

              const buyTariff  = (buyAttr.tariff  || [])[h] || {priceNormal:0, priceBonus:0, limit:0};
              const sellTariff = (sellAttr.tariff || [])[h] || {priceNormal:0, priceBonus:0, limit:0};

              const hourNames = ['12am','1am','2am','3am','4am','5am','6am','7am','8am',
                                 '9am','10am','11am','12pm','1pm','2pm','3pm','4pm','5pm',
                                 '6pm','7pm','8pm','9pm','10pm','11pm'];

              const EVT = '{{power_provider_event}}';
              const HA  = () => document.querySelector('home-assistant').hass;

              function fire(data) {
                HA().connection.sendMessage({type:'fire_event', event_type: EVT, event_data: data});
              }

              function numTariff(side, item, val, sfx) {
                const attr = side === 'buy' ? 'tariffBuy' : 'tariffSell';
                return `<div class="field"><input type="text" inputmode="decimal" value="${val}"
                  onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"
                  onchange="(function(el){document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'${EVT}',event_data:{attribute:'${attr}',hour:${h},item:'${item}',value:parseFloat(el.value)||0}})})(this)">
                  <span class="sfx">${sfx}</span></div>`;
              }

              const buyPanel = `
                <div class="subdiv" style="margin-top:10px;">Hour ${h} — Buy tariff</div>
                <div class="rows" style="border-top:none;">
                  <div class="row"><div class="lbl"><div class="name">Normal price</div><div class="desc">Standard buy rate for this hour</div></div>${numTariff('buy','priceNormal', buyTariff.priceNormal.toFixed(4), 'c/kWh')}</div>
                  <div class="row"><div class="lbl"><div class="name">Bonus price</div><div class="desc">Discounted rate when usage is below limit</div></div>${numTariff('buy','priceBonus', buyTariff.priceBonus.toFixed(4), 'c/kWh')}</div>
                  <div class="row"><div class="lbl"><div class="name">Bonus limit</div><div class="desc">Max usage (kWh) eligible for bonus price</div></div>${numTariff('buy','limit', buyTariff.limit.toFixed(1), 'kWh')}</div>
                </div>`;

              const sellPanel = `
                <div class="subdiv" style="margin-top:10px;">Hour ${h} — Sell tariff</div>
                <div class="rows" style="border-top:none;">
                  <div class="row"><div class="lbl"><div class="name">Normal price</div><div class="desc">Standard sell/FIT rate for this hour</div></div>${numTariff('sell','priceNormal', sellTariff.priceNormal.toFixed(4), 'c/kWh')}</div>
                  <div class="row"><div class="lbl"><div class="name">Bonus price</div><div class="desc">Enhanced FIT when export is below limit</div></div>${numTariff('sell','priceBonus', sellTariff.priceBonus.toFixed(4), 'c/kWh')}</div>
                  <div class="row"><div class="lbl"><div class="name">Bonus limit</div><div class="desc">Max export (kWh) eligible for bonus FIT</div></div>${numTariff('sell','limit', sellTariff.limit.toFixed(1), 'kWh')}</div>
                </div>`;

              return `<div class="pad">
                <div class="glabel">
                  <div class="glabel-left"><ha-icon icon="mdi:transmission-tower"></ha-icon>Power Provider</div>
                </div>
                <div class="note">Configure your electricity retailer and per-hour tariff rates. Retail mode uses these rates instead of live Amber prices.</div>

                <!-- Provider + Hour selectors -->
                <div class="rows">
                  <div class="row">
                    <div class="lbl"><div class="name">Provider</div><div class="desc">Pricing source for buy/sell decisions</div></div>
                    <select onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()"
                      onchange="(function(el){document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'${EVT}',event_data:{action:'SetValue',provider:el.value}})})(this)">
                      <option value="Amber" ${provider==='Amber'?'selected':''}>Amber (live)</option>
                      <option value="Retail" ${provider==='Retail'?'selected':''}>Retail (fixed)</option>
                    </select>
                  </div>
                  <div class="row" style="${provider === 'Amber' ? 'display:none' : ''}">
                    <div class="lbl"><div class="name">Hour</div><div class="desc">Select hour to configure</div></div>
                    <div class="hpick">
                      <button ontouchstart="event.stopPropagation()" class="hbtn" onclick="event.stopPropagation();document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'${EVT}',event_data:{attribute:'selectedHour',value:${(h+23)%24}}})">&#8249;</button>
                      <div class="hval">${h}</div>
                      <button ontouchstart="event.stopPropagation()" class="hbtn" onclick="event.stopPropagation();document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'${EVT}',event_data:{attribute:'selectedHour',value:${(h+1)%24}}})">&#8250;</button>
                    </div>
                  </div>
                </div>

                <div style="${provider === 'Amber' ? 'display:none' : ''}">
                  <!-- Buy / Sell tab toggle -->
                  <div style="display:flex;gap:2px;margin:16px 16px 0;background:var(--battman-surface-popup);border-radius:6px;padding:3px;border:1px solid var(--battman-border-neutral);">
