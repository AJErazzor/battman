          var(--battman-green-border-strong);
          --ha-switch-checked-thumb-background-color:
          var(--battman-green); }
        custom_fields:
          content: |
            [[[
              // Dashboard options card v1.2.1 (2026-10-05): theme switch redraws the dashboard in place (no app reload).
              const p = entity.attributes;

              // Toggle → fires SetAttribute on {{parameters}}
              function swParam(attr, val) {
                return `<ha-switch ontouchstart="event.stopPropagation()" ${val?'checked':''} onclick="event.stopPropagation();document.querySelector('home-assistant').hass.connection.sendMessage({type:'fire_event',event_type:'{{parameters_update_event}}',event_data:{action:'SetAttribute','${attr}':${val?'false':'true'}}})"></ha-switch>`;
              }

              // Apply a theme to the current dashboard (URL-detected, no hardcoding). The Battman
              // theme studio's Make Active uses this too, so both always agree.
              if (!window.__applyDashboardTheme) {
                window.__applyDashboardTheme = function(theme) {
                  const hass = document.querySelector('home-assistant').hass;
                  const urlPath = window.location.pathname.split('/').filter(Boolean)[0];
                  if (!theme || !urlPath) return;
                  hass.connection.sendMessagePromise({type: 'lovelace/config', url_path: urlPath}).then(function(config) {
                    // Battman managed dashboard: set the strategy's theme so it stays managed
                    // (every Battman view takes it, and Battman's mode colours sensor follows it)
                    if (config.strategy && config.strategy.type === 'custom:battman') config.strategy.theme = theme;
                    else (config.views || []).forEach(function(v) { v.theme = theme; });
                    return hass.connection.sendMessagePromise({type: 'lovelace/config/save', url_path: urlPath, config: config});
                  }).then(function() {
                    // Every view got this theme, so every cached key for this dashboard
                    // needs updating, not just the current view's -- otherwise switching
                    // views afterward would still show the stale pre-change value.
                    window.__dashboardThemeCache = window.__dashboardThemeCache || {};
                    Object.keys(window.__dashboardThemeCache).forEach(function(key) {
                      if (key.indexOf(urlPath + '/') === 0) window.__dashboardThemeCache[key] = theme;
                    });
                    console.info('[dashboard theme] applied', theme, 'to', urlPath); (function(){ function f(r,d){ if(!r||d>6) return null; var e=r.querySelector&&r.querySelector('ha-panel-lovelace'); if(e) return e; var a=r.querySelectorAll?r.querySelectorAll('*'):[]; for(var i=0;i<a.length;i++){ if(a[i].shadowRoot){ var x=f(a[i].shadowRoot,d+1); if(x) return x; } } return null; } var p=f(document,0); if(p&&typeof p._fetchConfig==='function'){ Promise.resolve(p._fetchConfig(false)).catch(function(){ window.location.reload(); }); } else { window.location.reload(); } })();
                  }).catch(function(err) {
                    console.error('[dashboard theme] failed:', err);
                    alert('Failed to apply theme: ' + (err && err.message ? err.message : err));
                  });
                };
              }
              if (!window.__setDashThemeSelect) {
                window.__setDashThemeSelect = function(theme, tries) {
                  if (!theme) return;
                  tries = tries || 0;
                  var out = [];
                  (function pierce(root) {
                    root.querySelectorAll('select.__dashtheme').forEach(function(s){ out.push(s); });
                    root.querySelectorAll('*').forEach(function(el){ if (el.shadowRoot) pierce(el.shadowRoot); });
                  })(document);
                  if (!out.length && tries < 6) { setTimeout(function(){ window.__setDashThemeSelect(theme, tries + 1); }, 200); return; }
                  out.forEach(function(s){ if (s.value !== theme) s.value = theme; });
                };
              }
              const themeNames = Object.keys(hass.themes.themes || {}).filter(function(n){return /^battman /i.test(n);}).sort();

              // button-card renders inside a Shadow DOM, so mutating a <select> from an
              // async callback via document.getElementById can't reach it. Instead: fetch
              // the real current theme once into a global cache, and let the template's
              // own frequent natural re-renders (button-card re-evaluates this on every
              // hass update) pick it up synchronously via the `selected` attribute below.
              window.__dashboardThemeCache = window.__dashboardThemeCache || {};
              const urlPath = window.location.pathname.split('/').filter(Boolean)[0];
              const viewPath = window.location.pathname.split('/').filter(Boolean)[1];
              const cacheKey = urlPath + '/' + (viewPath || '');
              if (urlPath && window.__dashboardThemeCache[cacheKey] === undefined) {
                window.__dashboardThemeCache[cacheKey] = null; // fetching sentinel, avoids duplicate requests
                hass.connection.sendMessagePromise({type: 'lovelace/config', url_path: urlPath}).then(function(cfg) {
                  const views = cfg.views || [];
                  const view = views.find(function(v) { return v.path === viewPath; }) || views[0];
                  window.__dashboardThemeCache[cacheKey] = (cfg.strategy && cfg.strategy.type === 'custom:battman')
                    ? (cfg.strategy.theme || '') : ((view && view.theme) || '');
                  window.__setDashThemeSelect(window.__dashboardThemeCache[cacheKey]);
                }).catch(function() { window.__dashboardThemeCache[cacheKey] = ''; });
              }
              const currentTheme = window.__dashboardThemeCache[cacheKey] || '';
              // no theme set yet: say so instead of showing the first theme as if it were chosen
              const themeOptions = (currentTheme ? '' : '<option value="" disabled selected>Not set</option>') + themeNames.map(function(n) {
                return `<option value="${n}"${n === currentTheme ? ' selected' : ''}>${n.replace(/^battman /i,"")}</option>`;
              }).join('');

              return `<div class="pad">
                <div class="glabel">
                  <div class="glabel-left"><ha-icon icon="mdi:view-dashboard"></ha-icon>Dashboard options</div>
                </div>
                <div class="note">Controls how the dashboard displays battery control options.</div>
                <div class="rows">
                  <!-- simpleBatteryMode: show simplified buy/sell/self-consume buttons instead of full mode controls -->
                  <div class="row"><div class="lbl"><div class="name">Simple battery mode</div><div class="desc">Show simplified buy / sell / self-consume buttons instead of full mode controls</div></div>${swParam('simpleBatteryMode', p.simpleBatteryMode)}</div>
                  <div class="row"><div class="lbl"><div class="name">Always show override timer</div><div class="desc">Keep the override timer control visible even when no timer is running</div></div>${swParam('alwaysShowOverrideTimer', p.alwaysShowOverrideTimer === 'show')}</div>
                  <div class="row"><div class="lbl"><div class="name">Dashboard theme</div><div class="desc">Applies to every view of this dashboard</div></div><select class="__dashtheme" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" onchange="window.__applyDashboardTheme(this.value)">${themeOptions}</select></div>
                </div>
              </div>`;
            ]]]
