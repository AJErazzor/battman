                  <div class="row"><div class="lbl"><div class="name">Q2 &middot; Oct &#8211; Dec</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">${numField('preSystemBillQ2', p.preSystemBillQ2??0, '$')}<span class="qdaily">${q2daily}</span></div></div>
                  <div class="row"><div class="lbl"><div class="name">Q3 &middot; Jan &#8211; Mar</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">${numField('preSystemBillQ3', p.preSystemBillQ3??0, '$')}<span class="qdaily">${q3daily}</span></div></div>
                  <div class="row"><div class="lbl"><div class="name">Q4 &middot; Apr &#8211; Jun</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">${numField('preSystemBillQ4', p.preSystemBillQ4??0, '$')}<span class="qdaily">${q4daily}</span></div></div>
                  <div class="subdiv">Inflation adjustment</div>
