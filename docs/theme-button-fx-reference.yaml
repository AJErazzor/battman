# =====================================================================
# Battman Button-FX — reference & copy-paste example  (COMMENTED OUT)
# =====================================================================
# This whole file is comments, so it adds NO theme by itself (safe to keep).
# It documents the button effects system and gives a ready example theme.
#
# HOW IT WORKS
#   - The effect CSS ('harness') lives on each mode/control button on the
#     Battery Time > Power view (button-card `extra_styles`). It is generic
#     and reads `--fx-*` variables. It does nothing unless a THEME sets them.
#   - A button only animates when it is ACTIVE (its mode/toggle is on) AND
#     the current theme defines that button's fx vars. Otherwise it is plain.
#   - Colours come from the theme palette, so each theme's effect uses its
#     own hues automatically.
#
# TO ENABLE: copy the block below into a real theme (e.g. 'Battman Hunk'),
# remove the leading '# ' from the lines you want, then: Developer Tools >
# YAML > Reload Themes (or `frontend.reload_themes`).
#
# PER-BUTTON VARIABLE CATALOGUE  (replace <ns> with a namespace below)
#   fx-<ns>-chase-display : block            # turn the rotating border ring ON
#   fx-<ns>-chase-gradient: "<gradient>"     # ring colours (conic-gradient)
#   fx-<ns>-chase-duration: "2.5s"           # ring rotation speed
#   fx-<ns>-ring-width    : "2px"            # ring thickness (optional)
#   fx-<ns>-border        : "none"           # hide the normal border so the ring is the frame
#   fx-<ns>-glow-name     : "fx-glow-rainbow" # colour-cycling halo  (or 'fx-glow-mono')
#   fx-<ns>-glow-color    : "var(--battman-yellow)"  # only for fx-glow-mono
#   fx-<ns>-glow-duration : "3s"             # glow pulse speed
#
# NAMESPACES (button -> <ns> -> identity colour -> active when mode/toggle =):
#   enable       Active (system enable)   green   active: 'on'
#   curtail      Curtail (no-export)      amber   active: 'on'
#   buy          Buy                      green   active: 'Charge'
#   sell         Sell                     amber   active: 'Discharge'
#   selfconsume  Self Consume             blue    active: 'Self Consume'
#   sellsolar    Sell Solar               purple  active: 'Float'
#   drain        Drain                    red     active: 'Drain'
#   houseparty   House Party              yellow  active: 'Float Solar Off'
#   hooover      HOOOOVER                 green   active: 'Charge Solar Off'
#
# ---------------------------------------------------------------------
# EXAMPLE THEME: chase + rainbow glow on every button (uncomment to use)
# ---------------------------------------------------------------------
