name: Tests

# The full test suite, including the browser tests. Called by validate.yml (every push and pull
# request) and by release.yml (a release is only published once this passes).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # every test must run here: a skip (for example a browser test that couldn't find
      # Chromium) fails the run instead of passing quietly (see tests/conftest.py)
      BATTMAN_NO_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Install Playwright and Chromium for the browser tests
        run: |
          pw="$RUNNER_TEMP/pw"
          npm install --prefix "$pw" --no-save --no-audit --no-fund playwright@1.63.0
          "$pw/node_modules/.bin/playwright" install --with-deps chromium
          chrome="$(node -e "console.log(require('$pw/node_modules/playwright').chromium.executablePath())")"
          test -x "$chrome"
          echo "BATTMAN_NODE_PATH=$pw/node_modules" >> "$GITHUB_ENV"
          echo "BATTMAN_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Run the tests
        run: python -m pytest -q -n auto -rfEs
